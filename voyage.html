<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-poem: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
  --radius-pill: 999px;
  --maxw: 960px;
  --globe-ocean: #16212E;
  --globe-land: #EDE9E0;
  --globe-coast: #D4B896;
  --globe-grid: rgba(212, 184, 150, 0.18);
  --globe-ambient: rgba(120, 180, 220, 0.18);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.7;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  padding: 20px 0;
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap { max-width: 960px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-family: var(--font-serif); font-weight: 300; font-size: 1.05rem; letter-spacing: 0.15em; color: var(--ink); }
.logo span { color: var(--gold); }
nav ul { list-style: none; display: flex; gap: 28px; align-items: center; }
nav a {
  font-family: var(--font-mono); font-size: 0.55rem; font-weight: 300;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-faded);
  position: relative; padding-bottom: 2px; transition: color 0.3s;
}
nav a::after { content: ''; position: absolute; left: 0; bottom: 0; width: 0; height: 1px; background: var(--gold); transition: width 0.4s ease; }
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
nav a.active { color: var(--ink); }
nav a.active::after { width: 100%; }
@media (max-width: 640px) { header .wrap { flex-wrap: wrap; gap: 8px; } nav ul { gap: 16px; flex-wrap: wrap; } }

/* ===== 舞台 ===== */
.voyage-stage {
  position: relative;
  height: calc(100vh - 84px);
  min-height: 520px;
  overflow: hidden;
  background: var(--paper);
}
#map, #globe {
  position: absolute;
  inset: 0;
  z-index: 1;
}
#map { display: none; background: var(--paper); }
#map.c-mode { filter: sepia(0.25) saturate(1.05) brightness(1.03); }
#globe svg { width: 100%; height: 100%; display: block; }

/* ===== 全息覆盖层 ===== */
.holo-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 400; opacity: 0; transition: opacity 0.6s ease; }
.holo-overlay.show { opacity: 1; }
.holo-grid {
  background-image:
    linear-gradient(rgba(140, 190, 230, 0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140, 190, 230, 0.08) 1px, transparent 1px);
  background-size: 56px 56px;
  animation: grid-scroll 8s linear infinite;
}
@keyframes grid-scroll { from { background-position: 0 0; } to { background-position: 0 56px; } }
.holo-scan {
  background: linear-gradient(180deg, transparent 0%, rgba(140, 190, 230, 0.08) 45%, rgba(140, 190, 230, 0.22) 50%, rgba(140, 190, 230, 0.08) 55%, transparent 100%);
  height: 180px; width: 100%; top: -180px; position: absolute;
  animation: scan-drop 6s linear infinite;
}
@keyframes scan-drop { from { top: -180px; } to { top: 100%; } }
.gold-scan {
  background: linear-gradient(180deg, transparent 0%, rgba(212, 184, 150, 0.08) 45%, rgba(212, 184, 150, 0.22) 50%, rgba(212, 184, 150, 0.08) 55%, transparent 100%);
  height: 140px; width: 100%; top: -140px; position: absolute;
  animation: scan-drop 7s linear infinite;
}
.vignette { box-shadow: inset 0 0 150px 40px rgba(8, 12, 18, 0.5); z-index: 402; }
.corner-frame { position: absolute; width: 44px; height: 44px; border: 1px solid rgba(212, 184, 150, 0.45); z-index: 401; }
.corner-frame.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
.corner-frame.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
.corner-frame.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
.corner-frame.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

/* ===== 构成主义徽章与图例 ===== */
.badge-block {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.badge-title {
  display: flex;
  align-items: stretch;
  background: rgba(247, 245, 240, 0.74);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--gold-light);
  border-radius: 12px;
  overflow: hidden;
}
.badge-title .bt-bar { width: 14px; background: var(--gold); flex-shrink: 0; }
.badge-title .bt-body { padding: 10px 16px; }
.badge-title .bt-en {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.05rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 1;
}
.badge-title .bt-cn {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  letter-spacing: 0.34em;
  color: var(--ink-faded);
  margin-top: 5px;
}
.stats-bar { display: flex; gap: 6px; flex-wrap: wrap; }
.stats-bar .stat-chip {
  font-family: var(--font-mono); font-size: 0.52rem; letter-spacing: 0.1em;
  color: var(--ink-light);
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--gold-light);
  border-radius: 2px;
  padding: 5px 14px;
}
.stats-bar .stat-chip::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 7px; background: repeating-linear-gradient(-45deg, var(--gold) 0 3px, transparent 3px 6px); border-radius: 1px; }
.stats-bar .stat-chip b { color: var(--clay); font-weight: 400; }
.legend-bar {
  position: absolute;
  top: 18px;
  right: 420px;
  z-index: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.5rem;
  letter-spacing: 0.18em;
  color: var(--ink-faded);
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--gold-light);
  border-radius: 999px;
  padding: 6px 16px;
}
.legend-bar .lg-sample {
  width: 34px;
  height: 0;
  border-top: 2px dashed var(--gold);
  position: relative;
}
.legend-bar .lg-sample::after {
  content: '';
  position: absolute; top: -3.5px; left: -4px;
  width: 7px; height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold), #B08D57);
}
/* 斜纹构成主义装饰 */
.diag-band {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 10px;
  z-index: 403;
  background: repeating-linear-gradient(-45deg, var(--gold) 0 10px, transparent 10px 22px);
  opacity: 0.5;
  pointer-events: none;
}

/* ===== 玻璃面板（构成主义标题带） ===== */
.panel-title-band {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.panel-title-band .pt-cn {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 0.95rem;
  letter-spacing: 0.2em;
  color: var(--ink);
}
.panel-title-band .pt-line { flex: 1; height: 1px; background: var(--gold); }

/* ===== 背景日志菜单（常驻背景，点击展开文字） ===== */
.log-menu {
  position: absolute;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 50;
  width: 250px;
  max-width: calc(100vw - 40px);
  max-height: 62vh;
  overflow-y: auto;
  opacity: 0.88;
  pointer-events: auto;
}
.log-menu .lm-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.log-menu .lm-head .lh-cn { font-family: var(--font-display); font-weight: 400; font-size: 0.9rem; letter-spacing: 0.2em; color: var(--ink); }
.log-menu .lm-head .lh-line { flex: 1; height: 1px; background: var(--gold); }
.log-menu .lm-collapse {
  margin: 0;
  padding: 2px 10px;
  border: 1px solid var(--gold-light);
  background: transparent;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  border-radius: 999px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.log-menu .lm-collapse:hover { background: var(--gold-light); color: var(--ink); border-color: var(--gold); }
.log-menu.collapsed { width: auto; }
.log-menu.collapsed .lm-tabs,
.log-menu.collapsed #log-list { display: none; }
.log-menu.collapsed .lm-collapse { transform: rotate(180deg); }
.log-menu.collapsed .lh-line { display: none; }

/* ===== 地图免责声明（可折叠） ===== */
.map-disclaimer {
  position: absolute;
  bottom: 18px;
  left: 24px;
  z-index: 490;
  padding: 0;
  font-family: var(--font-mono);
  font-size: 0.48rem;
  letter-spacing: 0.06em;
  line-height: 1.8;
  color: var(--ink-faded);
  background: rgba(247, 245, 240, 0.66);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--gold-light);
  border-radius: 999px;
  opacity: 0.82;
  transition: opacity 0.3s, border-radius 0.3s;
  overflow: hidden;
}
.map-disclaimer:hover { opacity: 1; }
.map-disclaimer .md-toggle {
  margin: 0;
  padding: 6px 16px;
  border: none;
  background: transparent;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.52rem;
  letter-spacing: 0.14em;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s, background 0.2s;
}
.map-disclaimer .md-toggle:hover { color: var(--ink); background: var(--gold-light); }
.map-disclaimer .md-body {
  display: none;
  max-width: 440px;
  padding: 10px 16px 12px;
  border-top: 1px solid var(--gold-light);
}
.map-disclaimer.open { border-radius: 10px; }
.map-disclaimer.open .md-toggle { display: block; width: 100%; text-align: left; }
.map-disclaimer.open .md-body { display: block; }
.map-disclaimer b { color: var(--ink-light); font-weight: 400; }
.log-menu .lm-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--gold-light);
  padding-bottom: 8px;
}
.log-menu .lm-tab {
  margin: 0;
  padding: 4px 16px;
  border: 1px solid var(--gold-light);
  background: transparent;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.56rem;
  letter-spacing: 0.12em;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.log-menu .lm-tab:hover { color: var(--ink); border-color: var(--gold); }
.log-menu .lm-tab.active { background: var(--gold); color: var(--paper); border-color: var(--gold); }
/* 菜单项：默认只显标题（日期+地点），点击展开文字 */
.log-item {
  margin-bottom: 10px;
  border: 1px solid var(--gold-light);
  border-left: 2px solid var(--gold);
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  overflow: hidden;
}
.log-item:hover { background: rgba(237, 233, 226, 0.85); }
.log-item.sel { border-color: var(--clay); border-left-color: var(--clay); }
.log-item .li-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 9px 14px;
}
.log-item .li-head .li-date {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--gold);
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.log-item .li-head .li-place {
  font-family: var(--font-serif);
  font-size: 1rem;
  color: var(--ink);
  letter-spacing: 0.06em;
}
.log-item.sel .li-head .li-place { color: var(--clay); }
.log-item .li-body {
  display: none;
  padding: 0 14px 12px;
  border-top: 1px dashed var(--gold-light);
  margin-top: 2px;
}
.log-item.open .li-body { display: block; padding-top: 10px; }
.log-item .li-text { font-family: var(--font-serif); font-size: 0.86rem; color: var(--ink-light); line-height: 1.9; }
.log-item .li-poem { font-family: var(--font-mono); font-size: 0.52rem; color: var(--clay); letter-spacing: 0.04em; margin-top: 8px; }
/* ===== 右侧诗歌面板 ===== */
.poem-panel {
  position: absolute;
  top: 18px;
  right: 18px;
  bottom: 90px;
  width: 380px;
  max-width: calc(100vw - 36px);
  z-index: 450;
  background: rgba(247, 245, 240, 0.86);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--gold-light);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.poem-panel.hidden { opacity: 0; pointer-events: none; transform: translateX(16px); }
.poem-panel .pp-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--gold-light); }
.poem-panel .pp-eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 6px; }
.poem-panel .pp-eyebrow::before { content: ''; width: 16px; height: 1px; background: var(--gold); }
.poem-panel .pp-place { font-family: var(--font-serif); font-weight: 400; font-size: 1.3rem; letter-spacing: 0.04em; color: var(--ink); }
.poem-panel .pp-meta { font-family: var(--font-mono); font-size: 0.56rem; color: var(--ink-faded); margin-top: 4px; letter-spacing: 0.06em; }
.poem-panel .pp-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 20px; }
.poem-panel .pp-poem-title { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 400; color: var(--ink); margin-bottom: 2px; letter-spacing: 0.04em; }
.poem-panel .pp-poem-author { font-family: var(--font-mono); font-size: 0.56rem; color: var(--ink-faded); margin-bottom: 12px; letter-spacing: 0.08em; }
.poem-panel .pp-poem-body {
  font-family: var(--font-poem); font-size: 0.95rem; line-height: 2; letter-spacing: 0.02em;
  color: var(--ink); white-space: pre-line; padding: 14px 0;
  border-top: 1px solid var(--gold-light); border-bottom: 1px solid var(--gold-light); margin-bottom: 14px;
}
.poem-panel .pp-log { font-family: var(--font-serif); font-size: 0.9rem; color: var(--ink-light); font-style: italic; margin-bottom: 14px; line-height: 1.8; }
.poem-panel .pp-log-main {
  font-family: var(--font-serif);
  font-size: 1rem;
  line-height: 2;
  color: var(--ink);
  padding: 6px 0 16px;
  border-bottom: 1px solid var(--gold-light);
  margin-bottom: 16px;
}
.poem-panel .pp-related-title {
  font-family: var(--font-mono);
  font-size: 0.52rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin-bottom: 8px;
}
.poem-panel .pp-images { display: flex; flex-direction: column; gap: 10px; }
.poem-panel .pp-images img { width: 100%; border-radius: 10px; filter: grayscale(1); cursor: pointer; transition: filter 0.3s; border: 1px solid var(--gold-light); }
.poem-panel .pp-images img:hover { filter: grayscale(0); }
.poem-panel .pp-empty-images { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-faded); padding: 10px 0; }
.poem-panel .pp-foot { padding: 10px 20px; border-top: 1px solid var(--gold-light); display: flex; gap: 10px; align-items: center; }
.poem-panel .pp-read { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; color: var(--ink); border: 1px solid var(--gold); border-radius: var(--radius-pill); padding: 7px 18px; background: transparent; cursor: pointer; transition: background 0.25s, color 0.25s; }
.poem-panel .pp-read:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.poem-panel .pp-close { margin-left: auto; background: transparent; border: none; color: var(--ink-faded); font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; padding: 4px 8px; }
.poem-panel .pp-close:hover { color: var(--clay); }
.poem-panel .pp-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; text-align: center; }
.poem-panel .pp-empty .pe-ico { font-family: var(--font-serif); font-size: 1.6rem; color: var(--gold); }
.poem-panel .pp-empty .pe-txt { font-family: var(--font-mono); font-size: 0.58rem; color: var(--ink-faded); letter-spacing: 0.12em; line-height: 2; }

/* ===== 缩放控制 ===== */
.zoom-widget {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  background: rgba(247, 245, 240, 0.8);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--gold-light);
  border-radius: 12px;
  padding: 4px;
  overflow: hidden;
  flex-direction: row;
  gap: 4px;
}
.zoom-widget button {
  width: 36px; height: 36px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.zoom-widget button:hover { background: var(--gold); color: var(--paper); }
.zoom-widget .zw-slider {
  width: 140px;
  margin: 0 8px;
  -webkit-appearance: none;
  appearance: none;
  height: 2px;
  background: linear-gradient(90deg, var(--gold) var(--fill, 10%), var(--gold-light) var(--fill, 10%));
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.zoom-widget .zw-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--gold);
}
.zoom-widget .zw-level {
  min-width: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  color: var(--ink-faded);
  border-left: 1px solid var(--gold-light);
  padding-left: 6px;
}

/* ===== 漂点 ===== */
.voyage-pin {
  width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold), #B08D57);
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1.5px var(--gold), 0 0 14px 2px rgba(212, 184, 150, 0.7);
  cursor: pointer;
  transition: transform 0.25s;
  position: relative;
}
.amap-marker-content { position: relative; }
.amap-marker-content .voyage-pin { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
.voyage-pin:hover { transform: scale(1.25); }
.voyage-pin.active-pin { background: radial-gradient(circle at 35% 30%, var(--clay), #8E4A32); border-color: #fff; box-shadow: 0 0 0 2px var(--clay), 0 0 22px 4px rgba(184, 92, 58, 0.75); }
.globe-pin {

  pointer-events: all;
}
.globe-pin circle.pin-dot { fill: var(--gold); stroke: var(--paper); stroke-width: 1.5; }
.globe-pin circle.pin-halo { fill: none; stroke: rgba(212, 184, 150, 0.8); stroke-width: 1; }
.globe-pin:hover circle.pin-dot { fill: var(--clay); }

/* ===== 行迹线 ===== */
.trail-poly { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; opacity: 0.9; }
.trail-poly.active-seg { stroke: var(--clay); stroke-dasharray: 10 4; }

/* ===== 灯箱 ===== */
.lightbox { position: fixed; inset: 0; z-index: 3000; background: rgba(20, 18, 16, 0.92); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.35s; }

.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 10px 60px rgba(0,0,0,0.5); }

/* ===== 启动动画 ===== */
.voyage-stage.boot #globe { animation: boot-globe-fade 1.3s ease 0.1s forwards; }
@keyframes boot-globe-fade { from { opacity: 0; } to { opacity: 1; } }
.voyage-stage.boot .holo-grid { opacity: 0; animation: boot-grid-fade 1.1s ease 0.15s forwards; }
@keyframes boot-grid-fade { from { opacity: 0; } to { opacity: 1; } }

@keyframes boot-scan { 0% { top: -40%; opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
.voyage-stage.boot .gold-scan { animation: boot-scan-gold 1.7s ease-out 0.2s forwards; }

@keyframes boot-corners { to { opacity: 1; } }

.voyage-stage.boot .log-menu { opacity: 0; animation: boot-fade 0.8s ease 0.7s forwards; }
@keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }

/* ===== 高德地图覆写 ===== */
.amap-copyright, .amap-logo { opacity: 0.5 !important; }
.amap-container { background: var(--paper) !important; font-family: var(--font-sans); }

/* ===== 侧边主题栏 ===== */

<script>
// ===== 主题 =====
(function() {
  var saved = localStorage.getItem('theme');
  var hour = new Date().getHours();
  var initial = (saved && ['light','dark','eye-care'].indexOf(saved) !== -1) ? saved : ((hour >= 19 || hour < 6) ? 'dark' : 'light');
  var style = document.createElement('style');
  style.textContent =
    '[data-theme="dark"] { --paper: #1E1E1C; --paper-dark: #2A2A27; --ink: #ECECE5; --ink-light: #C4C4BE; --ink-faded: #8A8A85; --gold: #D4A373; --gold-light: #4A4A45; --clay: #E55A5F; --globe-ocean: #0D121C; --globe-land: #D9D3C8; --globe-coast: #D4A373; --globe-grid: rgba(212, 163, 115, 0.18); --globe-ambient: rgba(90, 160, 210, 0.2); } ' +
    '[data-theme="eye-care"] { --paper: #ECF3E5; --paper-dark: #DEE8D4; --ink: #3A4632; --ink-light: #5C6A4F; --ink-faded: #82906F; --gold: #BDA26C; --gold-light: #C6D3B4; --clay: #B2674F; --globe-ocean: #22281F; --globe-land: #E3E8DA; --globe-coast: #BDA26C; --globe-grid: rgba(189, 162, 108, 0.18); --globe-ambient: rgba(150, 190, 130, 0.18); } ' +
    '[data-theme="dark"] header { background: rgba(30,30,28,0.72); } ' +
    '[data-theme="eye-care"] header { background: rgba(236,243,229,0.72); } ' +
    '[data-theme="dark"] .badge-title, [data-theme="dark"] .stats-bar .stat-chip, [data-theme="dark"] .legend-bar, [data-theme="dark"] .log-item, [data-theme="dark"] .zoom-widget, [data-theme="dark"] .poem-panel, [data-theme="dark"] .side-theme { background: rgba(30,30,28,0.84); } ' +
    '[data-theme="eye-care"] .badge-title, [data-theme="eye-care"] .stats-bar .stat-chip, [data-theme="eye-care"] .legend-bar, [data-theme="eye-care"] .log-item, [data-theme="eye-care"] .zoom-widget, [data-theme="eye-care"] .poem-panel, [data-theme="eye-care"] .side-theme { background: rgba(236,243,229,0.86); }';
  if (initial === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', initial);
  }
  document.head.appendChild(style);

  var btns = document.querySelectorAll('#theme-side .theme-btn');
  function applyTheme(theme) {
    if (theme === 'light') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    btns.forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-theme') === theme); });
    redrawForTheme();
  }
  btns.forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-theme') === initial);
    b.addEventListener('click', function() { applyTheme(this.getAttribute('data-theme')); });
  });
  window.__applyTheme = applyTheme;
})();

// ===== 漂流页主逻辑 =====
(function() {
  'use strict';
  var stage = document.getElementById('stage');
  var mapEl = document.getElementById('map');
  var globeEl = document.getElementById('globe');
  var statsBar = document.getElementById('stats-bar');
  var poemPanel = document.getElementById('poem-panel');
  var ppPlace = document.getElementById('pp-place');
  var ppMeta = document.getElementById('pp-meta');
  var ppScroll = document.getElementById('pp-scroll');
  var ppRead = document.getElementById('pp-read');
  var ppClose = document.getElementById('pp-close');
  var logList = document.getElementById('log-list');
  var logMenu = document.getElementById('log-menu');
  var lmCollapse = document.getElementById('lm-collapse');
  var zoomInBtn = document.getElementById('zoom-in');
  var zoomOutBtn = document.getElementById('zoom-out');
  var zoomLevel = document.getElementById('zoom-level');
  var zoomSlider = document.getElementById('zoom-slider');
  var holoGrid = document.getElementById('holo-grid');
  var holoScan = document.getElementById('holo-scan');
  var goldScan = document.getElementById('gold-scan');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  var logs = [], poems = [], authors = [], markers = {}, logById = {};
  var currentLog = null;
  var worldLand = null;

  // —— 模式：globe（全球·球体） / map（局部·平面） ——
  var MODE_GLOBE = 'globe', MODE_MAP = 'map';
  var mode = MODE_GLOBE;
  var globeLevel = 1;        // 连续缩放级 1..10
  var GLOBE_MAX = 10;

  // ===== 高德平面地图（国界符合一个中国原则） =====
  var map = null;
  var trailPolylines = [];
  try {
    map = new AMap.Map('map', {
      zoom: 7,
      center: [104.5, 35.5],
      viewMode: '2D',
      zoomEnable: true,
      dragEnable: true,
      keyboardEnable: false,
      doubleClickZoom: false,
      scrollWheel: false,
      resizeEnable: true
    });
  } catch (e) {
    map = null;
  }
  function onMapZoomChange() {
    if (!map) return;
    var z = map.getZoom();
    if (z < 5) switchToGlobe({ lng: map.getCenter().lng, lat: map.getCenter().lat });
  }
  if (map) map.on('zoomend', onMapZoomChange);

  // ===== d3 球体地球 =====
  var svg, projection, path, graticule, globeLayer, bgLayer, landLayer, trailLayer, pinLayer;
  var center = [104.5, 35.5];
  var dims = { w: 0, h: 0 };

  // 解析 CSS 自定义属性为具体色值（SVG 内联 style 不支持 var()，需显式赋值）
  function gcolor(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  var gc = {
    ocean: gcolor('--globe-ocean', '#16212E'),
    land: gcolor('--globe-land', '#EDE9E0'),
    coast: gcolor('--globe-coast', '#D4B896'),
    grid: gcolor('--globe-grid', 'rgba(212,184,150,0.18)'),
    ambient: gcolor('--globe-ambient', 'rgba(120,180,220,0.18)')
  };
  function refreshGlobeColors() {
    gc.ocean = gcolor('--globe-ocean', gc.ocean);
    gc.land = gcolor('--globe-land', gc.land);
    gc.coast = gcolor('--globe-coast', gc.coast);
    gc.grid = gcolor('--globe-grid', gc.grid);
    gc.ambient = gcolor('--globe-ambient', gc.ambient);
  }

  function drawGlobe() {
    var st = document.querySelector('.voyage-stage');
    var w = st ? st.clientWidth : window.innerWidth;
    var h = st ? st.clientHeight : window.innerHeight;
    dims.w = w; dims.h = h;
    if (dims.w === 0 || dims.h === 0) return;
    // 连续缩放：level 1 → 完整球体；level 10 → 球体放大至进入平面地图
    var R = Math.min(dims.w, dims.h) * (0.42 + (globeLevel - 1) * 0.34);

    if (!svg) {
      svg = d3.select(globeEl).append('svg');
      globeLayer = svg.append('g');
      graticule = d3.geoGraticule10();
      projection = d3.geoOrthographic().clipAngle(90);
      path = d3.geoPath(projection);
      // 背景层（球体底 + 经纬网格）永远在最底层
      bgLayer = globeLayer.append('g');
      bgLayer.append('path').attr('class', 'globe-sphere');
      bgLayer.append('path').attr('class', 'globe-graticule');
      landLayer = globeLayer.append('g');
      trailLayer = globeLayer.append('g');
      pinLayer = globeLayer.append('g');
    } else {
      // 保证层级：把背景层移到最底（防止重复渲染时顺序错乱）
      globeLayer.node().insertBefore(bgLayer.node(), globeLayer.node().firstChild);
    }
    // 同步 SVG 视口尺寸
    svg.attr('width', dims.w).attr('height', dims.h).style('width', '100%').style('height', '100%');
    projection
      .translate([dims.w / 2, dims.h / 2])
      .scale(R)
      .rotate([-center[0], -center[1]]);
    renderGlobe();
    // 大气辉光（CSS）
    globeEl.style.boxShadow = 'inset -40px -30px 120px rgba(0,0,0,0.5), inset 30px 25px 90px ' + gc.ambient;
  }

  // 主题切换后重绘（CSS 变量已更新）
  function redrawForTheme() {
    refreshGlobeColors();
    if (mode === MODE_GLOBE && svg) {
      globeEl.style.boxShadow = 'inset -40px -30px 120px rgba(0,0,0,0.5), inset 30px 25px 90px ' + gc.ambient;
      renderGlobe();
    }
  }
  window.__redrawForTheme = redrawForTheme;

  function renderGlobe() {
    bgLayer.select('.globe-sphere')
      .attr('d', path({ type: 'Sphere' }))
      .style('fill', gc.ocean)
      .style('stroke', gc.coast)
      .style('stroke-width', '1px');
    bgLayer.select('.globe-graticule')
      .attr('d', path(graticule))
      .style('fill', 'none')
      .style('stroke', gc.grid)
      .style('stroke-width', '0.5px');
    if (worldLand) {
      var land = landLayer.selectAll('path').data(worldLand.features);
      land.enter().append('path')
        .merge(land)
        .attr('d', path)
        .style('fill', gc.land)
        .style('stroke', gc.coast)
        .style('stroke-width', '0.6px');
      land.exit().remove();
    }
    drawGlobePins();
    drawGlobeTrail();
  }

  // 球体上的漂点
  function drawGlobePins() {
    if (!projection) return;
    pinLayer.selectAll('.globe-pin').remove();
    logs.forEach(function(lg) {
      var pt = projection([lg.lng, lg.lat]);
      if (!pt) return;
      var g = pinLayer.append('g')
        .attr('class', 'globe-pin')
        .attr('data-id', lg.id)
        .attr('transform', 'translate(' + pt[0] + ',' + pt[1] + ')');
      g.append('circle').attr('class', 'pin-halo').attr('r', 13).attr('opacity', 0);
      g.append('circle').attr('class', 'pin-dot').attr('r', 4.5);
      g.on('click', function() {
        selectLog(lg.id, true);
      });
    });
  }

  // 球体上的行迹（大圆弧，link:false 断开）
  function drawGlobeTrail() {
    if (!projection) return;
    trailLayer.selectAll('.trail-arc').remove();
    trailSegments().forEach(function(seg) {
      for (var i = 0; i < seg.length - 1; i++) {
        var a = seg[i], b = seg[i + 1];
        var interp = d3.geoInterpolate([a.lng, a.lat], [b.lng, b.lat]);
        var pts = [];
        for (var t = 0; t <= 40; t++) pts.push(interp(t / 40));
        var line = { type: 'LineString', coordinates: pts };
        trailLayer.append('path')
          .datum(line)
          .attr('class', 'trail-arc trail-poly')
          .attr('d', path);
      }
    });
  }

  // 行迹顺序：按后台 logs.json 数组顺序（用户可调整），link:false 为断点
  function trailSequence() {
    return logs.slice();
  }

  // 行迹分段：按顺序连接，遇 link===false 断开
  function trailSegments() {
    var seq = trailSequence();
    var segs = [];
    var cur = [];
    seq.forEach(function(lg) {
      cur.push(lg);
      if (lg.link === false) { segs.push(cur); cur = []; }
    });
    if (cur.length) segs.push(cur);
    return segs;
  }

  // ===== 模式切换（带冷却锁，防临界点来回跳） =====
  var lastSwitchAt = 0;
  var SWITCH_COOLDOWN = 400;
  function canSwitch() {
    return Date.now() - lastSwitchAt >= SWITCH_COOLDOWN;
  }
  function switchToMap(c) {
    if (mode === MODE_MAP) return;
    if (!canSwitch()) return;
    lastSwitchAt = Date.now();
    mode = MODE_MAP;
    globeEl.style.display = 'none';
    mapEl.style.display = 'block';
    mapEl.classList.add('c-mode');
    holoGrid.classList.remove('show');
    holoScan.classList.remove('show');
    goldScan.classList.add('show');
    if (map) {
      var lng = c.lng || c[0], lat = c.lat || c[1];
      map.setZoomAndCenter(Math.max(map.getZoom(), 6), [lng, lat]);
    }
    zoomLevel.textContent = 'MAP';
    if (zoomSlider) { zoomSlider.value = 10; zoomSlider.style.setProperty('--fill', '100%'); }
  }
  function switchToGlobe(c) {
    if (mode === MODE_GLOBE) return;
    if (!canSwitch()) return;
    lastSwitchAt = Date.now();
    mode = MODE_GLOBE;
    globeLevel = 5;   // 远离切换阈值，避免临界点来回跳
    mapEl.style.display = 'none';
    globeEl.style.display = 'block';
    holoGrid.classList.add('show');
    holoScan.classList.add('show');
    goldScan.classList.remove('show');
    if (c) {
      center = [c.lng, c.lat];
      projection.rotate([-center[0], -center[1]]);
      renderGlobe();
    }
    setTimeout(function() {
      if (mode === MODE_GLOBE) {
        var st = document.querySelector('.voyage-stage');
        var w = st ? st.clientWidth : window.innerWidth;
        var h = st ? st.clientHeight : window.innerHeight;
        if (Math.abs(w - dims.w) > 2 || Math.abs(h - dims.h) > 2) drawGlobe();
      }
    }, 30);
    zoomLevel.textContent = 'GLOBE';
    if (zoomSlider) { zoomSlider.value = globeLevel; syncSlider(); }
  }

  // 缩放控件
  function syncSlider() {
    if (!zoomSlider) return;
    var min = parseFloat(zoomSlider.min), max = parseFloat(zoomSlider.max);
    var pct = ((globeLevel - min) / (max - min)) * 100;
    zoomSlider.style.setProperty('--fill', pct + '%');
  }
  function zoomGlobeTo(level) {
    globeLevel = Math.max(1, Math.min(GLOBE_MAX, level));
    if (globeLevel >= GLOBE_MAX) {
      globeLevel = GLOBE_MAX - 0.6;
      switchToMap({ lng: center[0], lat: center[1] });
    } else {
      drawGlobe();
    }
    syncSlider();
  }
  function zoomGlobeBy(delta) {
    zoomGlobeTo(globeLevel + delta);
  }
  zoomInBtn.addEventListener('click', function() {
    if (mode === MODE_GLOBE) zoomGlobeBy(1);
    else if (map) map.zoomIn();
  });
  zoomOutBtn.addEventListener('click', function() {
    if (mode === MODE_GLOBE) {
      zoomGlobeBy(-1);
    } else if (map) {
      var z = map.getZoom();
      if (z <= 5) switchToGlobe({ lng: map.getCenter().lng, lat: map.getCenter().lat });
      else map.zoomOut();
    }
  });
  // 滑杆无极缩放（拖动连续）
  zoomSlider.addEventListener('input', function() {
    var v = parseFloat(this.value);
    if (mode === MODE_GLOBE) {
      zoomGlobeTo(v);
    } else if (map) {
      // 平面地图：滑杆 1..10 映射到 zoom 5..14
      var z = 5 + ((v - 1) / 9) * 9;
      map.setZoom(Math.round(z));
    }
    this.style.setProperty('--fill', ((v - 1) / 9) * 100 + '%');
  });
  // 滚轮无极缩放：球体 ←→ 平面地图 连续过渡
  globeEl.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (mode !== MODE_GLOBE) return;
    var delta = e.deltaY < 0 ? 0.6 : -0.6;
    zoomGlobeBy(delta);
  }, { passive: false });
  // 地图模式的滚轮缩放（高德原生已关，这里统一接管）
  mapEl.addEventListener('wheel', function(e) {
    if (mode !== MODE_MAP || !map) return;
    e.preventDefault();
    var z = map.getZoom();
    if (e.deltaY < 0) {
      map.setZoom(Math.min(z + 1, 14));
    } else {
      if (z <= 5) switchToGlobe({ lng: map.getCenter().lng, lat: map.getCenter().lat });
      else map.setZoom(z - 1);
    }
  }, { passive: false });

  // 拖动旋转球体（自由查看地图）
  var dragState = null;
  globeEl.addEventListener('pointerdown', function(e) {
    if (mode !== MODE_GLOBE) return;
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    // 点在漂点上时不做拖拽捕获，交给点击
    if (e.target.closest && e.target.closest('.globe-pin')) return;
    dragState = { x: e.clientX, y: e.clientY, moved: false };
    globeEl.setPointerCapture(e.pointerId);
  });
  globeEl.addEventListener('pointermove', function(e) {
    if (!dragState || mode !== MODE_GLOBE) return;
    var dx = e.clientX - dragState.x;
    var dy = e.clientY - dragState.y;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;
    if (!dragState.moved) return;
    center[0] = ((center[0] - dx * 0.35) + 540) % 540 - 180;
    center[1] = Math.max(-90, Math.min(90, center[1] + dy * 0.25));
    dragState.x = e.clientX;
    dragState.y = e.clientY;
    projection.rotate([-center[0], -center[1]]);
    renderGlobe();
  });
  function endDrag(e) {
    if (!dragState) return;
    dragState = null;
  }
  globeEl.addEventListener('pointerup', endDrag);
  globeEl.addEventListener('pointercancel', endDrag);

  // ===== 背景日志菜单（常驻背景，点击展开文字） =====
  // 收纳 / 展开
  lmCollapse.addEventListener('click', function() {
    logMenu.classList.toggle('collapsed');
    lmCollapse.textContent = logMenu.classList.contains('collapsed') ? '»' : '«';
  });
  // 免责声明折叠
  var mdToggle = document.getElementById('md-toggle');
  var mdDisclaimer = document.getElementById('map-disclaimer');
  mdToggle.addEventListener('click', function() {
    mdDisclaimer.classList.toggle('open');
  });
  // —— 地点 / 时间 双视图 ——
  var logView = 'place';
  document.getElementById('log-tabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.lm-tab');
    if (!btn) return;
    logView = btn.dataset.view;
    document.querySelectorAll('#log-tabs .lm-tab').forEach(function(b) {
      b.classList.toggle('active', b === btn);
    });
    renderLogMenu();
  });

  function renderLogMenu() {
    var seq = trailSequence();
    var poemById = {};
    poems.forEach(function(p) { poemById[p.id] = p; });
    logList.innerHTML = '';
    var items = logView === 'place' ? seq : seq.slice().sort(function(a, b) { return String(a.date).localeCompare(String(b.date)); });
    items.forEach(function(lg) {
      var poem = lg.poemId ? poemById[lg.poemId] : null;
      var div = document.createElement('div');
      div.className = 'log-item';
      div.setAttribute('data-logid', lg.id);
      div.innerHTML =
        '<div class="li-head">' +
          '<span class="li-date">' + (lg.date ? fmtDate(lg.date) : '') + '</span>' +
          '<span class="li-place">' + escapeHtml(lg.place) + '</span>' +
        '</div>' +
        '<div class="li-body">' +
          (lg.text ? '<div class="li-text">' + escapeHtml(lg.text) + '</div>' : '<div class="li-text" style="color:var(--ink-faded);">— 暂无日志文字 —</div>') +
          (poem ? '<div class="li-poem">↳ 关联《' + escapeHtml(poem.title) + '》</div>' : '') +
        '</div>';
      div.addEventListener('click', function() {
        var isOpen = div.classList.contains('open');
        logList.querySelectorAll('.log-item.open').forEach(function(n) { n.classList.remove('open'); });
        if (!isOpen) div.classList.add('open');
        selectLog(lg.id, true);
      });
      logList.appendChild(div);
    });
  }

  // ===== 选择地点 =====
  function selectLog(id, fromGlobe) {
    currentLog = logById[id];
    renderPoemPanel(currentLog);
    // 高亮
    if (mode === MODE_GLOBE) {
      center = [currentLog.lng, currentLog.lat];
      projection.rotate([-center[0], -center[1]]);
      renderGlobe();
    } else {
      Object.keys(markers).forEach(function(mid) {
        var el = markers[mid].getContent && markers[mid].getContent().querySelector ? markers[mid].getContent().querySelector('.voyage-pin') : null;
        if (el) el.classList.toggle('active-pin', mid === id);
      });
      if (map) {
        var g = wgs84ToGcj02(currentLog.lng, currentLog.lat);
        map.setZoomAndCenter(Math.max(map.getZoom(), 9), g);
      }
    }
    // 日志抽屉高亮（地点/时间视图通用）
    logList.querySelectorAll('[data-logid]').forEach(function(node) {
      node.classList.toggle('sel', node.getAttribute('data-logid') === id);
    });
    // 背景菜单高亮
    logList.querySelectorAll('[data-logid]').forEach(function(node) {
      node.classList.toggle('sel', node.getAttribute('data-logid') === id);
    });
  }

  function renderPoemPanel(lg) {
    poemPanel.classList.remove('hidden');
    ppPlace.textContent = lg.place || '无名之地';
    var metaParts = [];
    if (lg.date) metaParts.push(fmtDate(lg.date));
    if (lg.authorId) metaParts.push('作者 ' + lg.authorId);
    ppMeta.textContent = metaParts.join(' · ');

    var poem = null;
    if (lg.poemId) poems.forEach(function(p) { if (p.id === lg.poemId) poem = p; });
    if (poem) ppRead.href = 'read.html?id=' + lg.poemId;
    else ppRead.href = '#';

    var html = '';
    // 主体：日志自己的内容（用户补充）
    if (lg.text) {
      html += '<div class="pp-log-main">' + escapeHtml(lg.text) + '</div>';
    } else {
      html += '<div class="pp-empty-images" style="padding:4px 0 14px;">— 此日志暂无文字 —</div>';
    }
    // 可选：关联诗歌（若有）
    if (poem) {
      html += '<div class="pp-related-title">关联诗歌</div>';
      html += '<div class="pp-poem-title">' + escapeHtml(poem.title) + '</div>';
      html += '<div class="pp-poem-author">' + escapeHtml(poem.author || '') + ' · ' + escapeHtml(poem.series || '') + '</div>';
      html += '<div class="pp-poem-body">' + escapeHtml(poem.content || '') + '</div>';
    } else if (lg.poemId) {
      html += '<div class="pp-related-title">关联诗歌</div>';
      html += '<div class="pp-poem-author">该诗暂未收录</div>';
    }
    if (poem && poem.images && poem.images.length) {
      html += '<div class="pp-images">';
      poem.images.forEach(function(src) {
        html += '<img src="' + escapeHtml(src) + '" alt="" loading="lazy" data-src="' + escapeHtml(src) + '">';
      });
      html += '</div>';
    }
    ppScroll.innerHTML = html;
    ppScroll.scrollTop = 0;
    ppScroll.querySelectorAll('.pp-images img').forEach(function(img) {
      img.addEventListener('click', function() {
        lightboxImg.src = img.getAttribute('data-src');
        lightbox.classList.add('show');
      });
    });
    // 「去阅读」按钮显隐
    ppRead.style.display = poem ? 'inline-block' : 'none';
  }

  ppClose.addEventListener('click', function() {
    poemPanel.classList.add('hidden');
    Object.keys(markers).forEach(function(mid) {
      var el = markers[mid].getContent ? markers[mid].getContent().querySelector('.voyage-pin') : null;
      if (el) el.classList.remove('active-pin');
    });
    logList.querySelectorAll('[data-logid]').forEach(function(node) { node.classList.remove('sel'); });
    currentLog = null;
  });
  lightbox.addEventListener('click', function() { lightbox.classList.remove('show'); });

  // WGS84 → GCJ02（高德火星坐标，前端漂点对齐用）
  function wgs84ToGcj02(lng, lat) {
    var a = 6378245.0, ee = 0.00669342162296594323;
    function outOfChina(l, t) { return l < 72.004 || l > 137.8347 || t < 0.8293 || t > 55.8271; }
    function tlat(x, y) {
      var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      r += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
      r += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
      return r;
    }
    function tlng(x, y) {
      var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      r += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
      r += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
      return r;
    }
    if (outOfChina(lng, lat)) return [lng, lat];
    var dLat = tlat(lng - 105.0, lat - 35.0);
    var dLng = tlng(lng - 105.0, lat - 35.0);
    var radLat = lat / 180.0 * Math.PI;
    var magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return [lng + dLng, lat + dLat];
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '.' + m[2] + '.' + m[3];
    return String(iso);
  }
  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = String(s == null ? '' : s);
    return d.innerHTML;
  }

  // ===== 启动动画 =====
  function triggerBoot() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (sessionStorage.getItem('voyage_boot_played') === '1') return;
    sessionStorage.setItem('voyage_boot_played', '1');
    stage.classList.add('boot');
    // 漂点按行迹顺序逐个点亮
    var seq = trailSequence();
    seq.forEach(function(lg, i) {
      pinLayer.selectAll('.globe-pin[data-id="' + lg.id + '"]')
        .style('animation-delay', (0.3 + i * 0.12) + 's');
    });
    // 行迹描线动画
    trailLayer.selectAll('.trail-arc').each(function() {
      var len = this.getTotalLength ? this.getTotalLength() : 400;
      this.setAttribute('stroke-dasharray', len);
      this.setAttribute('stroke-dashoffset', len);
    });
    setTimeout(function() { stage.classList.remove('boot'); }, 3800);
    // boot 结束后重绘球体，确保尺寸正确
    setTimeout(function() {
      if (mode === MODE_GLOBE) drawGlobe();
    }, 3950);
  }

  // ===== 数据加载 =====
  function cacheBust() { return '?t=' + Date.now(); }
  function loadLand() {
    // 优先本地，回退 CDN
    return fetch('data/world-land.json' + cacheBust()).then(function(r) {
      if (!r.ok) throw new Error('land local');
      return r.json();
    }).catch(function() {
      return fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(function(r) {
        if (!r.ok) throw new Error('land cdn');
        return r.json();
      });
    }).then(function(topojsonData) {
      worldLand = topojson.feature(topojsonData, topojsonData.objects.land);
    });
  }
  var loads = [
    fetch('data/logs.json' + cacheBust()).then(function(r) { if (!r.ok) throw new Error('logs'); return r.json(); }),
    fetch('data/poems.json' + cacheBust()).then(function(r) { if (!r.ok) throw new Error('poems'); return r.json(); }),
    fetch('data/authors.json' + cacheBust()).then(function(r) { if (!r.ok) throw new Error('authors'); return r.json(); }),
    loadLand()
  ];
  Promise.all(loads).then(function(results) {
    logs = results[0]; poems = results[1]; authors = results[2];
    logs.forEach(function(lg) { logById[lg.id] = lg; });
    drawGlobe();
    switchToGlobe();
    renderLogMenu();
    // 高德漂点（平面地图）
    logs.forEach(function(lg) {
      var g = wgs84ToGcj02(lg.lng, lg.lat);
      var marker = new AMap.Marker({
        position: g,
        content: '<div class="voyage-pin' + (lg.poemId ? '' : ' dim') + '" data-log="' + lg.id + '"></div>',
        offset: new AMap.Pixel(0, 0),
        zIndex: 100
      });
      marker.on('click', function() { selectLog(lg.id, false); });
      if (map) map.add(marker);
      markers[lg.id] = marker;
    });
    // 平面行迹（分段，link:false 断开）
    trailPolylines.forEach(function(p) { if (map) map.remove(p); });
    trailPolylines = [];
    trailSegments().forEach(function(seg) {
      if (seg.length < 2) return;
      var path = seg.map(function(lg) { return wgs84ToGcj02(lg.lng, lg.lat); });
      var poly = new AMap.Polyline({
        path: path,
        strokeColor: '#D4B896',
        strokeWeight: 2,
        strokeStyle: 'dashed',
        strokeOpacity: 0.85,
        lineJoin: 'round',
        lineCap: 'round',
        zIndex: 50
      });
      if (map) map.add(poly);
      trailPolylines.push(poly);
    });

    statsBar.innerHTML =
      '<span class="stat-chip">漂点 <b>' + logs.length + '</b></span>' +
      '<span class="stat-chip">诗 <b>' + poems.length + '</b></span>' +
      '<span class="stat-chip">作者 <b>' + authors.length + '</b></span>';
    triggerBoot();
  }).catch(function(e) {
    statsBar.innerHTML = '<span class="stat-chip">数据加载失败（' + e.message + '）</span>';
  });

  // 窗口尺寸变化重绘
  var resizeTimer = null;
  window.addEventListener('resize', function() {
    if (mode !== MODE_GLOBE) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      drawGlobe();
    }, 150);
  });
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
