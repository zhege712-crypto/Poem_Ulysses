<title>目录 · 诗歌漂流</title>
<meta name="description" content="诗歌漂流目录 — 按系列和子分类浏览所有诗歌。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-kai: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --radius-md: 12px;
  --radius-pill: 999px;
  --maxw: 1100px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.8;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ===== 导航 ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 22px 0;
  background: color-mix(in srgb, var(--paper) 74%, transparent);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }
nav ul {
  list-style: none;
  display: flex;
  gap: 20px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-light);
  position: relative;
  display: inline-flex; align-items: center; min-height: 44px; padding: 9px 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
nav a.active { color: var(--ink); }
nav a.active::after { width: 100%; }
@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

/* ===== 侧边主题切换 ===== */
.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: color-mix(in srgb, var(--paper) 74%, transparent);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-light);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--ink);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .theme-btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

/* ===== 页面头部 ===== */
.page-head {
  padding: 40px 0 20px;
}
.back-link {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--ink);
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
  padding: 9px 20px;
  border: 1px solid var(--gold);
  border-radius: var(--radius-pill);
  background: var(--paper);
}
.back-link svg {
  width: 15px;
  height: 15px;
  stroke: var(--gold);
}
.back-link:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.back-link:hover svg { stroke: var(--gold); }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 8px;
}
.eyebrow::before {
  content: '';
  width: 16px;
  height: 1px;
  background: var(--gold);
}
.page-head h1 {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
  text-wrap: balance;
}
.page-head .line {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin-top: 10px;
}

/* ===== 控制栏 ===== */
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin: 28px 0 16px;
  flex-wrap: wrap;
}
.controls-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.view-toggle {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--gold-light);
  background: color-mix(in srgb, var(--paper) 60%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-radius: var(--radius-pill);
}
.view-toggle button {
  border: none;
  background: transparent;
  padding: 7px 18px;
  border-radius: var(--radius-pill);
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-faded);
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
}
.view-toggle button.active {
  background: var(--ink);
  color: var(--paper);
}
.view-toggle button:hover:not(.active) { background: var(--gold-light); }
.random-btn {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  padding: 9px 18px;
  border: 1px solid var(--gold-light);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: var(--radius-pill);
  transition: all 0.3s;
}
.random-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.random-btn:hover { background: var(--gold); border-color: var(--gold); color: var(--paper); }

/* ===== 搜索 ===== */
.search-box {
  margin: 4px 0 10px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 11px 16px 11px 38px;
  border: 1px solid var(--gold-light);
  background: color-mix(in srgb, var(--paper) 70%, transparent);
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--ink);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.search-box input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.search-box .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  stroke: var(--ink-faded);
  fill: none;
  stroke-width: 1.2;
}
.search-hint {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  font-weight: 300;
  color: var(--ink-faded);
  margin-top: 4px;
  min-height: 1.2em;
}

/* ===== 目录列表 ===== */
.catalog-list { padding-bottom: 100px; }
.series-block { margin-bottom: 40px; }
.series-block h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.06em;
  color: var(--clay);
  margin-bottom: 2px;
}
.subseries-head {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--ink-light);
  margin: 20px 0 2px;
  padding: 6px 16px;
  border: 1px solid var(--gold-light);
  background: color-mix(in srgb, var(--paper) 70%, transparent);
  border-radius: var(--radius-pill);
}
.subseries-head::before {
  content: '';
  width: 4px;
  height: 4px;
  background: var(--gold);
  flex-shrink: 0;
}

.catalog-row {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 20px;
  align-items: baseline;
  padding: 16px 12px;
  margin: 0 -12px;
  border-bottom: 1px solid var(--gold-light);
  border-radius: var(--radius-md);
  transition: background 0.3s, padding-left 0.3s;
  cursor: pointer;
}
.catalog-row:hover { background: var(--paper-dark); padding-left: 22px; }
.catalog-row .c-date {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  line-height: 1.4;
}
.catalog-row .c-author {
  font-family: var(--font-serif);
  font-size: 0.75rem;
  font-weight: 300;
  color: var(--ink-light);
}
.catalog-row h3 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.02rem;
  color: var(--ink);
  transition: color 0.3s;
  position: relative;
}
.catalog-row:hover h3 { color: var(--clay); }
.catalog-row h3::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
.catalog-row:hover h3::after { width: 100%; }
.catalog-row .c-arrow {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-faded);
  transition: color 0.3s;
}
.catalog-row:hover .c-arrow { color: var(--gold); }

/* ===== 树状图 ===== */
.tree-branch > .branch-head {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 14px 4px;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  color: var(--clay);
  letter-spacing: 0.04em;
}
.branch-head .tri {
  font-size: 0.5rem;
  color: var(--ink-faded);
  transition: transform 0.3s;
}
.tree-branch.collapsed > .branch-head .tri { transform: rotate(-90deg); }
.branch-count {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  font-weight: 300;
  color: var(--ink-faded);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 2px 12px;
}
.branch-children {
  margin-left: 8px;
  padding-left: 18px;
  border-left: 1px solid var(--gold-light);
}
.tree-branch.collapsed > .branch-children { display: none; }
.tree-branch.sub > .branch-head {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--ink-light);
  padding: 10px 4px;
}
.tree-leaf {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding: 9px 10px;
  margin: 0 -10px;
  border-radius: var(--radius-md);
  position: relative;
  transition: color 0.3s, padding-left 0.3s, background 0.3s;
}
.tree-leaf::before {
  content: '';
  position: absolute;
  left: -18px;
  top: 50%;
  width: 12px;
  height: 1px;
  background: var(--gold-light);
}
.tree-leaf:hover { background: var(--paper-dark); padding-left: 20px; }
.tree-leaf:hover .leaf-title { color: var(--clay); }
.tree-leaf .leaf-title {
  font-family: var(--font-serif);
  font-size: 0.92rem;
  font-weight: 300;
  transition: color 0.3s;
}
.tree-leaf .leaf-meta {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  font-weight: 300;
  color: var(--ink-faded);
  white-space: nowrap;
}

.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 300;
  padding: 60px 0;
}

/* ===== 入场渐显 ===== */
.reveal-up {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal-up.in-view {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal-up {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }
.footer-stats {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 22px;
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  color: var(--ink-faded);
  opacity: 0.8;
}
.footer-stats .bsz-num { color: var(--gold); }
</style>

<script>
// ============================================================
// 返回按钮（浏览器后退式，无历史回首页）
// ============================================================
(function() {
  var back = document.getElementById('back-link');
  if (!back) return;
  back.addEventListener('click', function(e) {
    if (history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });
  var ref = document.referrer || '';
  var label = document.getElementById('back-label');
  if (ref.indexOf('read.html') !== -1) {
    label.textContent = '返回';
  } else if (ref.indexOf('index.html') !== -1) {
    label.textContent = '返回首页';
  }
})();

// ============================================================
// 工具函数
// ============================================================
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function getDateWeight(dateStr) {
  if (!dateStr || dateStr.trim() === '') return -1;
  var parts = dateStr.trim().split('-');
  var weight = 0;
  if (parts[0]) weight += 10000;
  if (parts[1]) weight += 100;
  if (parts[2]) weight += 1;
  return weight;
}
function sortByDate(a, b) {
  var wA = getDateWeight(a.date);
  var wB = getDateWeight(b.date);
  if (wA !== wB) return wB - wA;
  return (a.date || '').localeCompare(b.date || '');
}
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

var allPoems = [];
var listEl = document.getElementById('catalog-list');
var hintEl = document.getElementById('search-hint');
var dataUrl = 'data/poems.json?t=' + Date.now();

// One reusable sheet; poem text never enters HTML or data attributes.
var catalogPreview = (function() {
  var HOVER_DELAY = 340;
  var FOCUS_DELAY = 180;
  var LEAVE_DELAY = 120;
  var GAP = 12;
  var desktop = window.matchMedia('(min-width: 821px)');
  var mouse = window.matchMedia('(any-hover: hover) and (any-pointer: fine)');
  var openings = new Map();
  var sheet = document.createElement('div');
  sheet.id = 'catalog-poem-preview';
  sheet.className = 'catalog-preview';
  sheet.setAttribute('role', 'tooltip');
  sheet.hidden = true;
  var lines = [document.createElement('p'), document.createElement('p')];
  lines.forEach(function(line) { sheet.appendChild(line); });
  document.body.appendChild(sheet);
  var hovered = null, focused = null, active = null, dismissed = null;
  var overSheet = false, timer = null;
  var linkSelector = 'a[data-preview-id]';
  var titleSelector = '.catalog-title, .leaf-title';

  function clearTimer() { clearTimeout(timer); timer = null; }
  function hide() {
    clearTimer();
    if (active) {
      var link = active.closest(linkSelector);
      var ids = (link.getAttribute('aria-describedby') || '').split(/\s+/).filter(function(id) {
        return id && id !== sheet.id;
      });
      if (ids.length) link.setAttribute('aria-describedby', ids.join(' '));
      else link.removeAttribute('aria-describedby');
    }
    active = null;
    overSheet = false;
    sheet.hidden = true;
  }
  function reset() {
    hide();
    hovered = focused = dismissed = null;
  }
  function viewportChanged() {
    var link = document.activeElement;
    var suppressed = dismissed;
    reset();
    if (link && link.matches(linkSelector + ':focus-visible') && listEl.contains(link)) {
      focused = link.querySelector(titleSelector);
      dismissed = suppressed;
      queue(focused, FOCUS_DELAY);
    }
  }
  function titleFor(target) {
    if (!(target instanceof Element)) return null;
    var title = target.closest(titleSelector);
    return title && listEl.contains(title) ? title : null;
  }
  function textRect(element) {
    var range = document.createRange();
    range.selectNodeContents(element);
    return range.getBoundingClientRect();
  }
  function available(title) {
    return desktop.matches && title && title.isConnected &&
      !title.closest('[inert]') && title.getClientRects().length &&
      openings.has(title.closest(linkSelector).getAttribute('data-preview-id'));
  }

  // Fit into existing whitespace. Protect text and controls, including adjacent rows.
  // If a dense/zoomed viewport has no free rectangle, keep the direct link usable.
  function place(title) {
    var viewport = window.visualViewport;
    var leftEdge = (viewport ? viewport.offsetLeft : 0) + GAP;
    var topEdge = (viewport ? viewport.offsetTop : 0) + GAP;
    var rightEdge = leftEdge + (viewport ? viewport.width : document.documentElement.clientWidth) - GAP * 2;
    var bottomEdge = topEdge + (viewport ? viewport.height : window.innerHeight) - GAP * 2;
    var anchor = textRect(title);
    if (anchor.bottom < topEdge || anchor.top > bottomEdge) return false;
    var obstacles = [];
    document.querySelectorAll('header, .controls, .side-theme, footer, #back-link, .page-head h1, .series-block h2, .subseries-head, .branch-head, .catalog-title, .leaf-title, .c-date, .c-arrow, .leaf-meta').forEach(function(el) {
      if (el.closest('[inert]') || !el.getClientRects().length) return;
      var rect = el.matches(titleSelector) ? textRect(el) : el.getBoundingClientRect();
      if (!rect.width || !rect.height || rect.bottom < topEdge || rect.top > bottomEdge) return;
      obstacles.push(rect);
      if (el.tagName === 'HEADER') topEdge = Math.max(topEdge, rect.bottom + GAP);
    });
    var widths = [parseFloat(getComputedStyle(sheet).getPropertyValue('--catalog-preview-width')) || 340, 260];
    for (var size = 0; size < widths.length; size++) {
      sheet.style.width = Math.min(widths[size], rightEdge - leftEdge) + 'px';
      var width = sheet.offsetWidth, height = sheet.offsetHeight;
      if (height > bottomEdge - topEdge) continue;
      var centerY = (anchor.top + anchor.bottom - height) / 2;
      var catalog = listEl.getBoundingClientRect();
      var xs = [anchor.right + GAP * 2, catalog.right - width - 44, catalog.right + GAP, anchor.left - width - GAP * 2];
      var ys = [centerY, anchor.bottom + GAP, anchor.top - height - GAP, topEdge, bottomEdge - height];
      obstacles.forEach(function(rect) {
        xs.push(rect.right + GAP, rect.left - width - GAP);
        ys.push(rect.bottom + GAP, rect.top - height - GAP);
      });
      xs = Array.from(new Set(xs.map(function(x) { return Math.max(leftEdge, Math.min(x, rightEdge - width)); })));
      ys = Array.from(new Set(ys.map(function(y) { return Math.max(topEdge, Math.min(y, bottomEdge - height)); })));
      var best = null;
      xs.forEach(function(x) {
        ys.forEach(function(y) {
          if (obstacles.some(function(rect) {
            return x < rect.right + GAP && x + width > rect.left - GAP &&
              y < rect.bottom + GAP && y + height > rect.top - GAP;
          })) return;
          var score = Math.abs(y - centerY) * 2 + Math.abs(x - anchor.right - GAP * 2);
          if (!best || score < best.score) best = {x: x, y: y, score: score};
        });
      });
      if (best) {
        sheet.style.left = best.x + 'px';
        sheet.style.top = best.y + 'px';
        return true;
      }
    }
    return false;
  }
  function show(title) {
    if (!available(title) || dismissed === title) return;
    var link = title.closest(linkSelector);
    var opening = openings.get(link.getAttribute('data-preview-id'));
    lines.forEach(function(line, index) { line.textContent = opening[index] || ''; });
    sheet.style.visibility = 'hidden';
    sheet.hidden = false;
    var fits = place(title);
    sheet.style.visibility = '';
    if (!fits) { hide(); return; }
    active = title;
    var ids = (link.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
    if (ids.indexOf(sheet.id) === -1) ids.push(sheet.id);
    link.setAttribute('aria-describedby', ids.join(' '));
  }
  function queue(title, delay) {
    clearTimer();
    if (active === title && !sheet.hidden) return;
    hide();
    if (!available(title) || dismissed === title) return;
    timer = setTimeout(function() { show(title); }, delay);
  }
  function leave() {
    clearTimer();
    timer = setTimeout(function() {
      if (focused) queue(focused, FOCUS_DELAY);
      else if (!hovered && !overSheet) hide();
    }, LEAVE_DELAY);
  }
  listEl.addEventListener('pointerover', function(e) {
    if (e.pointerType !== 'mouse' || !mouse.matches) return;
    var title = titleFor(e.target);
    if (!title || title.contains(e.relatedTarget)) return;
    hovered = title;
    if (!focused) queue(title, HOVER_DELAY);
  });
  listEl.addEventListener('pointerout', function(e) {
    var title = titleFor(e.target);
    if (!title || title.contains(e.relatedTarget)) return;
    hovered = null;
    if (dismissed === title && focused !== title) dismissed = null;
    leave();
  });
  listEl.addEventListener('focusin', function(e) {
    var link = e.target.closest(linkSelector);
    if (!link || !link.matches(':focus-visible')) return;
    focused = link.querySelector(titleSelector);
    dismissed = null;
    queue(focused, FOCUS_DELAY);
  });
  listEl.addEventListener('focusout', function() {
    focused = null;
    dismissed = null;
    if (hovered) queue(hovered, HOVER_DELAY);
    else hide();
  });
  listEl.addEventListener('click', reset);
  sheet.addEventListener('pointerenter', function(e) {
    if (e.pointerType !== 'mouse') return;
    overSheet = true;
    clearTimer();
  });
  sheet.addEventListener('pointerleave', function() { overSheet = false; leave(); });
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    dismissed = focused || hovered;
    hide();
  });
  document.addEventListener('pointerdown', function(e) { if (e.pointerType === 'touch') reset(); });
  window.addEventListener('scroll', viewportChanged, {passive: true, capture: true});
  window.addEventListener('resize', viewportChanged, {passive: true});
  window.addEventListener('blur', reset);
  document.addEventListener('visibilitychange', function() { if (document.hidden) reset(); });
  desktop.addEventListener('change', reset);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', viewportChanged);
    window.visualViewport.addEventListener('scroll', viewportChanged);
  }
  if (document.fonts) document.fonts.ready.then(reset);
  return {
    reset: reset,
    load: function(poems) {
      openings.clear();
      poems.forEach(function(poem) {
        var opening = (typeof poem.content === 'string' ? poem.content : '').split(/\r\n|\n|\r/)
          .filter(function(line) { return line.trim() !== ''; }).slice(0, 2);
        if (opening.length) openings.set(encodeURIComponent(poem.id), opening);
      });
    }
  };
})();

// ===== 列表渲染 =====
function rowHtml(p) {
  var authorHtml = p.author ? '<br><span class="c-author">' + escapeHtml(p.author) + '</span>' : '';
  return '<a class="catalog-row" data-preview-id="' + encodeURIComponent(p.id) + '" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
      '<span class="c-date">' + formatPoemDate(p.date) + authorHtml + '</span>' +
      '<h3><span class="catalog-title">' + escapeHtml(p.title) + '</span></h3>' +
      '<span class="c-arrow">→</span>' +
    '</a>';
}
function renderCatalog(poems) {
  if (!poems || poems.length === 0) {
    listEl.innerHTML = '<div class="empty-state">没有匹配的诗。</div>';
    return;
  }
  poems = poems.slice().sort(sortByDate);
  var groups = Object.create(null);
  var order = [];
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!groups[s]) { groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  listEl.innerHTML = order.map(function(series) {
    var list = groups[series];
    var rows;
    if (list.some(function(p) { return p.subseries; })) {
      rows = list.filter(function(p) { return !p.subseries; }).map(rowHtml).join('');
      var subGroups = Object.create(null);
      var subOrder = [];
      list.forEach(function(p) {
        if (!p.subseries) return;
        if (!subGroups[p.subseries]) { subGroups[p.subseries] = []; subOrder.push(p.subseries); }
        subGroups[p.subseries].push(p);
      });
      rows += subOrder.map(function(sub) {
        return '<div class="subseries-head">' + escapeHtml(sub) + '</div>' +
               subGroups[sub].map(rowHtml).join('');
      }).join('');
    } else {
      rows = list.map(rowHtml).join('');
    }
    return '<div class="series-block"><h2>' + escapeHtml(series) + '</h2>' + rows + '</div>';
  }).join('');
}

// ===== 树状图 =====
var viewMode = 'list';
try { if (localStorage.getItem('catalog_view') === 'tree') viewMode = 'tree'; } catch (_) {}
var collapsed = Object.create(null);
try { collapsed = Object.assign(Object.create(null), JSON.parse(localStorage.getItem('catalog_collapsed') || '{}')); } catch(e) { collapsed = Object.create(null); }

function leafHtml(p) {
  return '<a class="tree-leaf" data-preview-id="' + encodeURIComponent(p.id) + '" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
      '<span class="leaf-title">' + escapeHtml(p.title) + '</span>' +
      '<span class="leaf-meta">' + formatPoemDate(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
    '</a>';
}
function renderTree(poems) {
  if (!poems || poems.length === 0) {
    listEl.innerHTML = '<div class="empty-state">没有匹配的诗。</div>';
    return;
  }
  poems = poems.slice().sort(sortByDate);
  var groups = Object.create(null);
  var order = [];
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!groups[s]) { groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  listEl.innerHTML = order.map(function(series) {
    var list = groups[series];
    var inner = list.filter(function(p) { return !p.subseries; }).map(leafHtml).join('');
    var subGroups = Object.create(null);
    var subOrder = [];
    list.forEach(function(p) {
      if (!p.subseries) return;
      if (!subGroups[p.subseries]) { subGroups[p.subseries] = []; subOrder.push(p.subseries); }
      subGroups[p.subseries].push(p);
    });
    inner += subOrder.map(function(sub) {
      var subKey = series + '/' + sub;
      return '<div class="tree-branch sub' + (collapsed[subKey] ? ' collapsed' : '') + '" data-key="' + escapeHtml(subKey) + '">' +
          '<button class="branch-head" type="button"><span class="tri">▾</span>' + escapeHtml(sub) +
            '<span class="branch-count">' + subGroups[sub].length + '</span></button>' +
          '<div class="branch-children"><div class="branch-inner">' + subGroups[sub].map(leafHtml).join('') + '</div></div>' +
        '</div>';
    }).join('');
    return '<div class="tree-branch' + (collapsed[series] ? ' collapsed' : '') + '" data-key="' + escapeHtml(series) + '">' +
        '<button class="branch-head" type="button"><span class="tri">▾</span>' + escapeHtml(series) +
          '<span class="branch-count">' + list.length + '</span></button>' +
        '<div class="branch-children"><div class="branch-inner">' + inner + '</div></div>' +
      '</div>';
  }).join('');
}
function render(poems) {
  catalogPreview.reset();
  if (viewMode === 'tree') { renderTree(poems); } else { renderCatalog(poems); }
}

// ===== 折叠事件 =====
listEl.addEventListener('click', function(e) {
  var head = e.target.closest('.branch-head');
  if (!head) return;
  var branch = head.parentElement;
  var key = branch.getAttribute('data-key');
  branch.classList.toggle('collapsed');
  if (branch.classList.contains('collapsed')) { collapsed[key] = true; } else { delete collapsed[key]; }
  try { localStorage.setItem('catalog_collapsed', JSON.stringify(collapsed)); } catch (_) {}
});

// ===== 视图切换 =====
(function() {
  var toggleBtns = document.querySelectorAll('#view-toggle button');
  toggleBtns.forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-view') === viewMode);
    btn.addEventListener('click', function() {
      viewMode = this.getAttribute('data-view');
      try { localStorage.setItem('catalog_view', viewMode); } catch (_) {}
      toggleBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
      doSearch(document.getElementById('search-input').value);
    });
  });
})();

// ===== 随机 =====
document.getElementById('random-btn').addEventListener('click', function() {
  if (!allPoems.length) return;
  var pick = allPoems[Math.floor(Math.random() * allPoems.length)];
  window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
});

// ===== 搜索 =====
function doSearch(query) {
  query = query.trim().toLowerCase();
  if (!query) {
    hintEl.textContent = '';
    render(allPoems);
    return;
  }
  var matched = allPoems.filter(function(p) {
    return (p.title || '').toLowerCase().indexOf(query) !== -1 ||
           (p.content || '').toLowerCase().indexOf(query) !== -1 ||
           (p.author || '').toLowerCase().indexOf(query) !== -1 ||
           (p.series || '').toLowerCase().indexOf(query) !== -1 ||
           (p.subseries || '').toLowerCase().indexOf(query) !== -1;
  });
  hintEl.textContent = '找到 ' + matched.length + ' 首';
  render(matched);
}
document.getElementById('search-input').addEventListener('input', function(e) {
  doSearch(e.target.value);
});

// ===== 加载数据 =====
fetch(dataUrl)
  .then(function(r) { return r.json(); })
  .then(function(poems) {
    allPoems = poems || [];
    catalogPreview.load(allPoems);
    if (allPoems.length === 0) {
      listEl.innerHTML = '<div class="empty-state">暂时还没有诗，敬请期待。</div>';
      return;
    }
    doSearch(document.getElementById('search-input').value);

    // 入场渐显
    if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var rows = listEl.querySelectorAll('.catalog-row, .tree-leaf, .series-block');
      rows.forEach(function(el, idx) {
        el.classList.add('reveal-up');
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(en) {
            if (en.isIntersecting) {
              setTimeout(function() { el.classList.add('in-view'); }, (idx % 12) * 60);
              io.disconnect();
            }
          });
        }, { threshold: 0.1 });
        io.observe(el);
      });
    }
  })
  .catch(function() {
    listEl.innerHTML = '<div class="empty-state">目录加载失败，检查 data/poems.json 是否存在。</div>';
  });

// ============================================================
// 主题切换
// ============================================================
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;

  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('theme', theme); } catch (_) {}
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }

  var saved; try { saved = localStorage.getItem('theme'); } catch (_) {}
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(this.getAttribute('data-theme'));
    });
  });

  var style = document.createElement('style');
  style.textContent = `
    [data-theme="dark"] {
      --paper: #1E1E1C;
      --paper-dark: #2A2A27;
      --ink: #ECECE5;
      --ink-light: #C4C4BE;
      --ink-faded: #8A8A85;
      --gold: #D4A373;
      --gold-light: #4A4A45;
      --clay: #E55A5F;
    }
    [data-theme="eye-care"] {
      --paper: #ECF3E5;
      --paper-dark: #DEE8D4;
      --ink: #3A4632;
      --ink-light: #5C6A4F;
      --ink-faded: #82906F;
      --gold: #BDA26C;
      --gold-light: #C6D3B4;
      --clay: #B2674F;
    }
    [data-theme="dark"] .side-theme,
    [data-theme="eye-care"] .side-theme {
      background: color-mix(in srgb, var(--paper) 74%, transparent);
      border-color: var(--gold-light);
    }
    [data-theme="dark"] header {
      background: color-mix(in srgb, var(--paper) 74%, transparent);
    }
    [data-theme="eye-care"] header {
      background: color-mix(in srgb, var(--paper) 74%, transparent);
    }
  `;
  document.head.appendChild(style);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script id="public-ui-motion">
(function(){
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function set(el,name,value){if(el.getAttribute(name)!==value)el.setAttribute(name,value)}
  function sync(){
    document.querySelectorAll('.theme-btn,#view-toggle button').forEach(function(b){set(b,'aria-pressed',String(b.classList.contains('active')))});
    document.querySelectorAll('.tree-branch').forEach(function(branch){var closed=branch.classList.contains('collapsed');var head=branch.querySelector(':scope>.branch-head');var children=branch.querySelector(':scope>.branch-children');if(head)set(head,'aria-expanded',String(!closed));if(children)children.inert=closed});
  }
  sync();
  var theme=document.querySelector('.side-theme');if(theme)new MutationObserver(sync).observe(theme,{subtree:true,attributes:true,attributeFilter:['class']});
  var catalog=document.getElementById('catalog-list');if(!catalog)return;
  new MutationObserver(sync).observe(catalog,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  var toggle=document.getElementById('view-toggle');if(!toggle)return;
  var running;
  toggle.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;requestAnimationFrame(function(){sync();if(running)running.cancel();if(reduced.matches)return;running=catalog.animate([{opacity:.88,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:240,easing:'cubic-bezier(.16,1,.3,1)'});})});
})();
</script>
<script id="public-shell-behavior">
(function(){
  var menu=document.querySelector('.appearance');
  if(!menu)return;
  var summary=menu.querySelector('summary');
  var themes=menu.querySelector('#theme-side');
  function sync(){themes.querySelectorAll('.theme-btn').forEach(function(button){var pressed=String(button.classList.contains('active'));if(button.getAttribute('aria-pressed')!==pressed)button.setAttribute('aria-pressed',pressed)})}
  sync();
  new MutationObserver(sync).observe(themes,{subtree:true,attributes:true,attributeFilter:['class']});
  menu.addEventListener('toggle',sync);
  themes.addEventListener('click',function(event){if(!event.target.closest('button[data-theme]'))return;sync();menu.open=false;summary.focus({preventScroll:true})});
  document.addEventListener('pointerdown',function(event){if(menu.open&&!menu.contains(event.target))menu.open=false});
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&menu.open){event.preventDefault();event.stopPropagation();menu.open=false;summary.focus({preventScroll:true})}},true);
})();
</script>
