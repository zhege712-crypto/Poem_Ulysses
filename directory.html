<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录 · 诗歌漂流</title>
<meta name="description" content="诗歌漂流目录 — 按系列和子分类浏览所有诗歌。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f0;
  --paper-2:#f0ebe0;
  --white:#ffffff;
  --ink:#2c2c2a;
  --charcoal:#4a4842;
  --steel:#8a867a;
  --fog:#d5cec0;
  --accent-gold:#c79a6e;
  --accent-red:#b86b4a;
  --accent-cobalt:#5f7f92;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-serif:'Noto Serif SC','Kaiti SC','STKaiti','KaiTi',serif;
  --font-mono:'Space Mono',monospace;
  --maxw:860px;
}
[data-theme="dark"] {
  --paper: #1e1e1c;
  --paper-2: #2a2a27;
  --white: #2a2a27;
  --ink: #ecece5;
  --charcoal: #c4c4be;
  --steel: #8a8a85;
  --fog: #4a4a45;
  --accent-gold: #d4a373;
  --accent-red: #e55a5f;
}
[data-theme="eye-care"] {
  --paper: #ecf3e5;
  --paper-2: #dee8d4;
  --white: #f4f8ee;
  --ink: #3a4632;
  --charcoal: #5c6a4f;
  --steel: #82906f;
  --fog: #c6d3b4;
  --accent-gold: #bda26c;
  --accent-red: #b2674f;
  --accent-cobalt: #5f7f92;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  transition:background 0.3s, color 0.3s;
}
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }

header{
  padding:26px 0 18px;
  border-bottom:1px solid var(--paper-2);
  background:var(--paper);
  position:sticky;
  top:0;
  z-index:50;
  transition:background 0.3s, border-color 0.3s;
}
header .wrap{
  max-width:960px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}
.logo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.15rem;
}
.logo span{ color:var(--accent-gold); }
nav ul{
  list-style:none;
  display:flex;
  gap:24px;
  align-items:center;
}
nav a{
  font-family:var(--font-mono);
  font-size:0.7rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--charcoal);
  transition:color 0.25s;
  position:relative;
  padding-bottom:2px;
}
nav a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1.5px;
  background:var(--accent-gold);
  transition:width 0.3s;
}
nav a:hover{ color:var(--accent-red); }
nav a:hover::after{ width:100%; }
nav a.active{ color:var(--accent-red); }
nav a.active::after{ width:100%; }
@media(max-width:600px){
  header .wrap{ flex-direction:column; align-items:flex-start; gap:6px; }
  nav ul{ gap:16px; flex-wrap:wrap; }
}

.side-theme{
  position:fixed;
  right:28px;
  bottom:100px;
  z-index:150;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 24px rgba(28,28,27,0.08), inset 0 1px 0 rgba(255,255,255,0.35);
  padding:10px 8px;
  border-radius:28px;
  border:1px solid var(--fog);
  transition:background 0.3s, border-color 0.3s;
}
.side-theme .theme-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:transparent;
  cursor:pointer;
  transition:background 0.25s, transform 0.2s, box-shadow 0.25s;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.side-theme .theme-btn svg{
  width:22px;
  height:22px;
  stroke:var(--charcoal);
  stroke-width:1.8;
  fill:none;
  display:block;
  transition:stroke 0.25s;
}
.side-theme .theme-btn:hover{ background:var(--paper-2); transform:scale(1.08); }
.side-theme .theme-btn.active{
  background:var(--accent-gold);
  box-shadow:0 0 0 2px var(--accent-gold);
}
.side-theme .theme-btn.active svg{ stroke:var(--white); }
.side-theme .line{
  width:2px;
  height:10px;
  background:var(--fog);
  border-radius:1px;
  transition:background 0.3s;
}
@media(max-width:820px){ .side-theme{ right:16px; bottom:80px; } }

.page-head{
  padding:50px 0 20px;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:0.72rem;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--accent-red);
  margin-bottom:10px;
}
.page-head h1{
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(1.8rem,5vw,2.6rem);
}
.greek-divider{
  width:100px;
  height:10px;
  color:var(--fog);
  margin:14px 0 6px;
  display:block;
}

/* ===== 目录控制 ===== */
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin:30px 0 10px;
  flex-wrap:wrap;
}
.view-toggle{
  display:inline-flex;
  gap:2px;
  padding:4px;
  border-radius:24px;
  border:1px solid var(--fog);
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.view-toggle button{
  border:none;
  background:transparent;
  padding:8px 18px;
  border-radius:20px;
  font-family:var(--font-mono);
  font-size:0.72rem;
  letter-spacing:0.06em;
  color:var(--steel);
  cursor:pointer;
  transition:background 0.25s, color 0.25s;
}
.view-toggle button.active{
  background:var(--ink);
  color:var(--paper);
}
.random-btn{
  font-family:var(--font-mono);
  font-size:0.72rem;
  letter-spacing:0.06em;
  padding:11px 20px;
  border-radius:22px;
  border:1px solid var(--fog);
  background:transparent;
  color:var(--charcoal);
  cursor:pointer;
  transition:background 0.25s, color 0.25s, border-color 0.25s;
}
.random-btn:hover{
  background:var(--accent-red);
  color:var(--white);
  border-color:var(--accent-red);
}

.search-box{
  margin:16px 0 6px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:13px 16px 13px 40px;
  border:1px solid var(--paper-2);
  background:var(--white);
  font-family:var(--font-body);
  font-size:0.92rem;
  color:var(--ink);
  border-radius:4px;
  transition:border-color 0.3s;
}
.search-box input:focus{
  outline:none;
  border-color:var(--accent-gold);
}
.search-box svg{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  stroke:var(--steel);
  fill:none;
  stroke-width:1.6;
}
.search-hint{
  font-family:var(--font-mono);
  font-size:0.7rem;
  color:var(--steel);
  margin-top:6px;
  min-height:1.4em;
}

.catalog-list{ padding-bottom:100px; }
.series-block{ margin-bottom:40px; }
.series-block h2{
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.2rem;
  margin-bottom:4px;
  color:var(--accent-red);
}
.subseries-head{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:0.72rem;
  letter-spacing:0.12em;
  color:var(--charcoal);
  margin:22px 0 4px;
  padding:7px 16px;
  border-radius:20px;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--fog);
}
.subseries-head::before{
  content:'';
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent-gold);
  flex-shrink:0;
}

.catalog-row{
  display:grid;
  grid-template-columns:90px 1fr auto;
  gap:20px;
  align-items:baseline;
  padding:18px 0;
  border-bottom:1px solid var(--fog);
  transition:padding-left 0.3s, background 0.3s;
}
.catalog-row:hover{ padding-left:12px; background:var(--white); }
.catalog-row .c-date{
  font-family:var(--font-mono);
  font-size:0.7rem;
  color:var(--steel);
}
.catalog-row .c-author{
  font-family:var(--font-serif);
  font-size:0.85rem;
  color:var(--charcoal);
}
.catalog-row h3{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:1.1rem;
  transition:color 0.3s;
}
.catalog-row:hover h3{ color:var(--accent-red); }
.catalog-row .c-arrow{
  font-family:var(--font-mono);
  font-size:0.72rem;
  color:var(--steel);
}

/* ===== 树状图 ===== */
.tree-branch > .branch-head{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:16px 6px;
  background:none;
  border:none;
  cursor:pointer;
  text-align:left;
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.15rem;
  color:var(--accent-red);
}
.branch-head .tri{
  font-size:0.62rem;
  color:var(--steel);
  transition:transform 0.25s;
}
.tree-branch.collapsed > .branch-head .tri{ transform:rotate(-90deg); }
.branch-count{
  font-family:var(--font-mono);
  font-size:0.62rem;
  font-weight:400;
  color:var(--steel);
  border:1px solid var(--fog);
  border-radius:12px;
  padding:2px 10px;
}
.branch-children{
  margin-left:10px;
  padding-left:20px;
  border-left:1px solid var(--fog);
}
.tree-branch.collapsed > .branch-children{ display:none; }
.tree-branch.sub > .branch-head{
  font-family:var(--font-mono);
  font-size:0.78rem;
  letter-spacing:0.1em;
  color:var(--charcoal);
  padding:12px 6px;
}
.tree-leaf{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:16px;
  padding:9px 6px;
  position:relative;
  transition:color 0.25s, padding-left 0.25s;
}
.tree-leaf::before{
  content:'';
  position:absolute;
  left:-20px;
  top:50%;
  width:13px;
  height:1px;
  background:var(--fog);
}
.tree-leaf:hover{
  color:var(--accent-red);
  padding-left:12px;
}
.tree-leaf .leaf-title{
  font-family:var(--font-serif);
  font-size:0.95rem;
}
.tree-leaf .leaf-meta{
  font-family:var(--font-mono);
  font-size:0.62rem;
  color:var(--steel);
  white-space:nowrap;
}
.empty-state{
  text-align:center;
  color:var(--steel);
  font-family:var(--font-mono);
  font-size:0.85rem;
  padding:60px 0;
}
footer{
  padding:30px 0;
  text-align:center;
  font-family:var(--font-mono);
  font-size:0.68rem;
  color:var(--steel);
  background:var(--ink);
  color:var(--paper-2);
}
footer a{ color:var(--accent-gold); }
</style>
</head>

    <nav>
      <ul>

<div class="wrap">

    <svg class="greek-divider" viewBox="0 0 100 10" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M0 5 H8 V0 H16 V10 H24 V0 H32 V10 H40 V0 H48 V10 H56 V0 H64 V10 H72 V0 H80 V10 H88 V0 H100"/>

<footer>

<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 2a10 10 0 0 1 0 20 10 10 0 0 1 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 4a8 8 0 0 0 0 16 8 8 0 0 0 0-16z" fill="var(--charcoal)" opacity="0.2"/><path d="M12 6a6 6 0 0 1 0 12 6 6 0 0 1 0-12z" fill="var(--charcoal)" opacity="0.4"/><path d="M12 8a4 4 0 0 0 0 8 4 4 0 0 0 0-8z" fill="var(--charcoal)" opacity="0.6"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 9c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z" fill="var(--charcoal)" opacity="0.3"/><path d="M12 10.5c-.8 0-1.5.7-1.5 1.5s.7 1.5 1.5 1.5 1.5-.7 1.5-1.5-.7-1.5-1.5-1.5z" fill="var(--charcoal)" opacity="0.5"/></svg>
  </button>

<script>
// ===== 工具 =====
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function getDateWeight(dateStr) {
  if (!dateStr || dateStr.trim() === '') return -1;
  var parts = dateStr.trim().split('-');
  var weight = 0;
  if (parts[0]) weight += 10000;
  if (parts[1]) weight += 100;
  if (parts[2]) weight += 1;
  return weight;
}
function sortByDate(a, b) {
  var wA = getDateWeight(a.date);
  var wB = getDateWeight(b.date);
  if (wA !== wB) return wB - wA;
  return (a.date || '').localeCompare(b.date || '');
}
function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

var allPoems = [];
var listEl = document.getElementById('catalog-list');
var hintEl = document.getElementById('search-hint');

// ===== 列表渲染 =====
function rowHtml(p){
  var authorHtml = p.author ? '<br><span class="c-author">' + escapeHtml(p.author) + '</span>' : '';
  return '<a class="catalog-row" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
      '<span class="c-date">' + formatPoemDate(p.date) + authorHtml + '</span>' +
      '<h3>' + escapeHtml(p.title) + '</h3>' +
      '<span class="c-arrow">阅读 →</span>' +
    '</a>';
}
function renderCatalog(poems){
  if(!poems || poems.length === 0){
    listEl.innerHTML = '<div class="empty-state">没有匹配的诗。</div>';
    return;
  }
  poems = poems.slice().sort(sortByDate);
  var groups = {};
  var order = [];
  poems.forEach(function(p){
    var s = p.series || '未分类';
    if(!groups[s]){ groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  listEl.innerHTML = order.map(function(series){
    var list = groups[series];
    var rows;
    if(list.some(function(p){ return p.subseries; })){
      rows = list.filter(function(p){ return !p.subseries; }).map(rowHtml).join('');
      var subGroups = {};
      var subOrder = [];
      list.forEach(function(p){
        if(!p.subseries) return;
        if(!subGroups[p.subseries]){ subGroups[p.subseries] = []; subOrder.push(p.subseries); }
        subGroups[p.subseries].push(p);
      });
      rows += subOrder.map(function(sub){
        return '<div class="subseries-head">' + escapeHtml(sub) + '</div>' +
               subGroups[sub].map(rowHtml).join('');
      }).join('');
    } else {
      rows = list.map(rowHtml).join('');
    }
    return '<div class="series-block"><h2>' + escapeHtml(series) + '</h2>' + rows + '</div>';
  }).join('');
}

// ===== 树状图 =====
var viewMode = localStorage.getItem('catalog_view') === 'tree' ? 'tree' : 'list';
var collapsed = {};
try{ collapsed = JSON.parse(localStorage.getItem('catalog_collapsed') || '{}'); }catch(e){ collapsed = {}; }
function leafHtml(p){
  return '<a class="tree-leaf" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
      '<span class="leaf-title">' + escapeHtml(p.title) + '</span>' +
      '<span class="leaf-meta">' + formatPoemDate(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
    '</a>';
}
function renderTree(poems){
  if(!poems || poems.length === 0){
    listEl.innerHTML = '<div class="empty-state">没有匹配的诗。</div>';
    return;
  }
  poems = poems.slice().sort(sortByDate);
  var groups = {};
  var order = [];
  poems.forEach(function(p){
    var s = p.series || '未分类';
    if(!groups[s]){ groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  listEl.innerHTML = order.map(function(series){
    var list = groups[series];
    var inner = list.filter(function(p){ return !p.subseries; }).map(leafHtml).join('');
    var subGroups = {};
    var subOrder = [];
    list.forEach(function(p){
      if(!p.subseries) return;
      if(!subGroups[p.subseries]){ subGroups[p.subseries] = []; subOrder.push(p.subseries); }
      subGroups[p.subseries].push(p);
    });
    inner += subOrder.map(function(sub){
      var subKey = series + '/' + sub;
      return '<div class="tree-branch sub' + (collapsed[subKey] ? ' collapsed' : '') + '" data-key="' + escapeHtml(subKey) + '">' +
          '<button class="branch-head" type="button"><span class="tri">▼</span>' + escapeHtml(sub) +
            '<span class="branch-count">' + subGroups[sub].length + '</span></button>' +
          '<div class="branch-children">' + subGroups[sub].map(leafHtml).join('') + '</div>' +
        '</div>';
    }).join('');
    return '<div class="tree-branch' + (collapsed[series] ? ' collapsed' : '') + '" data-key="' + escapeHtml(series) + '">' +
        '<button class="branch-head" type="button"><span class="tri">▼</span>' + escapeHtml(series) +
          '<span class="branch-count">' + list.length + '</span></button>' +
        '<div class="branch-children">' + inner + '</div>' +
      '</div>';
  }).join('');
}
function render(poems){
  if(viewMode === 'tree'){ renderTree(poems); } else { renderCatalog(poems); }
}

// ===== 折叠事件 =====
listEl.addEventListener('click', function(e){
  var head = e.target.closest('.branch-head');
  if(!head) return;
  var branch = head.parentElement;
  var key = branch.getAttribute('data-key');
  branch.classList.toggle('collapsed');
  if(branch.classList.contains('collapsed')){ collapsed[key] = true; } else { delete collapsed[key]; }
  localStorage.setItem('catalog_collapsed', JSON.stringify(collapsed));
});

// ===== 视图切换 =====
(function(){
  var toggleBtns = document.querySelectorAll('#view-toggle button');
  toggleBtns.forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-view') === viewMode);
    btn.addEventListener('click', function(){
      viewMode = this.getAttribute('data-view');
      localStorage.setItem('catalog_view', viewMode);
      toggleBtns.forEach(function(b){ b.classList.toggle('active', b === btn); });
      render(allPoems);
    });
  });
})();

// ===== 随机 =====
document.getElementById('random-btn').addEventListener('click', function(){
  if(!allPoems.length) return;
  var pick = allPoems[Math.floor(Math.random() * allPoems.length)];
  window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
});

// ===== 搜索 =====
function doSearch(query){
  query = query.trim().toLowerCase();
  if(!query){
    hintEl.textContent = '';
    render(allPoems);
    return;
  }
  var matched = allPoems.filter(function(p){
    return (p.title || '').toLowerCase().indexOf(query) !== -1 ||
           (p.content || '').toLowerCase().indexOf(query) !== -1 ||
           (p.author || '').toLowerCase().indexOf(query) !== -1 ||
           (p.subseries || '').toLowerCase().indexOf(query) !== -1;
  });
  hintEl.textContent = '找到 ' + matched.length + ' 首';
  render(matched);
}
document.getElementById('search-input').addEventListener('input', function(e){
  doSearch(e.target.value);
});

// ===== 加载数据 =====
fetch('data/poems.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(poems){
    allPoems = poems || [];
    if(allPoems.length === 0){
      listEl.innerHTML = '<div class="empty-state">暂时还没有诗，敬请期待。</div>';
      return;
    }
    render(allPoems);
  })
  .catch(function(){
    listEl.innerHTML = '<div class="empty-state">目录加载失败，检查 data/poems.json 是否存在。</div>';
  });

// ===== 主题 =====
(function(){
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if(!btns.length) return;
  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }
  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      applyTheme(this.getAttribute('data-theme'));
    });
  });
})();

// ===== 替换 GitHub 占位 =====
(function(){
  var links = document.querySelectorAll('a[href*="YOUR_USERNAME"]');
  links.forEach(function(a){
    a.href = a.href.replace(/YOUR_USERNAME/g, 'YOUR_GITHUB_USERNAME');
    a.href = a.href.replace(/YOUR_REPO/g, 'poetry-odyssey');
  });
})();
</script>
