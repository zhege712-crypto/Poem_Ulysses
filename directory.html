<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录 · 诗歌漂流</title>
<meta name="description" content="诗歌漂流目录 — 按系列和子分类浏览所有诗歌。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --maxw: 860px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.8;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ===== 导航 ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 22px 0;
  background: rgba(247, 245, 240, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }
nav ul {
  list-style: none;
  display: flex;
  gap: 28px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  position: relative;
  padding-bottom: 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
nav a.active { color: var(--ink); }
nav a.active::after { width: 100%; }
@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

/* ===== 侧边主题切换 ===== */
.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-faded);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--gold);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

/* ===== 页面头部 ===== */
.page-head {
  padding: 40px 0 20px;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin-bottom: 4px;
}
.page-head h1 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  letter-spacing: 0.06em;
  margin-bottom: 2px;
}
.page-head .line {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin-top: 10px;
}

/* ===== 控制栏 ===== */
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin: 28px 0 16px;
  flex-wrap: wrap;
}
.controls-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.view-toggle {
  display: inline-flex;
  gap: 0;
  padding: 2px;
  border: 1px solid var(--gold-light);
  background: transparent;
}
.view-toggle button {
  border: none;
  background: transparent;
  padding: 6px 16px;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-faded);
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
}
.view-toggle button.active {
  background: var(--ink);
  color: var(--paper);
}
.view-toggle button:hover:not(.active) { background: var(--gold-light); }
.random-btn {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  padding: 8px 16px;
  border: 1px solid var(--gold-light);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.3s;
}
.random-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.random-btn:hover { background: var(--gold); border-color: var(--gold); color: var(--paper); }

/* ===== 搜索 ===== */
.search-box {
  margin: 4px 0 10px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border: 1px solid var(--gold-light);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--ink);
  transition: border-color 0.3s;
}
.search-box input:focus { outline: none; border-color: var(--gold); }
.search-box .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  stroke: var(--ink-faded);
  fill: none;
  stroke-width: 1.2;
}
.search-hint {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  font-weight: 300;
  color: var(--ink-faded);
  margin-top: 4px;
  min-height: 1.2em;
}

/* ===== 目录列表 ===== */
.catalog-list { padding-bottom: 100px; }
.series-block { margin-bottom: 40px; }
.series-block h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.06em;
  color: var(--clay);
  margin-bottom: 2px;
}
.subseries-head {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--ink-light);
  margin: 20px 0 2px;
  padding: 4px 14px;
  border: 1px solid var(--gold-light);
  background: transparent;
}
.subseries-head::before {
  content: '';
  width: 4px;
  height: 4px;
  background: var(--gold);
  flex-shrink: 0;
}

.catalog-row {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 20px;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--gold-light);
  transition: padding-left 0.3s;
  cursor: pointer;
}
.catalog-row:hover { padding-left: 10px; }
.catalog-row .c-date {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  line-height: 1.4;
}
.catalog-row .c-author {
  font-family: var(--font-serif);
  font-size: 0.75rem;
  font-weight: 300;
  color: var(--ink-light);
}
.catalog-row h3 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.02rem;
  color: var(--ink);
  transition: color 0.3s;
  position: relative;
}
.catalog-row:hover h3 { color: var(--clay); }
.catalog-row h3::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
.catalog-row:hover h3::after { width: 100%; }
.catalog-row .c-arrow {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-faded);
  transition: color 0.3s;
}
.catalog-row:hover .c-arrow { color: var(--gold); }

/* ===== 树状图 ===== */
.tree-branch > .branch-head {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 14px 4px;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  color: var(--clay);
  letter-spacing: 0.04em;
}
.branch-head .tri {
  font-size: 0.5rem;
  color: var(--ink-faded);
  transition: transform 0.3s;
}
.tree-branch.collapsed > .branch-head .tri { transform: rotate(-90deg); }
.branch-count {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  font-weight: 300;
  color: var(--ink-faded);
  border: 1px solid var(--gold-light);
  padding: 1px 10px;
}
.branch-children {
  margin-left: 8px;
  padding-left: 18px;
  border-left: 1px solid var(--gold-light);
}
.tree-branch.collapsed > .branch-children { display: none; }
.tree-branch.sub > .branch-head {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--ink-light);
  padding: 10px 4px;
}
.tree-leaf {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding: 8px 4px;
  position: relative;
  transition: color 0.3s, padding-left 0.3s;
}
.tree-leaf::before {
  content: '';
  position: absolute;
  left: -18px;
  top: 50%;
  width: 12px;
  height: 1px;
  background: var(--gold-light);
}
.tree-leaf:hover { padding-left: 10px; }
.tree-leaf:hover .leaf-title { color: var(--clay); }
.tree-leaf .leaf-title {
  font-family: var(--font-serif);
  font-size: 0.92rem;
  font-weight: 300;
  transition: color 0.3s;
}
.tree-leaf .leaf-meta {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  font-weight: 300;
  color: var(--ink-faded);
  white-space: nowrap;
}

.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 300;
  padding: 60px 0;
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">诗歌<span>漂流</span></a>
    <nav>
      <ul>
        <li><a href="index.html">首页</a></li>
        <li><a href="directory.html" class="active">目录</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank">投稿</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Catalog</div>
    <h1>目录</h1>
    <div class="line"></div>
  </div>

  <div class="controls">
    <div class="controls-left">
      <div class="view-toggle" id="view-toggle">
        <button type="button" data-view="list" class="active">列表</button>
        <button type="button" data-view="tree">树状</button>
      </div>
    </div>
    <button class="random-btn" id="random-btn" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/></svg>
      随机一首
    </button>
  </div>

  <div class="search-box">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="搜索标题、正文、作者或子分类…">
  </div>
  <div class="search-hint" id="search-hint"></div>

  <div class="catalog-list" id="catalog-list">
    <div class="empty-state">加载中…</div>
  </div>
</div>

<footer>
  © 2026 诗歌漂流 · 由 <a href="https://github.com/zhege712-crypto" target="_blank">@zhege712-crypto</a> 维护
</footer>

<script>
// ============================================================
// 工具函数
// ============================================================
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function getDateWeight(dateStr) {
  if (!dateStr || dateStr.trim() === '') return -1;
  var parts = dateStr.trim().split('-');
  var weight = 0;
  if (parts[0]) weight += 10000;
  if (parts[1]) weight += 100;
  if (parts[2]) weight += 1;
  return weight;
}
function sortByDate(a, b) {
  var wA = getDateWeight(a.date);
  var wB = getDateWeight(b.date);
  if (wA !== wB) return wB - wA;
  return (a.date || '').localeCompare(b.date || '');
}
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

var allPoems = [];
var listEl = document.getElementById('catalog-list');
var hintEl = document.getElementById('search-hint');
var dataUrl = 'data/poems.json?t=' + Date.now();

// ===== 列表渲染 =====
function rowHtml(p) {
  var authorHtml = p.author ? '<br><span class="c-author">' + escapeHtml(p.author) + '</span>' : '';
  return '<a class="catalog-row" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
      '<span class="c-date">' + formatPoemDate(p.date) + authorHtml + '</span>' +
      '<h3>' + escapeHtml(p.title) + '</h3>' +
      '<span class="c-arrow">→</span>' +
    '</a>';
}
function renderCatalog(poems) {
  if (!poems || poems.length === 0) {
    listEl.innerHTML = '<div class="empty-state">没有匹配的诗。</div>';
    return;
  }
  poems = poems.slice().sort(sortByDate);
  var groups = {};
  var order = [];
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!groups[s]) { groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  listEl.innerHTML = order.map(function(series) {
    var list = groups[series];
    var rows;
    if (list.some(function(p) { return p.subseries; })) {
      rows = list.filter(function(p) { return !p.subseries; }).map(rowHtml).join('');
      var subGroups = {};
      var subOrder = [];
      list.forEach(function(p) {
        if (!p.subseries) return;
        if (!subGroups[p.subseries]) { subGroups[p.subseries] = []; subOrder.push(p.subseries); }
        subGroups[p.subseries].push(p);
      });
      rows += subOrder.map(function(sub) {
        return '<div class="subseries-head">' + escapeHtml(sub) + '</div>' +
               subGroups[sub].map(rowHtml).join('');
      }).join('');
    } else {
      rows = list.map(rowHtml).join('');
    }
    return '<div class="series-block"><h2>' + escapeHtml(series) + '</h2>' + rows + '</div>';
  }).join('');
}

// ===== 树状图 =====
var viewMode = localStorage.getItem('catalog_view') === 'tree' ? 'tree' : 'list';
var collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem('catalog_collapsed') || '{}'); } catch(e) { collapsed = {}; }

function leafHtml(p) {
  return '<a class="tree-leaf" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
      '<span class="leaf-title">' + escapeHtml(p.title) + '</span>' +
      '<span class="leaf-meta">' + formatPoemDate(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
    '</a>';
}
function renderTree(poems) {
  if (!poems || poems.length === 0) {
    listEl.innerHTML = '<div class="empty-state">没有匹配的诗。</div>';
    return;
  }
  poems = poems.slice().sort(sortByDate);
  var groups = {};
  var order = [];
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!groups[s]) { groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  listEl.innerHTML = order.map(function(series) {
    var list = groups[series];
    var inner = list.filter(function(p) { return !p.subseries; }).map(leafHtml).join('');
    var subGroups = {};
    var subOrder = [];
    list.forEach(function(p) {
      if (!p.subseries) return;
      if (!subGroups[p.subseries]) { subGroups[p.subseries] = []; subOrder.push(p.subseries); }
      subGroups[p.subseries].push(p);
    });
    inner += subOrder.map(function(sub) {
      var subKey = series + '/' + sub;
      return '<div class="tree-branch sub' + (collapsed[subKey] ? ' collapsed' : '') + '" data-key="' + escapeHtml(subKey) + '">' +
          '<button class="branch-head" type="button"><span class="tri">▾</span>' + escapeHtml(sub) +
            '<span class="branch-count">' + subGroups[sub].length + '</span></button>' +
          '<div class="branch-children">' + subGroups[sub].map(leafHtml).join('') + '</div>' +
        '</div>';
    }).join('');
    return '<div class="tree-branch' + (collapsed[series] ? ' collapsed' : '') + '" data-key="' + escapeHtml(series) + '">' +
        '<button class="branch-head" type="button"><span class="tri">▾</span>' + escapeHtml(series) +
          '<span class="branch-count">' + list.length + '</span></button>' +
        '<div class="branch-children">' + inner + '</div>' +
      '</div>';
  }).join('');
}
function render(poems) {
  if (viewMode === 'tree') { renderTree(poems); } else { renderCatalog(poems); }
}

// ===== 折叠事件 =====
listEl.addEventListener('click', function(e) {
  var head = e.target.closest('.branch-head');
  if (!head) return;
  var branch = head.parentElement;
  var key = branch.getAttribute('data-key');
  branch.classList.toggle('collapsed');
  if (branch.classList.contains('collapsed')) { collapsed[key] = true; } else { delete collapsed[key]; }
  localStorage.setItem('catalog_collapsed', JSON.stringify(collapsed));
});

// ===== 视图切换 =====
(function() {
  var toggleBtns = document.querySelectorAll('#view-toggle button');
  toggleBtns.forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-view') === viewMode);
    btn.addEventListener('click', function() {
      viewMode = this.getAttribute('data-view');
      localStorage.setItem('catalog_view', viewMode);
      toggleBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
      render(allPoems);
    });
  });
})();

// ===== 随机 =====
document.getElementById('random-btn').addEventListener('click', function() {
  if (!allPoems.length) return;
  var pick = allPoems[Math.floor(Math.random() * allPoems.length)];
  window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
});

// ===== 搜索 =====
function doSearch(query) {
  query = query.trim().toLowerCase();
  if (!query) {
    hintEl.textContent = '';
    render(allPoems);
    return;
  }
  var matched = allPoems.filter(function(p) {
    return (p.title || '').toLowerCase().indexOf(query) !== -1 ||
           (p.content || '').toLowerCase().indexOf(query) !== -1 ||
           (p.author || '').toLowerCase().indexOf(query) !== -1 ||
           (p.subseries || '').toLowerCase().indexOf(query) !== -1;
  });
  hintEl.textContent = '找到 ' + matched.length + ' 首';
  render(matched);
}
document.getElementById('search-input').addEventListener('input', function(e) {
  doSearch(e.target.value);
});

// ===== 加载数据 =====
fetch(dataUrl)
  .then(function(r) { return r.json(); })
  .then(function(poems) {
    allPoems = poems || [];
    if (allPoems.length === 0) {
      listEl.innerHTML = '<div class="empty-state">暂时还没有诗，敬请期待。</div>';
      return;
    }
    render(allPoems);
  })
  .catch(function() {
    listEl.innerHTML = '<div class="empty-state">目录加载失败，检查 data/poems.json 是否存在。</div>';
  });

// ============================================================
// 主题切换
// ============================================================
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;

  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }

  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(this.getAttribute('data-theme'));
    });
  });

  var style = document.createElement('style');
  style.textContent = `
    [data-theme="dark"] {
      --paper: #1E1E1C;
      --paper-dark: #2A2A27;
      --ink: #ECECE5;
      --ink-light: #C4C4BE;
      --ink-faded: #8A8A85;
      --gold: #D4A373;
      --gold-light: #4A4A45;
      --clay: #E55A5F;
    }
    [data-theme="eye-care"] {
      --paper: #ECF3E5;
      --paper-dark: #DEE8D4;
      --ink: #3A4632;
      --ink-light: #5C6A4F;
      --ink-faded: #82906F;
      --gold: #BDA26C;
      --gold-light: #C6D3B4;
      --clay: #B2674F;
    }
    [data-theme="dark"] .side-theme,
    [data-theme="eye-care"] .side-theme {
      background: rgba(30, 30, 28, 0.7);
      border-color: var(--gold-light);
    }
    [data-theme="dark"] header {
      background: rgba(30, 30, 28, 0.85);
    }
    [data-theme="eye-care"] header {
      background: rgba(236, 243, 229, 0.85);
    }
  `;
  document.head.appendChild(style);
})();
</script>
</body>
