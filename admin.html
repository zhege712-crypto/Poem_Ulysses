<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌漂流 · 发布后台</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f0;
  --paper-2:#f0ebe0;
  --white:#ffffff;
  --ink:#2c2c2a;
  --charcoal:#4a4842;
  --steel:#8a867a;
  --fog:#d5cec0;
  --accent-gold:#c79a6e;
  --accent-red:#b86b4a;
  --accent-cobalt:#5f7f92;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-serif:'Noto Serif SC','Kaiti SC','STKaiti','KaiTi',serif;
  --font-mono:'Space Mono',monospace;
}
[data-theme="dark"] {
  --paper: #1e1e1c;
  --paper-2: #2a2a27;
  --white: #2a2a27;
  --ink: #ecece5;
  --charcoal: #c4c4be;
  --steel: #8a8a85;
  --fog: #4a4a45;
  --accent-gold: #d4a373;
  --accent-red: #e55a5f;
}
[data-theme="eye-care"] {
  --paper: #ecf3e5;
  --paper-2: #dee8d4;
  --white: #f4f8ee;
  --ink: #3a4632;
  --charcoal: #5c6a4f;
  --steel: #82906f;
  --fog: #c6d3b4;
  --accent-gold: #bda26c;
  --accent-red: #b2674f;
  --accent-cobalt: #5f7f92;
}
*{ box-sizing:border-box; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  margin:0;
  padding:40px 20px 100px;
  transition:background 0.3s, color 0.3s;
}
.wrap{ max-width:640px; margin:0 auto; }
h1{
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.8rem;
  margin-bottom:6px;
}
.sub{
  font-family:var(--font-mono);
  font-size:0.75rem;
  color:var(--steel);
  margin-bottom:36px;
}

.panel{
  background:var(--white);
  border:1px solid var(--paper-2);
  padding:26px;
  margin-bottom:24px;
  border-radius:4px;
}
.panel h2{
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.1rem;
  margin-bottom:16px;
}

label{
  display:block;
  font-family:var(--font-mono);
  font-size:0.72rem;
  color:var(--steel);
  margin:16px 0 6px;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
label:first-of-type{ margin-top:0; }
input[type=text], input[type=password], input[type=date], textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--paper-2);
  background:var(--paper);
  font-family:var(--font-body);
  font-size:0.95rem;
  color:var(--ink);
  border-radius:4px;
}
textarea{
  min-height:160px;
  resize:vertical;
  font-family:var(--font-body);
  line-height:1.6;
}
input[type=file]{ font-family:var(--font-mono); font-size:0.8rem; }

.row{ display:flex; gap:14px; flex-wrap:wrap; }
.row > div{ flex:1; min-width:120px; }

.date-group{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
.date-group input[type=text]{ flex:1; min-width:120px; }
.date-group .btn-sm{
  padding:6px 12px;
  margin:0;
  font-size:0.7rem;
  border:1px solid var(--fog);
  border-radius:4px;
  background:transparent;
  cursor:pointer;
  font-family:var(--font-mono);
  color:var(--charcoal);
  transition:background 0.2s, border-color 0.2s;
}
.date-group .btn-sm:hover{ background:var(--paper-2); border-color:var(--steel); }

button{
  margin-top:22px;
  padding:13px 22px;
  border:none;
  cursor:pointer;
  font-family:var(--font-mono);
  font-size:0.8rem;
  letter-spacing:0.05em;
  background:var(--ink);
  color:var(--white);
  border-radius:4px;
  transition:background 0.25s;
}
button:hover{ background:var(--accent-red); }
button:disabled{ background:var(--fog); cursor:not-allowed; }

.hint{
  font-family:var(--font-mono);
  font-size:0.7rem;
  color:var(--steel);
  margin-top:8px;
  line-height:1.6;
}
.hint a{ color:var(--accent-cobalt); }

.status{
  margin-top:18px;
  padding:12px 14px;
  font-family:var(--font-mono);
  font-size:0.78rem;
  display:none;
  border-radius:4px;
}
.status.show{ display:block; }
.status.ok{ background:#e6f2e8; color:#2b6b3a; }
.status.err{ background:#f7e6e6; color:var(--accent-red); }
.status.loading{ background:var(--paper-2); color:var(--charcoal); }

.warn-box{
  background:#fff6e6;
  border:1px solid var(--accent-gold);
  padding:16px 18px;
  font-size:0.85rem;
  color:var(--charcoal);
  margin-bottom:24px;
  line-height:1.6;
  border-radius:4px;
}

.manage-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--paper-2);
}
.manage-item .mi-info{ font-size:0.88rem; }
.manage-item .mi-date{
  font-family:var(--font-mono);
  font-size:0.68rem;
  color:var(--steel);
  display:block;
  margin-top:2px;
}
.manage-item .mi-del{
  margin-top:0;
  padding:7px 14px;
  font-size:0.7rem;
  background:transparent;
  color:var(--accent-red);
  border:1px solid var(--accent-red);
}
.manage-item .mi-edit{
  margin-top:0;
  padding:7px 14px;
  font-size:0.7rem;
  background:var(--accent-cobalt);
}

.mi-edit-form{
  background:var(--paper);
  border:1px solid var(--paper-2);
  padding:16px 18px;
  margin:-6px 0 10px;
  border-radius:4px;
}
.mi-edit-form label{ margin:12px 0 5px; }
.mi-edit-form label:first-child{ margin-top:0; }
.mi-edit-form textarea{ min-height:110px; }
.mi-edit-form .row{ display:flex; gap:12px; }
.mi-edit-form .row > div{ flex:1; }
.mi-edit-form .mi-f-save{
  margin-top:16px;
  padding:10px 18px;
  font-size:0.72rem;
}
.mi-edit-form .mi-f-cancel{
  margin-top:16px;
  padding:10px 18px;
  font-size:0.72rem;
}
.manage-item .mi-del:hover{ background:var(--accent-red); color:var(--white); }

.side-theme{
  position:fixed;
  right:28px;
  bottom:100px;
  z-index:100000;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 24px rgba(28,28,27,0.08), inset 0 1px 0 rgba(255,255,255,0.35);
  padding:10px 8px;
  border-radius:28px;
  border:1px solid var(--fog);
  transition:background 0.3s, border-color 0.3s;
}
.side-theme .theme-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  margin-top:0;
  background:transparent;
  cursor:pointer;
  transition:background 0.25s, transform 0.2s, box-shadow 0.25s;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.side-theme .theme-btn svg{
  width:22px;
  height:22px;
  stroke:var(--charcoal);
  stroke-width:1.8;
  fill:none;
  display:block;
  transition:stroke 0.25s;
}
.side-theme .theme-btn:hover{ background:var(--paper-2); transform:scale(1.08); }
.side-theme .theme-btn.active{
  background:var(--accent-gold);
  box-shadow:0 0 0 2px var(--accent-gold);
}
.side-theme .theme-btn.active svg{ stroke:var(--white); }
.side-theme .line{
  width:2px;
  height:10px;
  background:var(--fog);
  border-radius:1px;
  transition:background 0.3s;
}
@media(max-width:820px){ .side-theme{ right:16px; bottom:80px; } }

/* ===== 密码门 ===== */
#password-overlay{
  position:fixed;
  inset:0;
  z-index:99999;
  background:rgba(28,28,27,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:opacity 0.5s;
}
#password-overlay.hidden{
  opacity:0;
  pointer-events:none;
}
#password-overlay .box{
  background:var(--paper);
  padding:40px 44px;
  border-radius:12px;
  max-width:400px;
  width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  text-align:center;
}
#password-overlay .box h2{
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.4rem;
  margin-bottom:8px;
}
#password-overlay .box p{
  color:var(--steel);
  font-size:0.85rem;
  margin-bottom:24px;
}
#password-overlay .box input[type="password"]{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--paper-2);
  background:var(--white);
  font-family:var(--font-body);
  font-size:0.95rem;
  color:var(--ink);
  border-radius:6px;
  margin-bottom:16px;
}
#password-overlay .box button{
  width:100%;
  padding:13px;
  border:none;
  background:var(--ink);
  color:var(--white);
  font-family:var(--font-mono);
  font-size:0.85rem;
  border-radius:6px;
  cursor:pointer;
  transition:background 0.25s;
}
#password-overlay .box button:hover{ background:var(--accent-red); }
#password-overlay .error-msg{
  color:var(--accent-red);
  font-family:var(--font-mono);
  font-size:0.75rem;
  margin-top:12px;
  min-height:1.5em;
}

footer{
  padding:30px 0;
  text-align:center;
  font-family:var(--font-mono);
  font-size:0.68rem;
  color:var(--steel);
  background:var(--ink);
  color:var(--paper-2);
  margin-top:40px;
  border-radius:4px;
}
footer a{ color:var(--accent-gold); }
</style>
</head>
<body>

<!-- ====== 密码门 ====== -->
<div id="password-overlay">
  <div class="box">
    <h2>🔐 管理员验证</h2>
    <p>请输入后台密码以继续</p>
    <input type="password" id="password-input" placeholder="输入密码" autofocus>
    <button id="password-submit">确认</button>
    <div class="error-msg" id="password-error"></div>
  </div>
</div>

<!-- ====== 主内容 ====== -->
<div class="content-wrapper" style="display:none;">

<div class="wrap">
  <h1>📖 诗歌漂流 · 发布后台</h1>
  <div class="sub">这是你私人使用的页面，不要把这个链接分享给别人。</div>

  <div class="warn-box">
    ⚠️ 密钥（Token）具有修改你仓库内容的权限，请不要在公共电脑上勾选"记住密钥"，也不要把密钥截图发给任何人。
  </div>

  <div class="panel">
    <h2>① 仓库与密钥设置</h2>
    <label>GitHub 用户名（仓库所有者）</label>
    <input type="text" id="gh-owner" placeholder="例如 zhege712-crypto" value="zhege712-crypto">
    <label>仓库名</label>
    <input type="text" id="gh-repo" placeholder="例如 Poem_Ulysses" value="Poem_Ulysses">
    <label>Personal Access Token</label>
    <input type="password" id="gh-token" placeholder="ghp_ 开头的一长串字符">
    <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:0.82rem; color:var(--charcoal);">
      <input type="checkbox" id="remember" style="width:auto;"> 在这台设备上记住
    </label>
    <div class="hint">
      需要 <b>Contents</b> 读写权限。如果使用 Fine-grained token，请确保授权了这个仓库。
    </div>
  </div>

  <div class="panel">
    <h2>② 发布一首诗</h2>
    <div class="row">
      <div>
        <label>标题</label>
        <input type="text" id="p-title" placeholder="给这首诗起个名字">
      </div>
      <div>
        <label>日期</label>
        <div class="date-group">
          <input type="text" id="p-date" placeholder="2026-07-31">
          <button type="button" class="btn-sm" data-target="p-date" data-precision="year">年</button>
          <button type="button" class="btn-sm" data-target="p-date" data-precision="month">年月</button>
          <button type="button" class="btn-sm" data-target="p-date" data-precision="day">完整</button>
        </div>
      </div>
    </div>
    <label>正文</label>
    <textarea id="p-content" placeholder="在这里写诗，换行会保留"></textarea>
    <label>序列（可选）</label>
    <input type="text" id="p-series" placeholder="例如：城市漫游 / 无题集" list="p-series-list">
    <datalist id="p-series-list"></datalist>
    <label>子分类（可选）</label>
    <input type="text" id="p-subseries" placeholder="例如：现代诗 / 古体诗" list="p-subseries-list">
    <datalist id="p-subseries-list"></datalist>
    <label>作者</label>
    <input type="text" id="p-author" placeholder="署名">
    <label>配图（可多选）</label>
    <input type="file" id="p-image" accept="image/*" multiple>
    <div class="hint">图片会上传到仓库的 images/ 目录下。</div>
    <button id="publish-btn">发布</button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel">
    <h2>③ 管理诗歌</h2>
    <div class="hint" style="margin-top:0;">列出现有的诗，支持编辑和删除（配图也会一并删除）。</div>
    <div id="poem-manage-list" style="margin-top:16px;"></div>
    <button id="refresh-list-btn" type="button" style="background:var(--charcoal);">刷新列表</button>
    <div class="status" id="manage-status"></div>
  </div>
</div>

<footer>© 2026 诗歌漂流 · 后台管理</footer>
</div> <!-- .content-wrapper -->

<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 2a10 10 0 0 1 0 20 10 10 0 0 1 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 4a8 8 0 0 0 0 16 8 8 0 0 0 0-16z" fill="var(--charcoal)" opacity="0.2"/><path d="M12 6a6 6 0 0 1 0 12 6 6 0 0 1 0-12z" fill="var(--charcoal)" opacity="0.4"/><path d="M12 8a4 4 0 0 0 0 8 4 4 0 0 0 0-8z" fill="var(--charcoal)" opacity="0.6"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 9c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z" fill="var(--charcoal)" opacity="0.3"/><path d="M12 10.5c-.8 0-1.5.7-1.5 1.5s.7 1.5 1.5 1.5 1.5-.7 1.5-1.5-.7-1.5-1.5-1.5z" fill="var(--charcoal)" opacity="0.5"/></svg>
  </button>
</div>

<script>
// ============================================================
// 密码门
// ============================================================
(function() {
  var overlay = document.getElementById('password-overlay');
  var pwInput = document.getElementById('password-input');
  var pwSubmit = document.getElementById('password-submit');
  var errorMsg = document.getElementById('password-error');
  var contentWrapper = document.querySelector('.content-wrapper');

  var PASSWORD = 'umbrella2026';

  if (sessionStorage.getItem('admin_authenticated') === 'true') {
    overlay.classList.add('hidden');
    contentWrapper.style.display = 'block';
    return;
  }

  function verifyPassword() {
    var input = pwInput.value.trim();
    if (!input) {
      errorMsg.textContent = '请输入密码';
      return;
    }
    if (input === PASSWORD) {
      sessionStorage.setItem('admin_authenticated', 'true');
      overlay.classList.add('hidden');
      contentWrapper.style.display = 'block';
      document.getElementById('gh-owner').focus();
    } else {
      errorMsg.textContent = '密码错误，请重试';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  pwSubmit.addEventListener('click', verifyPassword);
  pwInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      pwSubmit.click();
    }
  });
  pwInput.focus();
})();

// ============================================================
// 主功能
// ============================================================
var els = {
  owner: document.getElementById('gh-owner'),
  repo: document.getElementById('gh-repo'),
  token: document.getElementById('gh-token'),
  remember: document.getElementById('remember'),
  title: document.getElementById('p-title'),
  date: document.getElementById('p-date'),
  content: document.getElementById('p-content'),
  series: document.getElementById('p-series'),
  subseries: document.getElementById('p-subseries'),
  author: document.getElementById('p-author'),
  image: document.getElementById('p-image'),
  btn: document.getElementById('publish-btn'),
  status: document.getElementById('status')
};

function fillDate(inputId, precision) {
  var input = document.getElementById(inputId);
  if (!input) return;
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  if (precision === 'year') input.value = y;
  else if (precision === 'month') input.value = y + '-' + m;
  else if (precision === 'day') input.value = y + '-' + m + '-' + d;
}
document.querySelectorAll('.date-group .btn-sm').forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.preventDefault();
    fillDate(this.getAttribute('data-target'), this.getAttribute('data-precision'));
  });
});

(function(){
  var saved = localStorage.getItem('gh_admin_creds');
  if(saved){
    try{
      var c = JSON.parse(saved);
      els.owner.value = c.owner || 'zhege712-crypto';
      els.repo.value = c.repo || 'Poem_Ulysses';
      els.token.value = c.token || '';
      els.remember.checked = true;
    }catch(e){}
  }
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  if (!els.date.value) els.date.value = y + '-' + m + '-' + d;
  els.author.value = '匿名';
})();

function setStatus(text, type){
  els.status.textContent = text;
  els.status.className = 'status show ' + type;
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function ghRequest(path, options, owner, repo, token){
  return fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, Object.assign({
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json'
    }
  }, options));
}

// ===== 发布诗歌 =====
els.btn.addEventListener('click', async function(){
  var owner = els.owner.value.trim();
  var repo = els.repo.value.trim();
  var token = els.token.value.trim();
  var title = els.title.value.trim();
  var date = els.date.value.trim();
  var content = els.content.value.trim();
  var series = els.series.value.trim() || '未分类';
  var subseries = els.subseries.value.trim();
  var author = els.author.value.trim() || '匿名';
  var files = Array.from(els.image.files || []);

  if(!owner || !repo || !token){ setStatus('请先填写仓库信息和密钥', 'err'); return; }
  if(!title || !content){ setStatus('标题和正文不能为空', 'err'); return; }
  if(!date){ setStatus('请填写日期（至少年份）', 'err'); return; }

  els.btn.disabled = true;
  setStatus('发布中…', 'loading');

  try{
    if(els.remember.checked){
      localStorage.setItem('gh_admin_creds', JSON.stringify({owner:owner, repo:repo, token:token}));
    } else {
      localStorage.removeItem('gh_admin_creds');
    }

    var imagePaths = [];
    for(var i = 0; i < files.length; i++){
      var f = files[i];
      setStatus('上传图片 ' + (i+1) + '/' + files.length, 'loading');
      var base64 = await fileToBase64(f);
      var safeName = Date.now() + '-' + i + '-' + f.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
      var imgPath = 'images/' + safeName;
      var imgRes = await ghRequest(imgPath, {
        method: 'PUT',
        body: JSON.stringify({ message: '配图: ' + title, content: base64 })
      }, owner, repo, token);
      if(!imgRes.ok){ throw new Error('图片上传失败'); }
      imagePaths.push(imgPath);
    }

    setStatus('保存数据…', 'loading');
    var sha = null;
    var poems = [];
    var getRes = await ghRequest('data/poems.json', {}, owner, repo, token);
    if(getRes.ok){
      var fileData = await getRes.json();
      sha = fileData.sha;
      var decoded = decodeURIComponent(escape(atob(fileData.content)));
      poems = JSON.parse(decoded);
    } else if(getRes.status !== 404){
      throw new Error('读取 data/poems.json 失败');
    }

    var newPoem = {
      id: String(Date.now()),
      title: title,
      date: date,
      content: content,
      series: series,
      author: author,
      images: imagePaths
    };
    if(subseries){ newPoem.subseries = subseries; }
    poems.push(newPoem);

    var newContentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(poems, null, 2))));
    var putBody = { message: '发布: ' + title, content: newContentB64 };
    if(sha){ putBody.sha = sha; }

    var putRes = await ghRequest('data/poems.json', {
      method: 'PUT',
      body: JSON.stringify(putBody)
    }, owner, repo, token);
    if(!putRes.ok){ throw new Error('保存 data/poems.json 失败'); }

    setStatus('✓ 发布成功！', 'ok');
    els.title.value = '';
    els.content.value = '';
    els.series.value = '';
    els.subseries.value = '';
    els.image.value = '';
    loadManageList();

  } catch(err){
    setStatus('✗ ' + err.message, 'err');
  } finally {
    els.btn.disabled = false;
  }
});

// ===== 管理列表 =====
var manageListEl = document.getElementById('poem-manage-list');
var manageStatusEl = document.getElementById('manage-status');

function setManageStatus(text, type){
  manageStatusEl.textContent = text;
  manageStatusEl.className = 'status show ' + type;
}

async function loadManageList(){
  var owner = els.owner.value.trim();
  var repo = els.repo.value.trim();
  var token = els.token.value.trim();
  if(!owner || !repo || !token){
    manageListEl.innerHTML = '<div class="hint">先填好①的仓库信息和密钥</div>';
    return;
  }
  manageListEl.innerHTML = '<div class="hint">加载中…</div>';
  try{
    var res = await ghRequest('data/poems.json', {}, owner, repo, token);
    if(!res.ok){ throw new Error('找不到 data/poems.json'); }
    var fileData = await res.json();
    var decoded = decodeURIComponent(escape(atob(fileData.content)));
    var poems = JSON.parse(decoded);

    if(poems.length === 0){
      manageListEl.innerHTML = '<div class="hint">目前没有已发布的诗</div>';
      return;
    }

    poems.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    manageListEl.innerHTML = '';
    poems.forEach(function(p){
      var row = document.createElement('div');
      row.className = 'manage-item';
      row.innerHTML =
        '<div class="mi-info">' + escapeHtml(p.title) +
          '<span class="mi-date">' + escapeHtml(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
        '</div>' +
        '<button class="mi-edit" type="button">编辑</button>' +
        '<button class="mi-del" type="button">删除</button>';

      var form = document.createElement('div');
      form.className = 'mi-edit-form';
      form.style.display = 'none';
      form.innerHTML =
        '<label>标题</label><input type="text" class="mi-f-title" value="' + escapeHtml(p.title) + '">' +
        '<div class="row">' +
          '<div><label>日期</label><input type="text" class="mi-f-date" value="' + escapeHtml(p.date) + '"></div>' +
          '<div><label>作者</label><input type="text" class="mi-f-author" value="' + escapeHtml(p.author || '') + '"></div>' +
        '</div>' +
        '<label>序列</label><input type="text" class="mi-f-series" value="' + escapeHtml(p.series || '未分类') + '" list="p-series-list">' +
        '<label>子分类</label><input type="text" class="mi-f-subseries" value="' + escapeHtml(p.subseries || '') + '">' +
        '<label>正文</label><textarea class="mi-f-content">' + escapeHtml(p.content) + '</textarea>' +
        '<button class="mi-f-save" type="button">保存</button>' +
        '<button class="mi-f-cancel" type="button" style="background:var(--charcoal);">取消</button>';

      row.querySelector('.mi-edit').addEventListener('click', function(){
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });
      form.querySelector('.mi-f-cancel').addEventListener('click', function(){
        form.style.display = 'none';
      });
      form.querySelector('.mi-f-save').addEventListener('click', function(){
        saveFullPoem(p.id, {
          title: form.querySelector('.mi-f-title').value.trim(),
          date: form.querySelector('.mi-f-date').value.trim(),
          author: form.querySelector('.mi-f-author').value.trim() || '匿名',
          series: form.querySelector('.mi-f-series').value.trim() || '未分类',
          subseries: form.querySelector('.mi-f-subseries').value.trim(),
          content: form.querySelector('.mi-f-content').value.trim()
        });
      });
      row.querySelector('.mi-del').addEventListener('click', function(){
        deletePoem(p.id);
      });

      manageListEl.appendChild(row);
      manageListEl.appendChild(form);
    });

    var seriesList = document.getElementById('p-series-list');
    var seriesSet = Array.from(new Set(poems.map(function(p){ return p.series || '未分类'; })));
    seriesList.innerHTML = seriesSet.map(function(s){ return '<option value="' + escapeHtml(s) + '">'; }).join('');

    var subseriesList = document.getElementById('p-subseries-list');
    var subseriesSet = Array.from(new Set(poems.map(function(p){ return p.subseries || ''; }).filter(function(s){ return s; })));
    subseriesList.innerHTML = subseriesSet.map(function(s){ return '<option value="' + escapeHtml(s) + '">'; }).join('');

  } catch(err){
    manageListEl.innerHTML = '<div class="hint">加载失败：' + err.message + '</div>';
  }
}

async function saveFullPoem(id, fields){
  var owner = els.owner.value.trim();
  var repo = els.repo.value.trim();
  var token = els.token.value.trim();

  if(!fields.title || !fields.content){ setManageStatus('✗ 标题和正文不能为空', 'err'); return; }
  if(!fields.date){ setManageStatus('✗ 请填写日期', 'err'); return; }

  setManageStatus('保存中…', 'loading');
  try{
    var getRes = await ghRequest('data/poems.json', {}, owner, repo, token);
    if(!getRes.ok){ throw new Error('读取 data/poems.json 失败'); }
    var fileData = await getRes.json();
    var sha = fileData.sha;
    var decoded = decodeURIComponent(escape(atob(fileData.content)));
    var poems = JSON.parse(decoded);

    var target = poems.find(function(p){ return p.id === id; });
    if(target){
      target.title = fields.title;
      target.date = fields.date;
      target.author = fields.author;
      target.series = fields.series;
      if(fields.subseries){ target.subseries = fields.subseries; } else { delete target.subseries; }
      target.content = fields.content;
    }

    var newContentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(poems, null, 2))));
    var putRes = await ghRequest('data/poems.json', {
      method: 'PUT',
      body: JSON.stringify({ message: '修改: ' + (target ? target.title : id), content: newContentB64, sha: sha })
    }, owner, repo, token);
    if(!putRes.ok){ throw new Error('保存 data/poems.json 失败'); }

    setManageStatus('✓ 已保存', 'ok');
    loadManageList();
  } catch(err){
    setManageStatus('✗ ' + err.message, 'err');
  }
}

async function deletePoem(id){
  var owner = els.owner.value.trim();
  var repo = els.repo.value.trim();
  var token = els.token.value.trim();
  if(!confirm('确定要删除吗？')) return;

  setManageStatus('删除中…', 'loading');
  try{
    var getRes = await ghRequest('data/poems.json', {}, owner, repo, token);
    if(!getRes.ok){ throw new Error('读取 data/poems.json 失败'); }
    var fileData = await getRes.json();
    var sha = fileData.sha;
    var decoded = decodeURIComponent(escape(atob(fileData.content)));
    var poems = JSON.parse(decoded);

    var target = poems.find(function(p){ return p.id === id; });
    var remaining = poems.filter(function(p){ return p.id !== id; });

    var newContentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(remaining, null, 2))));
    var putRes = await ghRequest('data/poems.json', {
      method: 'PUT',
      body: JSON.stringify({ message: '删除: ' + (target ? target.title : id), content: newContentB64, sha: sha })
    }, owner, repo, token);
    if(!putRes.ok){ throw new Error('更新 data/poems.json 失败'); }

    if(target && target.images){
      for(var i = 0; i < target.images.length; i++){
        var imgPath = target.images[i];
        try{
          var imgGetRes = await ghRequest(imgPath, {}, owner, repo, token);
          if(imgGetRes.ok){
            var imgData = await imgGetRes.json();
            await ghRequest(imgPath, { method: 'DELETE', body: JSON.stringify({ message: '删除配图', sha: imgData.sha }) }, owner, repo, token);
          }
        }catch(e){}
      }
    }

    setManageStatus('✓ 已删除', 'ok');
    loadManageList();
  } catch(err){
    setManageStatus('✗ ' + err.message, 'err');
  }
}

document.getElementById('refresh-list-btn').addEventListener('click', loadManageList);

// ===== 首次加载 =====
if(els.owner.value && els.repo.value && els.token.value){
  loadManageList();
}

// ===== 主题 =====
(function(){
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if(!btns.length) return;
  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }
  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      applyTheme(this.getAttribute('data-theme'));
    });
  });
})();
</script>
