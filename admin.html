<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌漂流 · 管理后台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  margin: 0;
  padding: 40px 20px 100px;
  transition: background 0.3s, color 0.3s;
}
.wrap { max-width: 640px; margin: 0 auto; }
h1 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.8rem;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.sub {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--ink-faded);
  margin-bottom: 32px;
}
.panel {
  background: var(--paper-dark);
  padding: 24px 28px;
  margin-bottom: 24px;
  border: 1px solid var(--gold-light);
}
.panel h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  margin-bottom: 14px;
}
label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  margin: 14px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
input[type=text], input[type=password], input[type=date], textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--gold-light);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 300;
  color: var(--ink);
  border-radius: 8px;
  transition: border-color 0.3s;
}
input:focus, textarea:focus { outline: none; border-color: var(--gold); }
textarea { min-height: 140px; resize: vertical; line-height: 1.7; }
input[type=file] { font-family: var(--font-mono); font-size: 0.7rem; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 120px; }
.date-group {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.date-group input[type=text] { flex: 1; min-width: 120px; }
.date-group .btn-sm {
  padding: 4px 12px;
  font-size: 0.55rem;
  border: 1px solid var(--gold-light);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono);
  color: var(--ink-faded);
  border-radius: 999px;
  transition: background 0.2s, border-color 0.2s;
}
.date-group .btn-sm:hover { background: var(--gold-light); border-color: var(--gold); }
button {
  margin-top: 18px;
  padding: 11px 24px;
  border: none;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  background: var(--ink);
  color: var(--paper);
  border-radius: 8px;
  transition: background 0.25s;
}
button:hover { background: var(--clay); }
button:disabled { background: var(--ink-faded); cursor: not-allowed; }
.hint {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-faded);
  margin-top: 6px;
  line-height: 1.6;
}
.status {
  margin-top: 14px;
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  display: none;
}
.status.show { display: block; }
.status.ok { background: #e6f2e8; color: #2b6b3a; }
.status.err { background: #f7e6e6; color: var(--clay); }
.status.loading { background: var(--gold-light); color: var(--ink-light); }
.warn-box {
  background: rgba(184, 92, 58, 0.06);
  border-left: 2px solid var(--clay);
  padding: 14px 18px;
  font-size: 0.8rem;
  color: var(--ink-light);
  margin-bottom: 24px;
  line-height: 1.7;
}
.manage-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--gold-light);
}
.manage-item .mi-info { font-size: 0.88rem; }
.manage-item .mi-date {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  color: var(--ink-faded);
  display: block;
  margin-top: 2px;
}
.manage-item .mi-del {
  margin: 0;
  padding: 6px 14px;
  font-size: 0.6rem;
  background: transparent;
  color: var(--clay);
  border: 1px solid var(--clay);
}
.manage-item .mi-del:hover { background: var(--clay); color: var(--paper); }
.manage-item .mi-edit {
  margin: 0;
  padding: 6px 14px;
  font-size: 0.6rem;
  background: transparent;
  color: var(--ink-faded);
  border: 1px solid var(--gold-light);
}
.manage-item .mi-edit:hover { background: var(--gold-light); }
.mi-edit-form {
  background: var(--paper);
  padding: 14px 18px;
  margin: 6px 0 10px;
  border: 1px solid var(--gold-light);
}
.mi-edit-form label { margin: 10px 0 4px; font-size: 0.5rem; }
.mi-edit-form textarea { min-height: 80px; }
.mi-edit-form .row { display: flex; gap: 12px; }
.mi-edit-form .row > div { flex: 1; }
.mi-edit-form .mi-f-save { margin-top: 12px; padding: 8px 18px; font-size: 0.6rem; }
.mi-edit-form .mi-f-cancel { margin-top: 12px; padding: 8px 18px; font-size: 0.6rem; background: var(--ink-faded); }

.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 100000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-faded);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--gold);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

#password-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(44, 42, 40, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: opacity 0.5s;
}
#password-overlay.hidden { opacity: 0; pointer-events: none; }
#password-overlay .box {
  background: var(--paper);
  padding: 40px 44px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  border: 1px solid var(--gold-light);
}
#password-overlay .box h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.3rem;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
#password-overlay .box p {
  color: var(--ink-faded);
  font-size: 0.8rem;
  margin-bottom: 20px;
}
#password-overlay .box input[type="password"] {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--gold-light);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  color: var(--ink);
  margin-bottom: 14px;
}
#password-overlay .box button {
  width: 100%;
  padding: 12px;
  border: none;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  cursor: pointer;
  transition: background 0.25s;
}
#password-overlay .box button:hover { background: var(--clay); }
#password-overlay .error-msg {
  color: var(--clay);
  font-family: var(--font-mono);
  font-size: 0.65rem;
  margin-top: 10px;
  min-height: 1.2em;
}
</style>
</head>
<body>

<div id="password-overlay">
  <div class="box">
    <h2>🔐 验证</h2>
    <p>请输入后台密码</p>
    <input type="password" id="password-input" placeholder="密码" autofocus>
    <button id="password-submit">确认</button>
    <div class="error-msg" id="password-error"></div>
  </div>
</div>

<div class="content-wrapper" style="display:none;">
  <div class="wrap">
    <h1>诗歌漂流 · 管理后台</h1>
    <div class="sub">私人使用，请勿分享链接</div>

    <div class="warn-box">⚠️ Token 具有修改仓库内容的权限，请妥善保管。</div>

    <div class="panel">
      <h2>① 仓库设置</h2>
      <label>用户名</label>
      <input type="text" id="gh-owner" value="zhege712-crypto">
      <label>仓库名</label>
      <input type="text" id="gh-repo" value="Poem_Ulysses">
      <label>Token</label>
      <input type="password" id="gh-token" placeholder="ghp_ 或 github_pat_ 开头">
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:0.75rem; color:var(--ink-light);">
        <input type="checkbox" id="remember" style="width:auto;"> 记住
      </label>
    </div>

    <div class="panel">
      <h2>② 发布新诗</h2>
      <div class="row">
        <div><label>标题</label><input type="text" id="p-title"></div>
        <div>
          <label>日期</label>
          <div class="date-group">
            <input type="text" id="p-date">
            <button type="button" class="btn-sm" data-target="p-date" data-precision="year">年</button>
            <button type="button" class="btn-sm" data-target="p-date" data-precision="month">月</button>
            <button type="button" class="btn-sm" data-target="p-date" data-precision="day">日</button>
          </div>
        </div>
      </div>
      <label>正文</label>
      <textarea id="p-content"></textarea>
      <label>序列</label>
      <input type="text" id="p-series" placeholder="例如：天一篇" list="series-list">
      <datalist id="series-list"></datalist>
      <label>子分类</label>
      <input type="text" id="p-subseries" placeholder="例如：现代诗" list="subseries-list">
      <datalist id="subseries-list"></datalist>
      <label>作者</label>
      <input type="text" id="p-author" placeholder="署名">
      <label>配图</label>
      <input type="file" id="p-image" accept="image/*" multiple>
      <button id="publish-btn">发布</button>
      <div class="status" id="status"></div>
    </div>

    <div class="panel">
      <h2>③ 管理诗歌</h2>
      <div id="poem-manage-list"><div class="hint">加载中…</div></div>
      <button id="refresh-btn" style="background:var(--ink-faded);">刷新列表</button>
      <div class="status" id="manage-status"></div>
    </div>
  </div>
</div>

<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/></svg></button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<script>
// ===== 密码门 =====
(function() {
  var overlay = document.getElementById('password-overlay');
  var input = document.getElementById('password-input');
  var submit = document.getElementById('password-submit');
  var error = document.getElementById('password-error');
  var content = document.querySelector('.content-wrapper');
  var PASSWORD = 'umbrella2026';

  if (sessionStorage.getItem('admin_auth') === 'true') {
    overlay.classList.add('hidden');
    content.style.display = 'block';
    return;
  }
  function verify() {
    var val = input.value.trim();
    if (!val) { error.textContent = '请输入密码'; return; }
    if (val === PASSWORD) {
      sessionStorage.setItem('admin_auth', 'true');
      overlay.classList.add('hidden');
      content.style.display = 'block';
      document.getElementById('gh-owner').focus();
    } else {
      error.textContent = '密码错误';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', verify);
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') verify(); });
  input.focus();
})();

// ===== 主功能 =====
var els = {
  owner: document.getElementById('gh-owner'),
  repo: document.getElementById('gh-repo'),
  token: document.getElementById('gh-token'),
  remember: document.getElementById('remember'),
  title: document.getElementById('p-title'),
  date: document.getElementById('p-date'),
  content: document.getElementById('p-content'),
  series: document.getElementById('p-series'),
  subseries: document.getElementById('p-subseries'),
  author: document.getElementById('p-author'),
  image: document.getElementById('p-image'),
  btn: document.getElementById('publish-btn'),
  status: document.getElementById('status')
};

function fillDate(id, p) {
  var now = new Date();
  var y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  document.getElementById(id).value = p === 'year' ? y : p === 'month' ? y+'-'+m : y+'-'+m+'-'+d;
}
document.querySelectorAll('.btn-sm').forEach(function(b) {
  b.addEventListener('click', function(e) {
    e.preventDefault();
    fillDate(this.dataset.target, this.dataset.precision);
  });
});

(function() {
  var saved = localStorage.getItem('gh_creds');
  if (saved) { try { var c = JSON.parse(saved); els.owner.value = c.owner || ''; els.repo.value = c.repo || ''; els.token.value = c.token || ''; els.remember.checked = true; } catch(e) {} }
  var now = new Date(), y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  if (!els.date.value) els.date.value = y+'-'+m+'-'+d;
  els.author.value = '匿名';
})();

function setStatus(el, text, type) {
  el.textContent = text;
  el.className = 'status show ' + type;
}
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fileToBase64(f) { return new Promise(function(r, rej) { var reader = new FileReader(); reader.onload = function() { r(reader.result.split(',')[1]); }; reader.onerror = rej; reader.readAsDataURL(f); }); }
function ghRequest(path, options, owner, repo, token) {
  return fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
  }, options));
}

// ===== 发布 =====
els.btn.addEventListener('click', async function() {
  var owner = els.owner.value.trim(), repo = els.repo.value.trim(), token = els.token.value.trim();
  var title = els.title.value.trim(), date = els.date.value.trim(), content = els.content.value.trim();
  var series = els.series.value.trim() || '未分类', subseries = els.subseries.value.trim(), author = els.author.value.trim() || '匿名';
  var files = Array.from(els.image.files || []);
  if (!owner || !repo || !token) { setStatus(els.status, '请填写仓库信息', 'err'); return; }
  if (!title || !content) { setStatus(els.status, '标题和正文不能为空', 'err'); return; }
  if (!date) { setStatus(els.status, '请填写日期', 'err'); return; }

  els.btn.disabled = true;
  setStatus(els.status, '发布中…', 'loading');

  try {
    if (els.remember.checked) localStorage.setItem('gh_creds', JSON.stringify({owner:owner, repo:repo, token:token}));
    else localStorage.removeItem('gh_creds');

    var imagePaths = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      setStatus(els.status, '上传图片 ' + (i+1)+'/'+files.length, 'loading');
      var b64 = await fileToBase64(f);
      var name = Date.now() + '-' + i + '-' + f.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
      var path = 'images/' + name;
      var r = await ghRequest(path, { method: 'PUT', body: JSON.stringify({ message: '配图', content: b64 }) }, owner, repo, token);
      if (!r.ok) throw new Error('图片上传失败');
      imagePaths.push(path);
    }

    setStatus(els.status, '保存数据…', 'loading');
    var sha = null, poems = [];
    var apiGet = await ghRequest('data/poems.json?t=' + Date.now(), {}, owner, repo, token);
    if (apiGet.ok) {
      var d = await apiGet.json();
      sha = d.sha;
      poems = JSON.parse(decodeURIComponent(escape(atob(d.content))));
    } else if (apiGet.status === 404) {
      sha = null;
    } else {
      throw new Error('读取失败');
    }

    var newPoem = { id: String(Date.now()), title: title, date: date, content: content, series: series, author: author, images: imagePaths };
    if (subseries) newPoem.subseries = subseries;
    poems.push(newPoem);

    var b64Content = btoa(unescape(encodeURIComponent(JSON.stringify(poems, null, 2))));
    var putBody = { message: '发布: ' + title, content: b64Content };
    if (sha) putBody.sha = sha;
    var putRes = await ghRequest('data/poems.json', { method: 'PUT', body: JSON.stringify(putBody) }, owner, repo, token);
    if (!putRes.ok) throw new Error('保存失败');

    setStatus(els.status, '✓ 发布成功！', 'ok');
    els.title.value = ''; els.content.value = ''; els.series.value = ''; els.subseries.value = ''; els.image.value = '';
    loadList();

  } catch(e) { setStatus(els.status, '✗ ' + e.message, 'err'); }
  finally { els.btn.disabled = false; }
});

// ===== 管理列表 =====
var listEl = document.getElementById('poem-manage-list');
var manageStatus = document.getElementById('manage-status');

function setManageStatus(text, type) { manageStatus.textContent = text; manageStatus.className = 'status show ' + type; }

function fetchWithTimeout(url, ms) {
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, ms || 8000);
  return fetch(url, { signal: ctrl.signal }).then(function(r) { clearTimeout(t); return r; }, function(e) { clearTimeout(t); throw e; });
}

async function loadList() {
  var owner = els.owner.value.trim(), repo = els.repo.value.trim();
  if (!owner || !repo) { listEl.innerHTML = '<div class="hint">请先填写用户名和仓库名</div>'; return; }
  listEl.innerHTML = '<div class="hint">加载中…</div>';
  var poems = [];
  try {
    var res = await fetchWithTimeout('data/poems.json?t=' + Date.now());
    if (res.ok) poems = await res.json();
  } catch(e) {}
  if (!poems || !poems.length) {
    try {
      var rawUrl = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/data/poems.json?t=' + Date.now();
      var res2 = await fetchWithTimeout(rawUrl);
      if (res2.ok) poems = await res2.json();
    } catch(e) {}
  }
  if (!poems || !poems.length) { listEl.innerHTML = '<div class="hint">还没有诗</div>'; return; }
  try {

    poems.sort(function(a,b) { return new Date(b.date) - new Date(a.date); });
    listEl.innerHTML = '';
    poems.forEach(function(p) {
      var row = document.createElement('div');
      row.className = 'manage-item';
      row.innerHTML =
        '<div class="mi-info">' + escapeHtml(p.title) +
          '<span class="mi-date">' + escapeHtml(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
        '</div>' +
        '<div><button class="mi-edit" type="button">编辑</button> <button class="mi-del" type="button">删除</button></div>';
      var form = document.createElement('div');
      form.className = 'mi-edit-form';
      form.style.display = 'none';
      form.innerHTML =
        '<label>标题</label><input type="text" class="mi-f-title" value="' + escapeHtml(p.title) + '">' +
        '<div class="row"><div><label>日期</label><input type="text" class="mi-f-date" value="' + escapeHtml(p.date) + '"></div><div><label>作者</label><input type="text" class="mi-f-author" value="' + escapeHtml(p.author || '') + '"></div></div>' +
        '<label>序列</label><input type="text" class="mi-f-series" value="' + escapeHtml(p.series || '未分类') + '">' +
        '<label>子分类</label><input type="text" class="mi-f-subseries" value="' + escapeHtml(p.subseries || '') + '">' +
        '<label>正文</label><textarea class="mi-f-content">' + escapeHtml(p.content) + '</textarea>' +
        '<button class="mi-f-save" type="button">保存</button> <button class="mi-f-cancel" type="button" style="background:var(--ink-faded);">取消</button>';

      row.querySelector('.mi-edit').addEventListener('click', function() {
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });
      form.querySelector('.mi-f-cancel').addEventListener('click', function() { form.style.display = 'none'; });
      form.querySelector('.mi-f-save').addEventListener('click', function() {
        savePoem(p.id, {
          title: form.querySelector('.mi-f-title').value.trim(),
          date: form.querySelector('.mi-f-date').value.trim(),
          author: form.querySelector('.mi-f-author').value.trim() || '匿名',
          series: form.querySelector('.mi-f-series').value.trim() || '未分类',
          subseries: form.querySelector('.mi-f-subseries').value.trim(),
          content: form.querySelector('.mi-f-content').value.trim()
        });
      });
      row.querySelector('.mi-del').addEventListener('click', function() { deletePoem(p.id); });
      listEl.appendChild(row);
      listEl.appendChild(form);
    });

    var seriesSet = Array.from(new Set(poems.map(function(p) { return p.series || '未分类'; })));
    document.getElementById('series-list').innerHTML = seriesSet.map(function(s) { return '<option value="' + escapeHtml(s) + '">'; }).join('');
    var subSet = Array.from(new Set(poems.map(function(p) { return p.subseries || ''; }).filter(function(s) { return s; })));
    document.getElementById('subseries-list').innerHTML = subSet.map(function(s) { return '<option value="' + escapeHtml(s) + '">'; }).join('');

  } catch(e) { listEl.innerHTML = '<div class="hint">加载失败：' + e.message + '</div>'; }
}

async function savePoem(id, fields) {
  var owner = els.owner.value.trim(), repo = els.repo.value.trim(), token = els.token.value.trim();
  if (!fields.title || !fields.content) { setManageStatus('标题和正文不能为空', 'err'); return; }
  if (!fields.date) { setManageStatus('请填写日期', 'err'); return; }
  setManageStatus('保存中…', 'loading');
  try {
    var getRes = await ghRequest('data/poems.json?t=' + Date.now(), {}, owner, repo, token);
    if (!getRes.ok) throw new Error('读取失败');
    var d = await getRes.json();
    var sha = d.sha, poems = JSON.parse(decodeURIComponent(escape(atob(d.content))));
    var target = poems.find(function(p) { return p.id === id; });
    if (target) { target.title = fields.title; target.date = fields.date; target.author = fields.author; target.series = fields.series; if (fields.subseries) target.subseries = fields.subseries; else delete target.subseries; target.content = fields.content; }
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(poems, null, 2))));
    var put = await ghRequest('data/poems.json', { method: 'PUT', body: JSON.stringify({ message: '修改', content: b64, sha: sha }) }, owner, repo, token);
    if (!put.ok) throw new Error('保存失败');
    setManageStatus('✓ 已保存', 'ok');
    loadList();
  } catch(e) { setManageStatus('✗ ' + e.message, 'err'); }
}

async function deletePoem(id) {
  if (!confirm('确定删除吗？')) return;
  var owner = els.owner.value.trim(), repo = els.repo.value.trim(), token = els.token.value.trim();
  setManageStatus('删除中…', 'loading');
  try {
    var getRes = await ghRequest('data/poems.json?t=' + Date.now(), {}, owner, repo, token);
    if (!getRes.ok) throw new Error('读取失败');
    var d = await getRes.json();
    var sha = d.sha, poems = JSON.parse(decodeURIComponent(escape(atob(d.content))));
    var target = poems.find(function(p) { return p.id === id; });
    var remaining = poems.filter(function(p) { return p.id !== id; });
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(remaining, null, 2))));
    var put = await ghRequest('data/poems.json', { method: 'PUT', body: JSON.stringify({ message: '删除', content: b64, sha: sha }) }, owner, repo, token);
    if (!put.ok) throw new Error('删除失败');
    if (target && target.images) {
      for (var i = 0; i < target.images.length; i++) {
        try { var imgGet = await ghRequest(target.images[i], {}, owner, repo, token); if (imgGet.ok) { var imgD = await imgGet.json(); await ghRequest(target.images[i], { method: 'DELETE', body: JSON.stringify({ message: '删图', sha: imgD.sha }) }, owner, repo, token); } } catch(e) {}
      }
    }
    setManageStatus('✓ 已删除', 'ok');
    loadList();
  } catch(e) { setManageStatus('✗ ' + e.message, 'err'); }
}

document.getElementById('refresh-btn').addEventListener('click', loadList);

// ===== 主题 =====
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;
  function isNight() { var h = new Date().getHours(); return h >= 19 || h < 6; }
  function applyTheme(theme) {
    if (theme === 'light') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    btns.forEach(function(b) { b.classList.toggle('active', b.dataset.theme === theme); });
  }
  var saved = localStorage.getItem('theme');
  var initial = (saved && ['light','dark','eye-care'].includes(saved)) ? saved : (isNight() ? 'dark' : 'light');
  applyTheme(initial);
  btns.forEach(function(b) { b.addEventListener('click', function() { applyTheme(this.dataset.theme); }); });
  var style = document.createElement('style');
  style.textContent =
    '[data-theme="dark"] { --paper: #1E1E1C; --paper-dark: #2A2A27; --ink: #ECECE5; --ink-light: #C4C4BE; --ink-faded: #8A8A85; --gold: #D4A373; --gold-light: #4A4A45; --clay: #E55A5F; } ' +
    '[data-theme="eye-care"] { --paper: #ECF3E5; --paper-dark: #DEE8D4; --ink: #3A4632; --ink-light: #5C6A4F; --ink-faded: #82906F; --gold: #BDA26C; --gold-light: #C6D3B4; --clay: #B2674F; } ' +
    '[data-theme="dark"] .side-theme, [data-theme="eye-care"] .side-theme { background: rgba(30,30,28,0.7); border-color: var(--gold-light); }';
  document.head.appendChild(style);
})();

// ===== 初始加载 =====
if (els.owner.value && els.repo.value) loadList();
['owner', 'repo'].forEach(function(k) {
  els[k].addEventListener('input', function() {
    if (els.owner.value.trim() && els.repo.value.trim()) loadList();
  });
});
</script>
