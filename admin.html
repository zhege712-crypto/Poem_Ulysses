<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌漂流 · 管理后台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script>
window._AMapSecurityConfig = { securityJsCode: '04c025910305edb4acc29abc295c4707' };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=0fd1637fe9e1febffcc26b2bd8ccfdcc&plugin=AMap.Scale"></script>
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  margin: 0;
  padding: 40px 20px 100px;
  transition: background 0.3s, color 0.3s;
}
.wrap { max-width: 760px; margin: 0 auto; }
h1 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.8rem;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.sub {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--ink-faded);
  margin-bottom: 24px;
}
.warn-box {
  background: rgba(184, 92, 58, 0.06);
  border-left: 2px solid var(--clay);
  padding: 14px 18px;
  font-size: 0.8rem;
  color: var(--ink-light);
  margin-bottom: 24px;
  line-height: 1.7;
}

/* ===== Tab 导航 ===== */
.tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--gold-light);
  padding-bottom: 0;
  flex-wrap: wrap;
}
.tab-bar button {
  margin: 0;
  padding: 10px 22px;
  border: none;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--ink-faded);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.25s, border-color 0.25s;
}
.tab-bar button:hover { color: var(--ink); }
.tab-bar button.active {
  color: var(--ink);
  border-bottom-color: var(--gold);
}
.tab-bar button .tb-count {
  font-size: 0.5rem;
  color: var(--clay);
  margin-left: 4px;
}

/* ===== 视图切换 ===== */
.view { display: none; }
.view.active { display: block; }
.view-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.view-head h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  margin: 0;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--gold-light);
  border-radius: 999px;
  padding: 6px 14px;
  margin: 0;
  cursor: pointer;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
}
.back-btn:hover { background: var(--gold-light); color: var(--ink); border-color: var(--gold); }
.back-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.4; }

.panel {
  background: var(--paper-dark);
  padding: 24px 28px;
  margin-bottom: 24px;
  border: 1px solid var(--gold-light);
}
label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  margin: 14px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
input[type=text], input[type=password], input[type=date], input[type=number], textarea, select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--gold-light);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 300;
  color: var(--ink);
  border-radius: 8px;
  transition: border-color 0.3s;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
textarea { min-height: 140px; resize: vertical; line-height: 1.7; }
input[type=file] { font-family: var(--font-mono); font-size: 0.7rem; }
input[type=checkbox] { width: auto; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 120px; }
.date-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.date-group input[type=text] { flex: 1; min-width: 120px; }
.btn-sm {
  padding: 4px 12px;
  font-size: 0.55rem;
  border: 1px solid var(--gold-light);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono);
  color: var(--ink-faded);
  border-radius: 999px;
  transition: background 0.2s, border-color 0.2s;
}
.btn-sm:hover { background: var(--gold-light); border-color: var(--gold); }
button {
  margin-top: 18px;
  padding: 11px 24px;
  border: none;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  background: var(--ink);
  color: var(--paper);
  border-radius: 8px;
  transition: background 0.25s;
}
button:hover { background: var(--clay); }
button:disabled { background: var(--ink-faded); cursor: not-allowed; }
button.ghost {
  background: transparent;
  color: var(--ink-light);
  border: 1px solid var(--gold-light);
  margin-left: 10px;
}
button.ghost:hover { background: var(--gold-light); color: var(--ink); }
button.danger {
  background: transparent;
  color: var(--clay);
  border: 1px solid var(--clay);
}
button.danger:hover { background: var(--clay); color: var(--paper); }
.btn-add {
  background: transparent;
  color: var(--ink-light);
  border: 1px dashed var(--gold);
  border-radius: 999px;
  width: 100%;
  padding: 9px;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
}
.btn-add:hover { background: var(--gold-light); color: var(--ink); border-style: solid; }
.hint {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-faded);
  margin-top: 6px;
  line-height: 1.6;
}
.status {
  margin-top: 14px;
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  display: none;
}
.status.show { display: block; }
.status.ok { background: #e6f2e8; color: #2b6b3a; }
.status.err { background: #f7e6e6; color: var(--clay); }
.status.loading { background: var(--gold-light); color: var(--ink-light); }

/* ===== 列表 ===== */
.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--gold-light);
  cursor: pointer;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1rem;
  color: var(--ink);
}
.group-head .tri { font-size: 0.55rem; color: var(--ink-faded); transition: transform 0.25s; font-family: var(--font-mono); }
.group-head.collapsed .tri { transform: rotate(-90deg); }
.group-head .g-count {
  font-family: var(--font-mono);
  font-size: 0.52rem;
  color: var(--ink-faded);
  border: 1px solid var(--gold-light);
  border-radius: 999px;
  padding: 1px 10px;
}
.group-body { padding-left: 2px; }
.manage-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--gold-light);
}
.manage-item .mi-info { font-size: 0.88rem; }
.manage-item .mi-date {
  font-family: var(--font-mono);
  font-size: 0.52rem;
  color: var(--ink-faded);
  display: block;
  margin-top: 2px;
}
.manage-item .mi-actions { display: flex; gap: 6px; flex-shrink: 0; }
.manage-item .mi-actions button {
  margin: 0;
  padding: 6px 14px;
  font-size: 0.58rem;
  background: transparent;
  border: 1px solid var(--gold-light);
  color: var(--ink-faded);
}
.manage-item .mi-actions button:hover { background: var(--gold-light); color: var(--ink); }
.manage-item .mi-actions button.danger { color: var(--clay); border-color: var(--clay); }
.manage-item .mi-actions button.danger:hover { background: var(--clay); color: var(--paper); }
.mi-coord {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--gold);
  margin-top: 2px;
}
.mi-tag {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--clay);
  border: 1px solid var(--gold-light);
  border-radius: 999px;
  padding: 0 8px;
  margin-left: 6px;
}
.acc-row { cursor: pointer; }
.acc-row .mi-toggle {
  margin: 0;
  padding: 0;
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--gold-light);
  background: transparent;
  color: var(--ink-light);
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.7rem;
  transition: background 0.25s, color 0.25s, transform 0.25s;
  flex-shrink: 0;
}
.acc-row .mi-toggle:hover { background: var(--gold-light); color: var(--ink); }
.acc-row .mi-toggle.open { transform: rotate(90deg); }
.acc-panel {
  display: none;
  background: var(--paper);
  border: 1px solid var(--gold-light);
  border-radius: 8px;
  margin: 6px 0 12px;
  padding: 12px 14px;
}
.acc-panel.open { display: block; }
.acc-panel .ap-title {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 8px;
  text-transform: uppercase;
}
.acc-sub-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 2px;
  border-bottom: 1px solid var(--gold-light);
  font-size: 0.82rem;
}
.acc-sub-item:last-child { border-bottom: none; }
.acc-sub-item .asi-title { color: var(--ink); }
.acc-sub-item .asi-meta {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--ink-faded);
  margin-top: 2px;
}
.acc-sub-item .asi-actions { display: flex; gap: 6px; }
.acc-sub-item .asi-actions button {
  margin: 0;
  padding: 3px 10px;
  font-size: 0.52rem;
  background: transparent;
  color: var(--ink-faded);
  border: 1px solid var(--gold-light);
  border-radius: 999px;
}
.acc-sub-item .asi-actions button:hover { background: var(--gold-light); color: var(--ink); }
.acc-empty { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-faded); padding: 8px 0; }

/* ===== 编辑视图 ===== */
.edit-form .panel { padding: 20px 24px; }
.edit-form .form-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 400;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.edit-form .form-sub {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  color: var(--ink-faded);
  margin-bottom: 6px;
}
.img-manage { display: flex; flex-direction: column; gap: 8px; }
.img-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--gold-light);
}
.img-row img {
  width: 44px;
  height: 44px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--gold-light);
}
.img-row .img-name { flex: 1; font-family: var(--font-mono); font-size: 0.55rem; color: var(--ink-light); word-break: break-all; }
.img-row button { margin: 0; padding: 4px 12px; font-size: 0.55rem; }
.mini-map {
  height: 220px;
  border: 1px solid var(--gold-light);
  border-radius: 10px;
  margin-top: 10px;
  z-index: 1;
}
.mini-map-hint {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  color: var(--ink-faded);
  margin-top: 6px;
}
.pick-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.pick-actions button { margin: 0; padding: 6px 14px; font-size: 0.58rem; }

/* ===== 主题栏 ===== */
.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 100000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg { width: 18px; height: 18px; stroke: var(--ink-faded); stroke-width: 1.2; fill: none; transition: stroke 0.25s; }
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active { background: var(--gold); box-shadow: 0 0 0 1.5px var(--gold); }
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line { width: 1.5px; height: 10px; background: var(--gold-light); border-radius: 1px; }
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

/* ===== 密码遮罩 ===== */
#password-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(44, 42, 40, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: opacity 0.5s;
}
#password-overlay.hidden { opacity: 0; pointer-events: none; }
#password-overlay .box {
  background: var(--paper);
  padding: 40px 44px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  border: 1px solid var(--gold-light);
}
#password-overlay .box h2 { font-family: var(--font-serif); font-weight: 300; font-size: 1.3rem; letter-spacing: 0.06em; margin-bottom: 6px; }
#password-overlay .box p { color: var(--ink-faded); font-size: 0.8rem; margin-bottom: 20px; }
#password-overlay .box input[type="password"] {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--gold-light);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  color: var(--ink);
  margin-bottom: 14px;
}
#password-overlay .box button { width: 100%; padding: 12px; border: none; background: var(--ink); color: var(--paper); font-family: var(--font-mono); font-size: 0.75rem; cursor: pointer; transition: background 0.25s; }
#password-overlay .box button:hover { background: var(--clay); }
#password-overlay .error-msg { color: var(--clay); font-family: var(--font-mono); font-size: 0.65rem; margin-top: 10px; min-height: 1.2em; }

@media (max-width: 640px) {
  .tab-bar button { padding: 10px 14px; font-size: 0.6rem; }
  .view-head { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="password-overlay">
  <div class="box">
    <h2>验证</h2>
    <p>请输入后台密码</p>
    <input type="password" id="password-input" placeholder="密码" autofocus>
    <button id="password-submit">确认</button>
    <div class="error-msg" id="password-error"></div>
  </div>
</div>

<div class="content-wrapper" style="display:none;">
  <div class="wrap">
    <h1>诗歌漂流 · 管理后台</h1>
    <div class="sub">私人使用，请勿分享链接</div>
    <div class="warn-box">⚠️ Token 具有修改仓库内容的权限，请妥善保管。</div>

    <div class="tab-bar" id="tab-bar">
      <button data-tab="settings" class="active">设置</button>
      <button data-tab="poems">诗歌</button>
      <button data-tab="authors">作者</button>
      <button data-tab="logs">漂流日志</button>
    </div>

    <!-- ===== 设置 ===== -->
    <div class="view active" id="view-settings">
      <div class="panel">
        <h2 style="font-family:var(--font-serif);font-weight:300;font-size:1.05rem;letter-spacing:0.04em;margin-bottom:14px;">仓库设置</h2>
        <label>用户名</label>
        <input type="text" id="gh-owner" value="zhege712-crypto">
        <label>仓库名</label>
        <input type="text" id="gh-repo" value="Poem_Ulysses">
        <label>Token</label>
        <input type="password" id="gh-token" placeholder="ghp_ 或 github_pat_ 开头">
        <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:0.75rem; color:var(--ink-light);">
          <input type="checkbox" id="remember" style="width:auto;"> 记住
        </label>
        <div class="status" id="settings-status"></div>
      </div>
    </div>

    <!-- ===== 诗歌 ===== -->
    <div class="view" id="view-poems">
      <div class="view-head" id="poems-list-head">
        <h2>诗歌列表</h2>
      </div>
      <div id="poem-list"><div class="hint">加载中…</div></div>
      <button class="btn-add" id="poem-new-btn" type="button">+ 发布新诗</button>
      <div class="status" id="poem-status"></div>

      <div id="poem-edit" class="edit-form" style="display:none;">
        <div class="view-head">
          <button class="back-btn" id="poem-edit-back" type="button">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> 返回
          </button>
          <h2 id="poem-edit-title">编辑诗</h2>
        </div>
        <div class="panel">
          <div class="form-title" id="pe-title-display">—</div>
          <div class="form-sub" id="pe-id-display"></div>
          <input type="hidden" id="pe-id">
          <label>标题</label>
          <input type="text" id="pe-title">
          <div class="row">
            <div>
              <label>日期</label>
              <div class="date-group">
                <input type="text" id="pe-date">
                <button type="button" class="btn-sm" data-target="pe-date" data-precision="year">年</button>
                <button type="button" class="btn-sm" data-target="pe-date" data-precision="month">月</button>
                <button type="button" class="btn-sm" data-target="pe-date" data-precision="day">日</button>
              </div>
            </div>
            <div><label>作者</label><input type="text" id="pe-author" list="author-id-list"></div>
          </div>
          <label>序列</label>
          <input type="text" id="pe-series" placeholder="例如：天一篇" list="series-list">
          <datalist id="series-list"></datalist>
          <label>子分类</label>
          <input type="text" id="pe-subseries" placeholder="例如：现代诗" list="subseries-list">
          <datalist id="subseries-list"></datalist>
          <label>正文</label>
          <textarea id="pe-content"></textarea>
          <label>配图</label>
          <div class="img-manage" id="pe-images"></div>
          <input type="file" id="pe-image" accept="image/*" multiple>
          <div class="row">
            <button id="pe-save" type="button">保存诗</button>
            <button id="pe-cancel" class="ghost" type="button">取消</button>
          </div>
          <div class="status" id="pe-status"></div>
        </div>
      </div>
    </div>

    <!-- ===== 作者 ===== -->
    <div class="view" id="view-authors">
      <div class="view-head">
        <h2>作者（同志们）</h2>
      </div>
      <div id="author-list"><div class="hint">加载中…</div></div>
      <button class="btn-add" id="author-new-btn" type="button">+ 新建作者</button>
      <div class="status" id="author-status"></div>

      <div id="author-edit" class="edit-form" style="display:none;">
        <div class="view-head">
          <button class="back-btn" id="author-edit-back" type="button">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> 返回
          </button>
          <h2 id="author-edit-title">编辑作者</h2>
        </div>
        <div class="panel">
          <label>署名 ID</label>
          <input type="text" id="ae-id" placeholder="英文短横线，如 hanmei">
          <label>展示名</label>
          <input type="text" id="ae-name" placeholder="如：寒梅">
          <label>别名（多个用顿号/逗号分隔）</label>
          <input type="text" id="ae-aliases" placeholder="如：寒梅、hanmei">
          <label>简介</label>
          <textarea id="ae-bio" placeholder="这位作者的一句话题记"></textarea>

function fileToBase64(f) { return new Promise(function(r, rej) { var reader = new FileReader(); reader.onload = function() { r(reader.result.split(',')[1]); }; reader.onerror = rej; reader.readAsDataURL(f); }); }
// WGS84 ↔ GCJ02（高德火星坐标）
function wgs84ToGcj02(lng, lat) {
  var a = 6378245.0, ee = 0.00669342162296594323;
  function outOfChina(l, t) { return l < 72.004 || l > 137.8347 || t < 0.8293 || t > 55.8271; }
  function tlat(x, y) {
    var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
    r += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
    return r;
  }
  function tlng(x, y) {
    var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
    r += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
    return r;
  }
  if (outOfChina(lng, lat)) return [lng, lat];
  var dLat = tlat(lng - 105.0, lat - 35.0);
  var dLng = tlng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * Math.PI;
  var magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lng + dLng, lat + dLat];
}
function gcj02ToWgs84(lng, lat) {
  var a = 6378245.0, ee = 0.00669342162296594323;
  function outOfChina(l, t) { return l < 72.004 || l > 137.8347 || t < 0.8293 || t > 55.8271; }
  function tlat(x, y) {
    var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
    r += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
    return r;
  }
  function tlng(x, y) {
    var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
    r += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
    return r;
  }
  if (outOfChina(lng, lat)) return [lng, lat];
  var dLat = tlat(lng - 105.0, lat - 35.0);
  var dLng = tlng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * Math.PI;
  var magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  var mgLat = lat + dLat, mgLng = lng + dLng;
  return [lng * 2 - mgLng, lat * 2 - mgLat];
}
function ghRequest(path, options) {
  return fetch('https://api.github.com/repos/' + els.owner.value.trim() + '/' + els.repo.value.trim() + '/contents/' + path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + els.token.value.trim(), 'Accept': 'application/vnd.github+json' }
  }, options));
}
function fetchWithTimeout(url, ms) {
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, ms || 8000);
  return fetch(url, { signal: ctrl.signal }).then(function(r) { clearTimeout(t); return r; }, function(e) { clearTimeout(t); throw e; });
}
function cacheBust() { return '?t=' + Date.now(); }
function haveCreds() { return els.owner.value.trim() && els.repo.value.trim() && els.token.value.trim(); }

// 读本地（回退 raw.githubusercontent）
async function readLocal(name) {
  var arr = [];
  try {
    var res = await fetchWithTimeout(name + cacheBust());
    if (res.ok) { arr = await res.json(); }
  } catch(e) {}
  if (!arr || !arr.length) {
    try {
      var raw = 'https://raw.githubusercontent.com/' + els.owner.value.trim() + '/' + els.repo.value.trim() + '/main/' + name + cacheBust();
      var res2 = await fetchWithTimeout(raw);
      if (res2.ok) { arr = await res2.json(); }
    } catch(e) {}
  }
  return arr || [];
}
// 从 GitHub API 读取并返回 {sha, data}（容错 BOM）
async function readFromGitHub(name) {
  var res = await ghRequest(name + cacheBust(), {});
  if (res.ok) {
    var d = await res.json();
    var raw = decodeURIComponent(escape(atob(d.content)));
    if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
    return { sha: d.sha, data: JSON.parse(raw) };
  }
  if (res.status === 404) return { sha: null, data: null };
  throw new Error('读取失败 ' + name);
}
// 写回 GitHub API
async function writeToGitHub(name, data, sha, message) {
  var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  var body = { message: message, content: b64 };
  if (sha) body.sha = sha;
  var res = await ghRequest(name, { method: 'PUT', body: JSON.stringify(body) });
  if (!res.ok) throw new Error('保存失败 ' + name);
  return res;
}

function pushNav(returnTab, scrollId) {

function goBack(elm) {
  if (elm && elm.closest) {

  if (from) showTab(from.tab);

var poemsCache = [];

async function loadPoemList() {
  var listEl = document.getElementById('poem-list');
  var poems = await readLocal('data/poems.json');
  poemsCache = poems;
  if (!poems.length) { listEl.innerHTML = '<div class="hint">还没有诗，点下方「发布新诗」。</div>'; return; }
  // 目录顺序（系列首次出现顺序 → 系列内日期降序，与目录/阅读页一致）
  var seriesOrder = [], seen = {};
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!seen[s]) { seen[s] = 1; seriesOrder.push(s); }
  });
  function getDateWeight(d) {
    if (!d || d.trim() === '') return -1;
    var parts = d.trim().split('-');
    var w = 0;
    if (parts[0]) w += 10000;
    if (parts[1]) w += 100;
    if (parts[2]) w += 1;
    return w;
  }
  poems.sort(function(a, b) {
    var sa = a.series || '未分类', sb = b.series || '未分类';
    var ia = seriesOrder.indexOf(sa), ib = seriesOrder.indexOf(sb);
    if (ia !== ib) return ia - ib;
    var wa = getDateWeight(a.date), wb = getDateWeight(b.date);
    if (wa !== wb) return wb - wa;
    return (a.date || '').localeCompare(b.date || '');
  });
  var groups = {}, order = [];
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!groups[s]) { groups[s] = []; order.push(s); }
    groups[s].push(p);
  });
  var html = '';
  order.forEach(function(series) {
    var list = groups[series];
    html += '<div class="group-head" data-series="' + escapeHtml(series) + '"><span class="tri">▾</span>' + escapeHtml(series) + '<span class="g-count">' + list.length + '</span></div>';
    html += '<div class="group-body">';
    list.forEach(function(p) {
      html +=
        '<div class="manage-item" id="poem-' + p.id + '">' +
          '<div class="mi-info">' + escapeHtml(p.title) +
            '<span class="mi-date">' + escapeHtml(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + (p.subseries ? ' <span class="mi-tag">' + escapeHtml(p.subseries) + '</span>' : '') + '</span>' +
          '</div>' +
          '<div class="mi-actions">' +
            '<button class="mi-edit-poem" data-id="' + p.id + '">编辑</button>' +
            '<button class="mi-del-poem danger" data-id="' + p.id + '">删除</button>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
  });
  listEl.innerHTML = html;

  // 系列折叠
  listEl.querySelectorAll('.group-head').forEach(function(head) {
    head.addEventListener('click', function() {
      head.classList.toggle('collapsed');
      var body = head.nextElementSibling;
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
    });
  });
  // 编辑 / 删除
  listEl.querySelectorAll('.mi-edit-poem').forEach(function(b) {
    b.addEventListener('click', function() {
      var p = poems.find(function(x) { return x.id === this.dataset.id; }.bind(this));
      openPoemEdit(p, 'poems');
    });
  });
  listEl.querySelectorAll('.mi-del-poem').forEach(function(b) {
    b.addEventListener('click', function() {
      var p = poems.find(function(x) { return x.id === this.dataset.id; }.bind(this));
      deletePoem(p);
    });
  });

  // datalist
  document.getElementById('series-list').innerHTML = order.map(function(s) { return '<option value="' + escapeHtml(s) + '">'; }).join('');
  var subSet = Array.from(new Set(poems.map(function(p) { return p.subseries || ''; }).filter(Boolean)));
  document.getElementById('subseries-list').innerHTML = subSet.map(function(s) { return '<option value="' + escapeHtml(s) + '">'; }).join('');
  document.getElementById('poem-id-list').innerHTML = poems.map(function(p) { return '<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.title) + '</option>'; }).join('');
}

document.getElementById('pe-save').addEventListener('click', async function() {
  var st = document.getElementById('pe-status');
  if (!haveCreds()) { setStatus(st, '请先在「设置」填写仓库信息', 'err'); return; }
  var title = document.getElementById('pe-title').value.trim();
  var date = document.getElementById('pe-date').value.trim();
  var content = document.getElementById('pe-content').value.trim();
  if (!title || !content) { setStatus(st, '标题和正文不能为空', 'err'); return; }
  if (!date) { setStatus(st, '请填写日期', 'err'); return; }
  setStatus(st, '保存中…', 'loading');
  try {
    var id = document.getElementById('pe-id').value;
    var { sha, data } = await readFromGitHub('data/poems.json');
    data = data || [];
    var poem;
    if (id) {
      poem = data.find(function(x) { return x.id === id; });
      if (!poem) throw new Error('未找到原诗');
    } else {
      id = String(Date.now());
      poem = { id: id, images: [] };
      data.push(poem);
    }
    poem.title = title;
    poem.date = date;
    poem.author = document.getElementById('pe-author').value.trim() || '匿名';
    poem.series = document.getElementById('pe-series').value.trim() || '未分类';
    var sub = document.getElementById('pe-subseries').value.trim();
    if (sub) poem.subseries = sub; else delete poem.subseries;
    poem.content = content;

    // 上传新增图片
    var files = Array.from(document.getElementById('pe-image').files || []);
    for (var i = 0; i < files.length; i++) {
      setStatus(st, '上传图片 ' + (i + 1) + '/' + files.length, 'loading');
      var b64 = await fileToBase64(files[i]);
      var name = Date.now() + '-' + i + '-' + files[i].name.replace(/[^a-zA-Z0-9.\-_]/g, '');
      var path = 'images/' + name;
      var r = await ghRequest(path, { method: 'PUT', body: JSON.stringify({ message: '配图', content: b64 }) });
      if (!r.ok) throw new Error('图片上传失败');
      poem.images.push(path);
    }
    // 保留面板中未移除的旧图
    var kept = Array.from(document.querySelectorAll('#pe-images .img-row .img-name')).map(function(n) { return n.textContent; });
    poem.images = kept;

    await writeToGitHub('data/poems.json', data, sha, (id ? '修改: ' : '发布: ') + title);
    setStatus(st, '✓ 已保存', 'ok');
    goBack();
  } catch(e) { setStatus(st, '✗ ' + e.message, 'err'); }
});

async function deletePoem(p) {
  if (!confirm('确定删除「' + p.title + '」吗？')) return;
  if (!haveCreds()) { setPoemStatus('请先在「设置」填写仓库信息', 'err'); return; }
  setPoemStatus('删除中…', 'loading');
  try {
    var { sha, data } = await readFromGitHub('data/poems.json');
    var target = data.find(function(x) { return x.id === p.id; });
    data = data.filter(function(x) { return x.id !== p.id; });
    await writeToGitHub('data/poems.json', data, sha, '删除: ' + p.title);
    if (target && target.images) {
      for (var i = 0; i < target.images.length; i++) {
        try {
          var imgGet = await ghRequest(target.images[i], {});
          if (imgGet.ok) {
            var imgD = await imgGet.json();
            await ghRequest(target.images[i], { method: 'DELETE', body: JSON.stringify({ message: '删图', sha: imgD.sha }) });
          }
        } catch(e) {}
      }
    }
    setPoemStatus('✓ 已删除', 'ok');
    loadPoemList();
  } catch(e) { setPoemStatus('✗ ' + e.message, 'err'); }
}

    });
  });

    b.addEventListener('click', function() {
      var lg = logs.find(function(x) { return x.id === this.dataset.id; }.bind(this));
      deleteLog(lg);
    });
  });
  listEl.querySelectorAll('.mi-up').forEach(function(b) {
    b.addEventListener('click', function() { moveLog(this.dataset.id, -1); });
  });
  listEl.querySelectorAll('.mi-down').forEach(function(b) {
    b.addEventListener('click', function() { moveLog(this.dataset.id, 1); });
  });
  listEl.querySelectorAll('.mi-toggle-link').forEach(function(b) {
    b.addEventListener('click', function() {
      var lg = logs.find(function(x) { return x.id === this.dataset.id; }.bind(this));

    });

      // 在此日志之后插入一个新日志
      insertLogAfter(this.dataset.id);
    });
  });
}

// 在此日志之后插入新日志
async function insertLogAfter(id) {
  var idx = logsCache.findIndex(function(x) { return x.id === id; });
  if (idx < 0) return;
  if (!haveCreds()) { setLogStatus('请先在「设置」填写仓库信息', 'err'); return; }
  // 新建空日志，插入 logsCache
  var lg = { id: 'log-' + String(Date.now()), place: '新地点', link: true };
  logsCache.splice(idx + 1, 0, lg);
  await saveLogOrder('插入行迹点');
  // 编辑刚插入的
  openLogEdit(lg);
}

// 调整行迹顺序：上移/下移后保存 logs.json
async function moveLog(id, dir) {
  var idx = logsCache.findIndex(function(x) { return x.id === id; });
  var j = idx + dir;
  if (idx < 0 || j < 0 || j >= logsCache.length) return;
  var tmp = logsCache[idx];
  logsCache[idx] = logsCache[j];
  logsCache[j] = tmp;
  await saveLogOrder('调整行迹顺序');
}

async function saveLogOrder(message) {
  if (!haveCreds()) { setLogStatus('请先在「设置」填写仓库信息', 'err'); return; }
  setLogStatus('保存中…', 'loading');
  try {
    var { sha, data } = await readFromGitHub('data/logs.json');
    // 以当前 logsCache 顺序为准重排
    var byId = {};
    data.forEach(function(x) { byId[x.id] = x; });
    var reordered = logsCache.map(function(x) { return byId[x.id] || x; });
    // 写入 link 状态
    logsCache.forEach(function(x) { if (byId[x.id]) byId[x.id].link = x.link; });
    await writeToGitHub('data/logs.json', reordered, sha, message || '保存');
    setLogStatus('✓ 已保存', 'ok');
    loadLogList();
  } catch(e) { setLogStatus('✗ ' + e.message, 'err'); }
}

function initMiniMap(lg) {
  var mapEl = document.getElementById('le-map');
  if (logMap) { logMap.destroy(); logMap = null; logMarker = null; }
  var hasCoord = lg && lg.lat != null && lg.lng != null;
  var center = hasCoord ? wgs84ToGcj02(lg.lng, lg.lat) : [104.5, 35.5];
  logMap = new AMap.Map(mapEl, {
    zoom: hasCoord ? 10 : 4,
    center: center,
    viewMode: '2D',
    resizeEnable: true
  });
  if (hasCoord) {
    logMarker = new AMap.Marker({
      position: center,
      content: '<div style="width:12px;height:12px;border-radius:50%;background:#D4B896;border:2px solid #fff;box-shadow:0 0 0 1.5px #D4B896;"></div>',
      offset: new AMap.Pixel(-6, -6)
    });
    logMap.add(logMarker);
  }
  logMap.on('click', function(e) {
    if (logMarker) { logMap.remove(logMarker); logMarker = null; }
    var gcj = [e.lnglat.getLng(), e.lnglat.getLat()];
    var wgs = gcj02ToWgs84(gcj[0], gcj[1]);
    logMarker = new AMap.Marker({
      position: gcj,
      content: '<div style="width:12px;height:12px;border-radius:50%;background:#D4B896;border:2px solid #fff;box-shadow:0 0 0 1.5px #D4B896;"></div>',
      offset: new AMap.Pixel(-6, -6)
    });
    logMap.add(logMarker);
    document.getElementById('le-lat').value = wgs[1].toFixed(5);
    document.getElementById('le-lng').value = wgs[0].toFixed(5);
  });
  document.getElementById('le-map-jump').addEventListener('click', function() {
    var lat = parseFloat(document.getElementById('le-lat').value);
    var lng = parseFloat(document.getElementById('le-lng').value);
    if (!isNaN(lat) && !isNaN(lng)) {
      var g = wgs84ToGcj02(lng, lat);
      logMap.setZoomAndCenter(10, g);
    } else {
      logMap.setZoomAndCenter(4, [104.5, 35.5]);
    }
  });
}

    entry.poemId = document.getElementById('le-poemid').value.trim() || undefined;
    entry.authorId = document.getElementById('le-authorid').value.trim() || undefined;
    entry.link = document.getElementById('le-link').checked;
    // 清理空字段
    ['date','text','poemId','authorId'].forEach(function(k) { if (!entry[k]) delete entry[k]; });
    if (entry.link === true) delete entry.link;
    await writeToGitHub('data/logs.json', data, sha, '保存漂流地点: ' + place);
    setStatus(st, '✓ 已保存', 'ok');
    currentEditingLogId = null;
    goBack();
  } catch(e) { setStatus(st, '✗ ' + e.message, 'err'); }
});

async function deleteLog(lg) {
  if (!confirm('确定删除漂流日志「' + lg.place + '」吗？')) return;
  if (!haveCreds()) { setLogStatus('请先在「设置」填写仓库信息', 'err'); return; }
  setLogStatus('删除中…', 'loading');
  try {
    var { sha, data } = await readFromGitHub('data/logs.json');
    data = data.filter(function(x) { return x.id !== lg.id; });
    await writeToGitHub('data/logs.json', data, sha, '删除漂流地点: ' + lg.place);
    setLogStatus('✓ 已删除', 'ok');
    loadLogList();
  } catch(e) { setLogStatus('✗ ' + e.message, 'err'); }
}

// ===== 初始化 =====
var currentEditingLogId = null;
function init() {
  var saved = localStorage.getItem('gh_creds');
  if (saved) {
    try {
      var c = JSON.parse(saved);
      els.owner.value = c.owner || '';
      els.repo.value = c.repo || '';
      els.token.value = c.token || '';
      els.remember.checked = true;
    } catch(e) {}
  }
  var now = new Date();
  var y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
  document.getElementById('pe-date').value = y + '-' + m + '-' + d;
  // 记住 credentials
  els.token.addEventListener('change', function() {
    if (els.remember.checked) localStorage.setItem('gh_creds', JSON.stringify({ owner: els.owner.value.trim(), repo: els.repo.value.trim(), token: els.token.value.trim() }));
    else localStorage.removeItem('gh_creds');
  });
  loadPoemList();
  loadAuthorList();
  loadLogList();
}
// 若已登录则直接初始化
if (sessionStorage.getItem('admin_auth') === 'true') {
  init();
}
</script>
