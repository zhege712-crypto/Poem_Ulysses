<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同志们 · 诗歌漂流</title>
<meta name="description" content="把名字题在舟上 —— 诗歌漂流的作者们">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-kai: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --radius-md: 12px;
  --radius-pill: 999px;
  --maxw: 960px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.8;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ===== 导航 ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 22px 0;
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }
nav ul {
  list-style: none;
  display: flex;
  gap: 28px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  position: relative;
  padding-bottom: 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
nav a.active { color: var(--ink); }
nav a.active::after { width: 100%; }
@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

/* ===== 侧边主题切换 ===== */
.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-faded);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--gold);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

/* ===== 返回 ===== */
.back-link {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--ink);
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
  padding: 9px 20px;
  border: 1px solid var(--gold);
  border-radius: var(--radius-pill);
  background: var(--paper);
}
.back-link svg {
  width: 15px;
  height: 15px;
  stroke: var(--gold);
}
.back-link:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.back-link:hover svg { stroke: var(--gold); }

/* ===== 页面头部 ===== */
.page-head {
  padding: 56px 0 24px;
}
.page-head h1 {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.9rem, 5vw, 3rem);
  letter-spacing: 0.1em;
  text-wrap: balance;
}
.page-head h1 em {
  font-style: italic;
  color: var(--gold);
}
.page-head .line {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin-top: 14px;
}
.page-head p {
  margin-top: 16px;
  max-width: 480px;
  color: var(--ink-light);
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1rem;
}

/* ===== 卡片墙 ===== */
.authors-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
  padding: 16px 0 80px;
}
.author-card {
  position: relative;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  padding: 22px 20px;
  background: var(--paper);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-md);
  transition: background 0.3s, border-color 0.3s, transform 0.3s;
  overflow: hidden;
}
.author-card::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 1px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.author-card:hover {
  background: var(--paper-dark);
  border-color: var(--gold);
  transform: translateY(-2px);
}
.author-card:hover::after { transform: scaleX(1); }
.author-card:focus-visible {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 184, 150, 0.25);
}
.ac-stamp {
  flex-shrink: 0;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.9rem;
  color: var(--clay);
  border: 1px solid var(--gold);
  border-radius: 10px;
  line-height: 1;
  user-select: none;
  transition: color 0.3s, background 0.3s;
}
.author-card:hover .ac-stamp { color: var(--paper); background: var(--clay); border-color: var(--clay); }
.ac-body { min-width: 0; }
.ac-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: 0.03em;
  color: var(--ink);
  transition: color 0.3s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.author-card:hover .ac-name { color: var(--clay); }
.ac-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
  min-height: 22px;
}
.ac-tag {
  font-family: var(--font-mono);
  font-size: 0.52rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 2px 10px;
}
.ac-tag.ph {
  color: var(--ink-faded);
  border-style: dashed;
  border-color: var(--gold-light);
}
.ac-meta {
  display: flex;
  gap: 14px;
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-faded);
  text-transform: uppercase;
}
.ac-meta .num { color: var(--ink-light); font-weight: 400; }
.ac-link {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
}
.ac-arrow {
  margin-left: auto;
  align-self: center;
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--ink-faded);
  transition: color 0.3s, transform 0.3s;
}
.author-card:hover .ac-arrow { color: var(--gold); transform: translateX(3px); }

/* ===== 待题名 ===== */
.pending-section {
  padding: 0 0 70px;
}
.pending-section h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.06em;
  color: var(--ink-light);
  margin-bottom: 16px;
}
.pending-note {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 0.95rem;
  color: var(--ink-faded);
  margin-bottom: 14px;
}
.pending-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.pending-item {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--ink-faded);
  border: 1px dashed var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 6px 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.pending-item .cnt { color: var(--clay); }

/* ===== 入场渐显 ===== */
.reveal-up {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal-up.in-view {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal-up {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

/* ===== 空态 ===== */
.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 300;
  padding: 80px 0;
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }
.footer-stats {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 22px;
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  color: var(--ink-faded);
  opacity: 0.8;
}
.footer-stats .bsz-num { color: var(--gold); }

@media (max-width: 640px) {
  .authors-grid { grid-template-columns: 1fr; }
  .ac-arrow { display: none; }
}
</style>
</head>
<body>

<!-- ===== 导航 ===== -->
<header>
  <div class="wrap">
    <a class="logo" href="index.html">诗歌<span>漂流</span></a>
    <nav>
      <ul>
        <li><a href="index.html">首页</a></li>
        <li><a href="directory.html">目录</a></li>
        <li><a href="authors.html" class="active">同志们</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank" rel="noopener noreferrer">投稿</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- ===== 主题切换 ===== -->
<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<!-- ===== 页面内容 ===== -->
<div class="wrap">
  <a class="back-link" href="index.html" id="back-link">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.2"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="back-label">返回</span>
  </a>
  <section class="page-head">
    <h1>同志们<em>。</em></h1>
    <div class="line"></div>
    <p>把名字题在舟上 —— 诗行背后的手，每一双都值得被认得。</p>
  </section>

  <section id="authors-section">
    <div id="authors-grid" class="authors-grid"><div class="empty-state">加载中…</div></div>
  </section>

  <section class="pending-section" id="pending-section" hidden>
    <h2>待题名</h2>
    <p class="pending-note">这些名字出现在诗页上，却还没有一枚自己的印章。</p>
    <div class="pending-list" id="pending-list"></div>
  </section>
</div>

<footer>
  <p>诗歌漂流 · Poem's Ulysses</p>
  <p class="footer-stats">
    <span>浏览人次 <span class="bsz-num" id="busuanzi_value_site_pv">—</span></span>
    <span>访客数 <span class="bsz-num" id="busuanzi_value_site_uv">—</span></span>
  </p>
</footer>

<script>
(function() {
  // ============================================================
  // 返回按钮（浏览器后退式，无历史回首页）
  // ============================================================
  (function() {
    var back = document.getElementById('back-link');
    if (!back) return;
    back.addEventListener('click', function(e) {
      if (history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
    var ref = document.referrer || '';
    var label = document.getElementById('back-label');
    if (ref.indexOf('author.html') !== -1) {
      label.textContent = '返回';
    } else if (ref.indexOf('index.html') !== -1) {
      label.textContent = '返回首页';
    }
  })();

  // ============================================================
  // 数据加载
  // ============================================================
  var AUTHORS_URL = 'data/authors.json?t=' + Date.now();
  var POEMS_URL = 'data/poems.json?t=' + Date.now();

  Promise.all([
    fetch(AUTHORS_URL).then(function(r) { return r.ok ? r.json() : []; }),
    fetch(POEMS_URL).then(function(r) { return r.ok ? r.json() : []; })
  ]).then(function(res) {
    renderAuthors(res[0], res[1]);
  }).catch(function() {
    document.getElementById('authors-grid').innerHTML = '<div class="empty-state">未能加载，请稍后再试</div>';
  });

  function byPoems(a, b) { return b.count - a.count; }

  function renderAuthors(authors, poems) {
    var grid = document.getElementById('authors-grid');
    var pendingSection = document.getElementById('pending-section');
    var pendingList = document.getElementById('pending-list');

    // 归一化：别名 → 作者 id（name 也参与匹配，保证无别名作者也能聚合作品）
    var aliasMap = {};
    authors.forEach(function(a) {
      (a.aliases || []).forEach(function(al) { aliasMap[al] = a.id; });
      if (a.name) aliasMap[a.name] = a.id;
    });

    // 统计每个作者的作品
    var stats = {};
    var seenNames = {};
    var orphans = {};
    poems.forEach(function(p) {
      var name = p.author || '未知';
      var id = aliasMap[name];
      if (!id) { id = 'orphan_' + name; }
      if (!stats[id]) stats[id] = { count: 0, series: {}, dates: [] };
      stats[id].count++;
      stats[id].series[p.series || '未分卷'] = true;
      if (p.date && p.date !== '暂定') stats[id].dates.push(p.date);
    });

    // 已收录作者
    var list = authors.map(function(a) {
      var s = stats[a.id] || { count: 0, series: {}, dates: [] };
      return {
        id: a.id,
        name: a.name,
        tags: a.tags || [],
        count: s.count,
        series: Object.keys(s.series).length,
        first: s.dates.length ? s.dates.slice().sort()[0] : null,
        last: s.dates.length ? s.dates.slice().sort().pop() : null,
        inPoems: true
      };
    }).sort(byPoems);

    // 未收录作者（诗里有但 authors.json 没有）
    var orphansArr = [];
    Object.keys(stats).forEach(function(id) {
      if (id.indexOf('orphan_') === 0 && !orphans[id]) {
        orphans[id] = true;
        orphansArr.push({ name: id.slice(7), count: stats[id].count });
      }
    });
    orphansArr.sort(function(a, b) { return b.count - a.count; });

    if (list.length === 0 && orphansArr.length === 0) {
      grid.innerHTML = '<div class="empty-state">还没有题名的同志</div>';
      return;
    }

    grid.innerHTML = '';
    list.forEach(function(a, i) {
      var card = document.createElement('a');
      card.className = 'author-card reveal-up';
      card.href = 'author.html?id=' + encodeURIComponent(a.id);
      card.style.transitionDelay = Math.min(i * 50, 300) + 'ms';
      card.setAttribute('aria-label', a.name + '，作品 ' + a.count + ' 首');

      var stampChar = a.name.charAt(0);
      var tagsHtml = '';
      if (a.tags.length) {
        tagsHtml = a.tags.map(function(t) {
          return '<span class="ac-tag">' + esc(t) + '</span>';
        }).join('');
      } else {
        tagsHtml = '<span class="ac-tag ph">待题记</span>';
      }

      var metaHtml = '<span>作品 <span class="num">' + a.count + '</span></span>';
      metaHtml += '<span>卷 <span class="num">' + a.series + '</span></span>';

      card.innerHTML =
        '<div class="ac-stamp" aria-hidden="true">' + esc(stampChar) + '</div>' +
        '<div class="ac-body">' +
          '<div class="ac-name">' + esc(a.name) + '</div>' +
          '<div class="ac-tags">' + tagsHtml + '</div>' +
          '<div class="ac-meta">' + metaHtml + '</div>' +
        '</div>' +
        '<span class="ac-arrow" aria-hidden="true">&rarr;</span>';
      grid.appendChild(card);
    });

    if (orphansArr.length) {
      pendingSection.hidden = false;
      pendingList.innerHTML = orphansArr.map(function(o) {
        return '<span class="pending-item">' + esc(o.name) + '<span class="cnt">' + o.count + '</span></span>';
      }).join('');
    }

    setupReveal();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ============================================================
  // 入场渐显
  // ============================================================
  function setupReveal() {
    var items = document.querySelectorAll('.reveal-up');
    if (!('IntersectionObserver' in window)) {
      items.forEach(function(el) { el.classList.add('in-view'); });
      return;
    }
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    items.forEach(function(el) { io.observe(el); });
  }

  // ============================================================
  // 主题切换
  // ============================================================
  (function() {
    var btns = document.querySelectorAll('#theme-side .theme-btn');
    if (!btns.length) return;

    function isNightTime() {
      var hour = new Date().getHours();
      return (hour >= 19 || hour < 6);
    }
    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      localStorage.setItem('theme', theme);
      btns.forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
      });
    }
    var saved = localStorage.getItem('theme');
    var initial;
    if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
      initial = saved;
    } else {
      initial = isNightTime() ? 'dark' : 'light';
    }
    applyTheme(initial);

    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        applyTheme(this.getAttribute('data-theme'));
      });
    });

    var style = document.createElement('style');
    style.textContent = `
      [data-theme="dark"] {
        --paper: #1E1E1C;
        --paper-dark: #2A2A27;
        --ink: #ECECE5;
        --ink-light: #C4C4BE;
        --ink-faded: #8A8A85;
        --gold: #D4A373;
        --gold-light: #4A4A45;
        --clay: #E55A5F;
      }
      [data-theme="eye-care"] {
        --paper: #ECF3E5;
        --paper-dark: #DEE8D4;
        --ink: #3A4632;
        --ink-light: #5C6A4F;
        --ink-faded: #82906F;
        --gold: #BDA26C;
        --gold-light: #C6D3B4;
        --clay: #B2674F;
      }
      [data-theme="dark"] .side-theme,
      [data-theme="eye-care"] .side-theme {
        background: rgba(30, 30, 28, 0.7);
        border-color: var(--gold-light);
      }
    `;
    document.head.appendChild(style);
  })();
})();
</script>
