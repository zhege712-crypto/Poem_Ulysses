<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌漂流 · 收集诗意的角落</title>
<meta name="description" content="诗歌漂流 — 一个收集诗意的角落，欢迎你来读诗、投稿。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f0;
  --paper-2:#f0ebe0;
  --white:#ffffff;
  --ink:#2c2c2a;
  --charcoal:#4a4842;
  --steel:#8a867a;
  --fog:#d5cec0;
  --accent-gold:#c79a6e;
  --accent-red:#b86b4a;
  --accent-cobalt:#5f7f92;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-serif:'Noto Serif SC','Kaiti SC','STKaiti','KaiTi',serif;
  --font-mono:'Space Mono',monospace;
  --maxw:820px;
}
[data-theme="dark"] {
  --paper: #1e1e1c;
  --paper-2: #2a2a27;
  --white: #2a2a27;
  --ink: #ecece5;
  --charcoal: #c4c4be;
  --steel: #8a8a85;
  --fog: #4a4a45;
  --accent-gold: #d4a373;
  --accent-red: #e55a5f;
}
[data-theme="eye-care"] {
  --paper: #ecf3e5;
  --paper-2: #dee8d4;
  --white: #f4f8ee;
  --ink: #3a4632;
  --charcoal: #5c6a4f;
  --steel: #82906f;
  --fog: #c6d3b4;
  --accent-gold: #bda26c;
  --accent-red: #b2674f;
  --accent-cobalt: #5f7f92;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  transition:background 0.3s ease, color 0.3s ease;
}
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }

/* ===== 顶部导航 ===== */
header{
  padding:26px 0 18px;
  border-bottom:1px solid var(--paper-2);
  background:var(--paper);
  position:sticky;
  top:0;
  z-index:50;
  transition:background 0.3s ease, border-color 0.3s ease;
}
header .wrap{
  max-width:960px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}
.logo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.15rem;
  letter-spacing:0.02em;
}
.logo span{ color:var(--accent-gold); }
nav ul{
  list-style:none;
  display:flex;
  gap:24px;
  align-items:center;
}
nav a{
  font-family:var(--font-mono);
  font-size:0.7rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--charcoal);
  transition:color 0.25s;
  position:relative;
  padding-bottom:2px;
}
nav a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1.5px;
  background:var(--accent-gold);
  transition:width 0.3s;
}
nav a:hover{ color:var(--accent-red); }
nav a:hover::after{ width:100%; }
nav a.active{ color:var(--accent-red); }
nav a.active::after{ width:100%; }
@media(max-width:600px){
  header .wrap{ flex-direction:column; align-items:flex-start; gap:6px; }
  nav ul{ gap:16px; flex-wrap:wrap; }
}

/* ===== 主题切换 ===== */
.side-theme{
  position:fixed;
  right:28px;
  bottom:100px;
  z-index:150;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 24px rgba(28,28,27,0.08), inset 0 1px 0 rgba(255,255,255,0.35);
  padding:10px 8px;
  border-radius:28px;
  border:1px solid var(--fog);
  transition:background 0.3s, border-color 0.3s;
}
.side-theme .theme-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:transparent;
  cursor:pointer;
  transition:background 0.25s, transform 0.2s, box-shadow 0.25s;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.side-theme .theme-btn svg{
  width:22px;
  height:22px;
  stroke:var(--charcoal);
  stroke-width:1.8;
  fill:none;
  display:block;
  transition:stroke 0.25s;
}
.side-theme .theme-btn:hover{ background:var(--paper-2); transform:scale(1.08); }
.side-theme .theme-btn.active{
  background:var(--accent-gold);
  box-shadow:0 0 0 2px var(--accent-gold);
}
.side-theme .theme-btn.active svg{ stroke:var(--white); }
.side-theme .line{
  width:2px;
  height:10px;
  background:var(--fog);
  border-radius:1px;
  transition:background 0.3s;
}
@media(max-width:820px){ .side-theme{ right:16px; bottom:80px; } }

/* ===== 首页内容 ===== */
.hero{
  padding:70px 0 40px;
}
.hero-eyebrow{
  font-family:var(--font-mono);
  font-size:0.7rem;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--steel);
  margin-bottom:14px;
}
.hero h1{
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(2.4rem,6vw,4.2rem);
  line-height:1.1;
  letter-spacing:-0.01em;
}
.hero h1 em{
  font-style:italic;
  font-weight:300;
  color:var(--accent-gold);
}
.hero-desc{
  margin-top:20px;
  max-width:480px;
  color:var(--charcoal);
  font-size:1.02rem;
  font-family:var(--font-serif);
}
.hero-divider{
  width:110px;
  height:11px;
  color:var(--fog);
  margin:26px 0 10px;
  display:block;
}
.stats{
  display:flex;
  gap:32px;
  margin:30px 0 36px;
  flex-wrap:wrap;
}
.stats .num{
  font-family:var(--font-display);
  font-weight:600;
  font-size:2rem;
  color:var(--ink);
  display:block;
  line-height:1.1;
}
.stats .label{
  font-family:var(--font-mono);
  font-size:0.65rem;
  color:var(--steel);
  letter-spacing:0.05em;
  text-transform:uppercase;
}
.actions{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.btn{
  font-family:var(--font-mono);
  font-size:0.78rem;
  letter-spacing:0.05em;
  padding:14px 28px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:background 0.3s, color 0.3s, border-color 0.3s;
  border-radius:4px;
}
.btn-primary{
  background:var(--ink);
  color:var(--paper);
  border:1px solid var(--ink);
}
.btn-primary:hover{ background:var(--accent-red); border-color:var(--accent-red); }
.btn-outline{
  border:1px solid var(--fog);
  color:var(--charcoal);
  background:transparent;
}
.btn-outline:hover{
  background:var(--charcoal);
  color:var(--paper);
  border-color:var(--charcoal);
}
.btn-gold{
  border:1px solid var(--accent-gold);
  color:var(--ink);
  background:rgba(199,154,110,0.12);
}
.btn-gold:hover{
  background:var(--accent-gold);
  color:var(--paper);
}

/* ===== 最近诗作 ===== */
.recent-section{
  padding:30px 0 80px;
}
.recent-section h2{
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.4rem;
  margin-bottom:20px;
  color:var(--charcoal);
}
.recent-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:16px;
  padding:18px 0;
  border-bottom:1px solid var(--paper-2);
  align-items:baseline;
  transition:padding-left 0.3s;
}
.recent-item:hover{ padding-left:10px; }
.recent-item .ri-title{
  font-family:var(--font-serif);
  font-size:1.05rem;
  color:var(--ink);
}
.recent-item .ri-title:hover{ color:var(--accent-red); }
.recent-item .ri-meta{
  font-family:var(--font-mono);
  font-size:0.65rem;
  color:var(--steel);
  white-space:nowrap;
}
.empty-state{
  text-align:center;
  color:var(--steel);
  font-family:var(--font-mono);
  font-size:0.85rem;
  padding:60px 0;
}
.submit-note{
  background:var(--white);
  border:1px solid var(--paper-2);
  padding:24px 28px;
  margin:40px 0 60px;
  font-size:0.9rem;
  color:var(--charcoal);
  line-height:1.8;
}
.submit-note b{ color:var(--ink); }
.submit-note a{ color:var(--accent-gold); text-decoration:underline; }

footer{
  padding:30px 0;
  text-align:center;
  font-family:var(--font-mono);
  font-size:0.68rem;
  color:var(--steel);
  background:var(--ink);
  color:var(--paper-2);
}
footer a{ color:var(--accent-gold); }
.greek-divider{
  width:100px;
  height:10px;
  color:var(--fog);
  margin:16px 0 6px;
  display:block;
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">📖 诗歌<span>漂流</span></div>
    <nav>
      <ul>
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="directory.html">目录</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank">鎶曠ǹ</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <div class="hero-eyebrow">Poem's Odyssey</div>
    <h1>诗歌<span style="color:var(--accent-gold);">漂</span>流</h1>
    <svg class="hero-divider" viewBox="0 0 110 11" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M0 5.5 H9 V0 H18 V11 H27 V0 H36 V11 H45 V0 H54 V11 H63 V0 H72 V11 H81 V0 H90 V11 H99 V0 H110"/>
    </svg>
    <p class="hero-desc">让每一首诗，都像漂流瓶一样，抵达它该去的地方。</p>
    <div class="stats">
      <div><span class="num" id="stat-count">—</span><span class="label">已收录</span></div>
      <div><span class="num" id="stat-latest">—</span><span class="label">最近更新</span></div>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="directory.html">浏览目录 →</a>
      <a class="btn btn-gold" id="random-btn" href="#" style="cursor:pointer;">🎲 随机一首</a>
      <a class="btn btn-outline" href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank">鉁夛笍 鎶曠ǹ</a>
    </div>
  </section>

  <section class="recent-section">
    <h2>最近的诗</h2>
    <div id="recent-list"><div class="empty-state">加载中…</div></div>
  </section>

  <div class="submit-note">
    <b>📮 投稿说明：</b>点击“投稿”会跳转到 GitHub Discussions，用你的 GitHub 账号登录后发帖即可。
    请按格式填写：标题、正文，图片可直接拖入。审核通过后会被收录到目录中。
  </div>
</div>

<footer>
  © 2026 诗歌漂流 · 由 <a href="https://github.com/zhege712-crypto" target="_blank">@zhege712-crypto</a> 维护
</footer>

<!-- ===== 主题切换 ===== -->
<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 2a10 10 0 0 1 0 20 10 10 0 0 1 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 4a8 8 0 0 0 0 16 8 8 0 0 0 0-16z" fill="var(--charcoal)" opacity="0.2"/><path d="M12 6a6 6 0 0 1 0 12 6 6 0 0 1 0-12z" fill="var(--charcoal)" opacity="0.4"/><path d="M12 8a4 4 0 0 0 0 8 4 4 0 0 0 0-8z" fill="var(--charcoal)" opacity="0.6"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 9c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z" fill="var(--charcoal)" opacity="0.3"/><path d="M12 10.5c-.8 0-1.5.7-1.5 1.5s.7 1.5 1.5 1.5 1.5-.7 1.5-1.5-.7-1.5-1.5-1.5z" fill="var(--charcoal)" opacity="0.5"/></svg>
  </button>
</div>

<script>
// ===== 工具函数 =====
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function getDateWeight(dateStr) {
  if (!dateStr || dateStr.trim() === '') return -1;
  var parts = dateStr.trim().split('-');
  var weight = 0;
  if (parts[0]) weight += 10000;
  if (parts[1]) weight += 100;
  if (parts[2]) weight += 1;
  return weight;
}
function sortByDate(a, b) {
  var wA = getDateWeight(a.date);
  var wB = getDateWeight(b.date);
  if (wA !== wB) return wB - wA;
  return (a.date || '').localeCompare(b.date || '');
}
function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

// ===== 统计 =====
fetch('data/poems.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(poems){
    var count = document.getElementById('stat-count');
    var latest = document.getElementById('stat-latest');
    count.textContent = poems.length;
    if(poems.length){
      var sorted = poems.slice().sort(sortByDate);
      latest.textContent = formatPoemDate(sorted[0].date);
    } else {
      latest.textContent = '—';
    }
    // 最近诗作
    var list = document.getElementById('recent-list');
    if(!poems.length){
      list.innerHTML = '<div class="empty-state">还没有诗，等待第一首漂流而来。</div>';
      return;
    }
    var recent = poems.slice().sort(sortByDate).slice(0,6);
    list.innerHTML = recent.map(function(p){
      return '<a class="recent-item" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
        '<span class="ri-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="ri-meta">' + formatPoemDate(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
      '</a>';
    }).join('');
  })
  .catch(function(){
    document.getElementById('recent-list').innerHTML = '<div class="empty-state">加载失败，请检查 data/poems.json 是否存在。</div>';
    document.getElementById('stat-count').textContent = '0';
  });

// ===== 随机阅读 =====
document.getElementById('random-btn').addEventListener('click', function(e){
  e.preventDefault();
  fetch('data/poems.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(poems){
      if(!poems.length) return;
      var pick = poems[Math.floor(Math.random() * poems.length)];
      window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
    });
});

// ===== 主题切换 =====
(function(){
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if(!btns.length) return;
  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }
  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      applyTheme(this.getAttribute('data-theme'));
    });
  });
})();

// ===== 替换 GitHub 链接中的占位 =====
(function(){
  var links = document.querySelectorAll('a[href*="YOUR_USERNAME"]');
  links.forEach(function(a){
    a.href = a.href.replace(/YOUR_USERNAME/g, 'zhege712-crypto');
    a.href = a.href.replace(/YOUR_REPO/g, 'Poem_Ulysses');
  });
})();
</script>
</body>
