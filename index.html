<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌漂流 · Poem's Ulysses</title>
<meta name="description" content="诗歌漂流 — 一个收集诗意的角落。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-kai: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --radius-md: 12px;
  --radius-pill: 999px;
  --maxw: 820px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.8;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ===== 开幕遮罩：夜潮 · 摊开的书 ===== */
#intro-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(ellipse at 50% 60%, #22211f, #131315 75%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s ease;
  opacity: 1;
  visibility: visible;
  pointer-events: none;
  transform: scale(1);
}
#intro-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  transform: scale(0.94);
}
#intro-overlay.skip { display: none; }

/* ---- Canvas 海浪层 ---- */
#intro-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
  z-index: 1;
  opacity: 0.85;
}

/* ---- 瓶后柔光 ---- */
.intro-glow {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212, 184, 150, 0.08), transparent 60%);
  filter: blur(18px);
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  animation: glowIn 1.2s ease 0.35s forwards;
}
@keyframes glowIn { to { opacity: 1; } }

/* ---- 希腊回纹边框 ---- */
.intro-meander {
  position: absolute;
  left: 0;
  width: 100%;
  height: 14px;
  color: var(--gold);
  opacity: 0;
  transition: opacity 1s ease 0.25s;
  z-index: 2;
  pointer-events: none;
}
.intro-meander.top { top: 30px; }
.intro-meander.bottom { bottom: 30px; }
.intro-meander.show { opacity: 0.55; }

/* ---- 摊开的书 ---- */
#book-wrap {
  position: relative;
  z-index: 3;
  opacity: 0;
  transform: translateY(56px);
  animation: bottleRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
}
#book {
  width: clamp(200px, 28vw, 260px);
  height: auto;
  display: block;
  animation: bottleBob 5.5s ease-in-out infinite;
  transform-origin: 50% 90%;
}
@keyframes bottleRise {
  0% { opacity: 0; transform: translateY(56px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes bottleBob {
  0%, 100% { transform: translateY(0) rotate(-1.6deg); }
  50% { transform: translateY(-9px) rotate(1.6deg); }
}

/* ---- 副标题与铭文 ---- */
.intro-sub {
  position: relative;
  z-index: 3;
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(0.85rem, 1.8vw, 1.3rem);
  color: var(--gold);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  margin-top: 34px;
  opacity: 0;
  animation: subFade 1s ease 0.9s forwards;
}
@keyframes subFade {
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ---- 开幕跳过 ---- */
.intro-skip {
  position: absolute;
  bottom: 40px;
  right: 32px;
  z-index: 5;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  color: rgba(236, 232, 223, 0.5);
  cursor: pointer;
  opacity: 0;
  animation: subFade 0.8s ease 1.8s forwards;
  pointer-events: auto;
  transition: color 0.3s;
}
.intro-skip:hover { color: var(--gold); }

/* ---- 跳过时首页立即可见 ---- */
body.intro-skipped header,
body.intro-skipped .page-content {
  opacity: 1;
  animation: none;
}

/* ---- 导航栏（动画结束后出现） ---- */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 24px 0;
  background: transparent;
  transition: background 0.4s ease;
  opacity: 0;
  animation: headerIn 0.8s ease 2.2s forwards;
}
header.scrolled {
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--gold-light);
}
@keyframes headerIn {
  0% { opacity: 0; transform: translateY(-10px); }
  100% { opacity: 1; transform: translateY(0); }
}

header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.15rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }

nav ul {
  list-style: none;
  display: flex;
  gap: 28px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  position: relative;
  padding-bottom: 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
nav a.active { color: var(--ink); }
nav a.active::after { width: 100%; }

@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

/* ===== 主题切换按钮 ===== */
.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-faded);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--gold);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

/* ===== 首页内容 ===== */
.page-content {
  opacity: 0;
  animation: contentIn 0.8s ease 2.4s forwards;
}
@keyframes contentIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

.hero {
  padding: 130px 0 50px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 18px;
}
.hero-eyebrow::before {
  content: '';
  width: 18px;
  height: 1px;
  background: var(--gold);
}
.hero h1 {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(2.4rem, 6vw, 4.4rem);
  letter-spacing: 0.04em;
  line-height: 1.15;
  max-width: 680px;
  text-wrap: balance;
}
.hero h1 em {
  font-style: italic;
  color: var(--gold);
}
.hero-desc {
  margin-top: 16px;
  max-width: 420px;
  color: var(--ink-light);
  font-size: 1.02rem;
  font-weight: 300;
}
.hero-divider {
  width: 80px;
  height: 1px;
  background: var(--gold);
  margin: 24px 0 10px;
}
.greek-divider {
  width: 104px;
  height: 10px;
  color: var(--gold);
  opacity: 0.7;
  margin: 26px 0 8px;
  display: block;
}
.hero-stats {
  display: inline-flex;
  gap: 2px;
  margin: 30px 0 36px;
  background: color-mix(in srgb, var(--paper) 60%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.hero-stats > div {
  padding: 14px 30px;
  transition: background 0.3s;
}
.hero-stats > div:hover { background: var(--paper-dark); }
.hero-stats .num {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 1.7rem;
  color: var(--ink);
  display: block;
  line-height: 1.1;
  letter-spacing: 0.02em;
}
.hero-stats .label {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  font-weight: 300;
  color: var(--ink-light);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  padding: 12px 26px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--radius-pill);
  transition: all 0.3s ease;
  cursor: pointer;
  border: 1px solid var(--gold-light);
  background: transparent;
  color: var(--ink);
}
.btn-primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn-primary:hover { background: var(--clay); border-color: var(--clay); }
.btn-outline:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-gold { border-color: var(--gold); color: var(--ink); }
.btn-gold:hover { background: var(--gold); color: var(--paper); border-color: var(--gold); }
.btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---- 最近诗作 ---- */
.recent-section {
  padding: 20px 0 80px;
}
.recent-section h2 {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: 0.06em;
  color: var(--ink-light);
  margin-bottom: 26px;
}
.recent-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  padding: 18px 12px;
  margin: 0 -12px;
  border-bottom: 1px solid var(--gold-light);
  align-items: baseline;
  border-radius: var(--radius-md);
  transition: background 0.3s, padding-left 0.3s;
}
.recent-item:hover { background: var(--paper-dark); padding-left: 20px; }
.recent-item .ri-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  color: var(--ink);
  transition: color 0.3s;
}
.recent-item:hover .ri-title { color: var(--clay); }
.recent-item .ri-meta {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  color: var(--ink-faded);
  white-space: nowrap;
}
.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 300;
  padding: 60px 0;
}

/* ---- 投稿说明 ---- */
.submit-note {
  background: var(--paper-dark);
  padding: 26px 30px;
  margin: 40px 0 60px;
  font-size: 0.85rem;
  color: var(--ink-light);
  line-height: 1.9;
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-md);
}
.note-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--ink);
  border: 1px solid var(--gold);
  border-radius: var(--radius-pill);
  padding: 2px 12px;
  margin-right: 10px;
}
.submit-note b { color: var(--ink); font-weight: 400; }
.submit-note a { color: var(--gold); border-bottom: 1px solid transparent; transition: border-color 0.3s; }
.submit-note a:hover { border-color: var(--gold); }

/* ---- 入场渐显 ---- */
.reveal-up {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal-up.in-view {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal-up {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }
</style>
</head>
<body>

<!-- ===== 开幕遮罩：夜潮 · 摊开的书 ===== -->
<div id="intro-overlay">
  <canvas id="intro-canvas"></canvas>
  <div class="intro-glow"></div>
  <svg class="intro-meander top" width="100%" height="14" aria-hidden="true">
    <defs><pattern id="meanderPatTop" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 V0 H10 V10 H20" fill="none" stroke="#D4B896" stroke-width="1.1"/>
    </pattern></defs>
    <rect width="100%" height="14" fill="url(#meanderPatTop)"/>
  </svg>
  <svg class="intro-meander bottom" width="100%" height="14" aria-hidden="true">
    <defs><pattern id="meanderPatBot" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 V0 H10 V10 H20" fill="none" stroke="#D4B896" stroke-width="1.1"/>
    </pattern></defs>
    <rect width="100%" height="14" fill="url(#meanderPatBot)"/>
  </svg>

  <div id="book-wrap">
    <svg id="book" viewBox="0 0 220 150" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M110 40 Q64 26 20 30 L20 104 Q64 98 110 106 Z" fill="#f2eee4" stroke="#d6cfc0" stroke-width="1"/>
      <path d="M110 40 Q156 26 200 30 L200 104 Q156 98 110 106 Z" fill="#f2eee4" stroke="#d6cfc0" stroke-width="1"/>
      <path d="M110 40 L110 106" stroke="#c9c1b2" stroke-width="1.4"/>
      <path d="M110 106 C112 113 107 119 110 128" stroke="#D4B896" stroke-width="2"/>
    </svg>
  </div>

  <div class="intro-sub">Poem's Ulysses</div>
  <div class="intro-skip" id="intro-skip" role="button" tabindex="0">跳过</div>
</div>

<!-- ===== 导航 ===== -->
<header id="header">
  <div class="wrap">
    <a class="logo" href="index.html">诗歌<span>漂流</span></a>
    <nav>
      <ul>
        <li><a href="index.html" class="active">首页</a></li>

        <li><a href="about.html">关于</a></li>
        <li><a href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank" rel="noopener noreferrer">投稿</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- ===== 主题切换 ===== -->
<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<!-- ===== 页面内容 ===== -->
<div class="page-content">
  <div class="wrap">
    <section class="hero">
      <div class="hero-eyebrow">Poem's Ulysses</div>
      <h1>诗歌<span style="color:var(--gold);">漂</span>流</h1>
      <svg class="greek-divider" viewBox="0 0 100 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 5 H8 V0 H16 V10 H24 V0 H32 V10 H40 V0 H48 V10 H56 V0 H64 V10 H72 V0 H80 V10 H88 V0 H100"/></svg>

        <div><span class="num" id="stat-count">—</span><span class="label">已收录</span></div>
        <div><span class="num" id="stat-latest">—</span><span class="label">最近更新</span></div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-primary" href="directory.html">浏览目录</a>
        <a class="btn btn-gold" id="random-btn" href="#" style="cursor:pointer;">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/></svg>
          随机一首
        </a>
        <a class="btn btn-outline" href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank" rel="noopener noreferrer">投稿</a>
      </div>
    </section>

    <section class="recent-section">
      <h2>最近的诗</h2>
      <div id="recent-list"><div class="empty-state">加载中…</div></div>
    </section>

    <div class="submit-note">
      <b class="note-tag">投稿</b><span>点击"投稿"会跳转到 GitHub Discussions，用你的 GitHub 账号登录后发帖即可。

    </div>
  </div>
</div>

<script>
// ============================================================
// 开幕动画：夜潮 · 摊开的书
// ============================================================
(function() {
  var overlay = document.getElementById('intro-overlay');
  var canvas = document.getElementById('intro-canvas');
  var preview = /[?&]preview=1/.test(window.location.search);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, animId = null;

  var waves = [
    { y: 0.56, amp: 7,  freq: 0.010, sp: 0.00035, w: 1,   c: 'rgba(212,184,150,0.30)' },
    { y: 0.64, amp: 10, freq: 0.008, sp: 0.00028, w: 1.1, c: 'rgba(212,184,150,0.22)' },
    { y: 0.72, amp: 8,  freq: 0.012, sp: 0.00032, w: 1,   c: 'rgba(168,146,118,0.26)' },
    { y: 0.80, amp: 12, freq: 0.009, sp: 0.00040, w: 1.3, c: 'rgba(124,106,82,0.32)' }
  ];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function draw(time) {
    ctx.clearRect(0, 0, W, H);
    var stop = overlay.classList.contains('hidden') || overlay.classList.contains('skip');
    if (stop) {
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      return;
    }
    for (var i = 0; i < waves.length; i++) {
      var cfg = waves[i];
      ctx.beginPath();
      for (var x = 0; x <= W; x += 10) {
        var y = cfg.y * H + Math.sin(x * cfg.freq + time * cfg.sp + i * 1.7) * cfg.amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = cfg.c;
      ctx.lineWidth = cfg.w;
      ctx.stroke();
    }
    animId = requestAnimationFrame(draw);
  }

  function finishIntro() {
    overlay.classList.add('hidden');
    sessionStorage.setItem('intro_poem_shown', '1');
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    setTimeout(function() { overlay.style.display = 'none'; }, 1000);
  }

  // 跳过判断
  if (!preview && sessionStorage.getItem('intro_poem_shown')) {
    overlay.classList.add('skip');
    document.body.classList.add('intro-skipped');
    return;
  }
  if (!preview && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    overlay.classList.add('skip');
    document.body.classList.add('intro-skipped');
    return;
  }

  // 回纹边框显现
  setTimeout(function() {
    var t = document.querySelector('.intro-meander.top');
    var b = document.querySelector('.intro-meander.bottom');
    if (t) t.classList.add('show');
    if (b) b.classList.add('show');
  }, 150);

  animId = requestAnimationFrame(draw);

  // 预览模式：冻结完整构图，不自动隐藏
  if (preview) {
    setTimeout(function() {
      document.querySelectorAll('.intro-meander').forEach(function(m) { m.classList.add('show'); m.style.opacity = '0.55'; });
      var bw = document.getElementById('book-wrap');
      if (bw) { bw.style.opacity = '1'; bw.style.transform = 'translateY(0)'; bw.style.animation = 'none'; }
      var sub = document.querySelector('.intro-sub'); if (sub) { sub.style.opacity = '1'; sub.style.animation = 'none'; }
      var glow = document.querySelector('.intro-glow'); if (glow) { glow.style.opacity = '1'; }
    }, 400);
    return;
  }

  // 2.8 秒后关闭
  setTimeout(finishIntro, 2800);

  // 跳过按钮
  var skip = document.getElementById('intro-skip');
  if (skip) {
    skip.addEventListener('click', function() {
      document.body.classList.add('intro-skipped');
      finishIntro();
    });
  }

})();

// ============================================================
// 工具函数
// ============================================================
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function getDateWeight(dateStr) {
  if (!dateStr || dateStr.trim() === '') return -1;
  var parts = dateStr.trim().split('-');
  var weight = 0;
  if (parts[0]) weight += 10000;
  if (parts[1]) weight += 100;
  if (parts[2]) weight += 1;
  return weight;
}
function sortByDate(a, b) {
  var wA = getDateWeight(a.date);
  var wB = getDateWeight(b.date);
  if (wA !== wB) return wB - wA;
  return (a.date || '').localeCompare(b.date || '');
}
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

// ============================================================
// 加载数据 & 渲染
// ============================================================
var dataUrl = 'data/poems.json?t=' + Date.now();

fetch(dataUrl)
  .then(function(r) { return r.json(); })
  .then(function(poems) {
    var count = document.getElementById('stat-count');
    var latest = document.getElementById('stat-latest');
    count.textContent = poems.length;
    if (poems.length) {
      var sorted = poems.slice().sort(sortByDate);
      latest.textContent = formatPoemDate(sorted[0].date);
    } else {
      latest.textContent = '—';
    }

    var list = document.getElementById('recent-list');
    if (!poems.length) {
      list.innerHTML = '<div class="empty-state">还没有诗，等待第一首漂流而来。</div>';
      return;
    }
    var recent = poems.slice().sort(sortByDate).slice(0, 6);
    list.innerHTML = recent.map(function(p) {
      return '<a class="recent-item" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
        '<span class="ri-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="ri-meta">' + formatPoemDate(p.date) + (p.author ? ' · ' + escapeHtml(p.author) : '') + '</span>' +
      '</a>';
    }).join('');

    // 入场渐显
    if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var recentItems = list.querySelectorAll('.recent-item');
      recentItems.forEach(function(el, idx) {
        el.classList.add('reveal-up');
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(en) {
            if (en.isIntersecting) {
              setTimeout(function() { el.classList.add('in-view'); }, idx * 70);
              io.disconnect();
            }
          });
        }, { threshold: 0.1 });
        io.observe(el);
      });
    }
  })
  .catch(function() {
    document.getElementById('recent-list').innerHTML = '<div class="empty-state">加载失败，请检查 data/poems.json 是否存在。</div>';
    document.getElementById('stat-count').textContent = '0';
  });

// ============================================================
// 随机阅读
// ============================================================
document.getElementById('random-btn').addEventListener('click', function(e) {
  e.preventDefault();
  fetch(dataUrl)
    .then(function(r) { return r.json(); })
    .then(function(poems) {
      if (!poems.length) return;
      var pick = poems[Math.floor(Math.random() * poems.length)];
      window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
    });
});

// ============================================================
// 导航滚动
// ============================================================
(function() {
  var header = document.getElementById('header');
  var lastScroll = 0;
  window.addEventListener('scroll', function() {
    var scrollY = window.scrollY;
    if (scrollY > 40) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
})();

// ============================================================
// 主题切换
// ============================================================
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;

  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }

  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(this.getAttribute('data-theme'));
    });
  });

  // 暗黑模式样式补丁
  var style = document.createElement('style');
  style.textContent = `
    [data-theme="dark"] {
      --paper: #1E1E1C;
      --paper-dark: #2A2A27;
      --ink: #ECECE5;
      --ink-light: #C4C4BE;
      --ink-faded: #8A8A85;
      --gold: #D4A373;
      --gold-light: #4A4A45;
      --clay: #E55A5F;
    }
    [data-theme="eye-care"] {
      --paper: #ECF3E5;
      --paper-dark: #DEE8D4;
      --ink: #3A4632;
      --ink-light: #5C6A4F;
      --ink-faded: #82906F;
      --gold: #BDA26C;
      --gold-light: #C6D3B4;
      --clay: #B2674F;
    }
    [data-theme="dark"] .side-theme,
    [data-theme="eye-care"] .side-theme {
      background: rgba(30, 30, 28, 0.7);
      border-color: var(--gold-light);
    }
    [data-theme="dark"] header.scrolled {
      background: rgba(30, 30, 28, 0.72);
    }
    [data-theme="eye-care"] header.scrolled {
      background: rgba(236, 243, 229, 0.72);
    }
  `;
  document.head.appendChild(style);
})();
</script>
