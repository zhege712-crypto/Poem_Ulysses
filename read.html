<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌 · 诗歌漂流</title>
<meta name="description" content="待到山花烂漫时">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-kai: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --radius-pill: 999px;
  --maxw: 720px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.9;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 20px 0;
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }
nav ul {
  list-style: none;
  display: flex;
  gap: 28px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  position: relative;
  padding-bottom: 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

.back-link {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  color: var(--ink-faded);
  transition: color 0.3s;
}
.back-link:hover { color: var(--gold); }

.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-faded);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--gold);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

.poem-detail { padding: 40px 0 20px; }
.poem-meta {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.poem-meta .p-author {
  font-family: var(--font-serif);
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--ink-light);
}
.poem-meta .random-icon {
  margin-left: auto;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-light);
  font-family: var(--font-mono);
  font-size: 0.55rem;
  transition: color 0.3s, background 0.3s, border-color 0.3s;
  border: 1px solid var(--gold-light);
  background: transparent;
  border-radius: var(--radius-pill);
  padding: 6px 14px;
}
.poem-meta .random-icon svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.2;
}
.poem-meta .random-icon:hover {
  color: var(--paper);
  background: var(--ink);
  border-color: var(--ink);
}

.poem-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  letter-spacing: 0.02em;
  margin-bottom: 20px;
  line-height: 1.2;
  text-wrap: balance;
}
.poem-content {
  white-space: pre-line;
  font-size: 1.06rem;
  color: var(--ink);
  font-family: var(--font-kai);
  line-height: 2.15;
  letter-spacing: 0.02em;
  max-width: 640px;
  text-wrap: pretty;
}
.poem-content::before {
  content: '‖';
  display: block;
  font-family: var(--font-serif);
  font-size: 0.85rem;
  color: var(--gold);
  margin-bottom: 14px;
  opacity: 0.6;
}
.poem-image {
  margin-top: 36px;
}
.poem-image img {
  width: 100%;
  filter: grayscale(0.8) contrast(1.02);
  transition: filter 0.6s, transform 0.6s;
  cursor: zoom-in;
  border: 1px solid var(--gold-light);
}
.poem-image img:hover {
  filter: grayscale(0) contrast(1.05);
  transform: scale(1.005);
}

.greek-divider {
  width: 104px;
  height: 10px;
  color: var(--gold);
  opacity: 0.7;
  margin: 0 0 28px;
  display: block;
}
.reveal-up {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal-up.in-view {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal-up {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

/* ---- 上一篇 / 下一篇 ---- */
.poem-nav {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin-top: 46px;
  padding-top: 26px;
  border-top: 1px solid var(--gold-light);
}
.poem-nav a,
.poem-nav span {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--ink-light);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 10px 20px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: border-color 0.3s, color 0.3s, background 0.3s;
}
.poem-nav a:hover {
  border-color: var(--gold);
  color: var(--ink);
  background: var(--paper-dark);
}
.poem-nav .disabled {
  opacity: 0.35;
  pointer-events: none;
}
.poem-nav .pn-next { margin-left: auto; }
.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 300;
  padding: 80px 0;
}

.comments-section {
  padding: 50px 0 80px;
  margin-top: 40px;
  border-top: 1px solid var(--gold-light);
}
.comments-section h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.06em;
  margin-bottom: 20px;
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(44, 42, 40, 0.95);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 50px;
  cursor: zoom-out;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.lightbox-close {
  position: fixed;
  top: 28px;
  right: 32px;
  z-index: 501;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 300;
  color: var(--paper);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 6px 14px;
  cursor: pointer;
  background: transparent;
  transition: border-color 0.3s;
}
.lightbox-close:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>

<header>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" type="button">关闭 ✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>

  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<script>
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

// ===== 灯箱 =====
(function() {
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('active');
  }
  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxImg.src = '';
  }
  document.addEventListener('click', function(e) {
    var img = e.target.closest('.poem-image img');
    if (img) { openLightbox(img.src, img.alt); return; }
    if (lightbox.classList.contains('active') && lightbox.contains(e.target)) {
      closeLightbox();
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });
})();

// ===== 加载诗歌 =====
var id = new URLSearchParams(window.location.search).get('id');
var dataUrl = 'data/poems.json?t=' + Date.now();

fetch(dataUrl)
  .then(function(r) { return r.json(); })
  .then(function(poems) {
    var poem = poems.find(function(p) { return p.id === id; });
    var detail = document.getElementById('poem-detail');
    if (!poem) {
      detail.innerHTML = '<div class="empty-state">没找到这首诗，可能已被删除。</div>';
      return;
    }
    document.title = poem.title + ' · 诗歌漂流';

    // ===== 目录顺序（系列 → 系列内日期降序，与目录页一致） =====
    function getDateWeight(dateStr) {
      if (!dateStr || dateStr.trim() === '') return -1;
      var parts = dateStr.trim().split('-');
      var w = 0;
      if (parts[0]) w += 10000;
      if (parts[1]) w += 100;
      if (parts[2]) w += 1;
      return w;
    }
    var seriesOrder = [];
    var seenSeries = {};
    poems.forEach(function(p) {
      var s = p.series || '未分类';
      if (!seenSeries[s]) { seenSeries[s] = 1; seriesOrder.push(s); }
    });
    var ordered = poems.slice().sort(function(a, b) {
      var sa = a.series || '未分类', sb = b.series || '未分类';
      var ia = seriesOrder.indexOf(sa), ib = seriesOrder.indexOf(sb);
      if (ia !== ib) return ia - ib;
      var wa = getDateWeight(a.date), wb = getDateWeight(b.date);
      if (wa !== wb) return wb - wa;
      return (a.date || '').localeCompare(b.date || '');
    });
    var curIdx = ordered.findIndex(function(p) { return p.id === poem.id; });
    var prevPoem = curIdx > 0 ? ordered[curIdx - 1] : null;
    var nextPoem = (curIdx >= 0 && curIdx < ordered.length - 1) ? ordered[curIdx + 1] : null;

    var imgList = Array.isArray(poem.images) ? poem.images.slice() : [];
    if (poem.image) imgList.push(poem.image);
    var imgHtml = imgList.map(function(src) {
      var fixedSrc = src.replace(/^photos\/poems\//, 'images/');
      return '<div class="poem-image"><img src="' + escapeHtml(fixedSrc) + '" alt="' + escapeHtml(poem.title) + '"></div>';
    }).join('');

    var metaDate = formatPoemDate(poem.date);

    // ===== 构建详情 =====
    detail.innerHTML =
      '<div class="poem-meta">' +
        (poem.author ? '<span class="p-author">' + escapeHtml(poem.author) + '</span>' : '') +
        (poem.author ? ' · ' : '') +
        metaDate +
        (poem.series ? ' · ' + escapeHtml(poem.series) : '') +
        (poem.subseries ? ' · ' + escapeHtml(poem.subseries) : '') +
        '<button class="random-icon" id="random-btn" type="button" title="随机换一首">' +
          '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/></svg>' +
          '换一首' +
        '</button>' +
      '</div>' +
      '<div class="poem-title">' + escapeHtml(poem.title) + '</div>' +
      '<svg class="greek-divider" viewBox="0 0 100 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 5 H8 V0 H16 V10 H24 V0 H32 V10 H40 V0 H48 V10 H56 V0 H64 V10 H72 V0 H80 V10 H88 V0 H100"/></svg>' +
      '<div class="poem-content">' + escapeHtml(poem.content) + '</div>' +
      imgHtml +
      '<div class="poem-nav">' +
        (prevPoem ? '<a class="pn-prev" href="read.html?id=' + encodeURIComponent(prevPoem.id) + '" title="键盘 ←">← 上一篇</a>' : '<span class="pn-prev disabled">← 上一篇</span>') +
        (nextPoem ? '<a class="pn-next" href="read.html?id=' + encodeURIComponent(nextPoem.id) + '" title="键盘 →">下一篇 →</a>' : '<span class="pn-next disabled">下一篇 →</span>') +
      '</div>';

    // ===== 键盘翻页 =====
    document.addEventListener('keydown', function(e) {
      var lb = document.getElementById('lightbox');
      if (lb && lb.classList.contains('active')) return;
      if (e.key === 'ArrowLeft' && prevPoem) {
        window.location.href = 'read.html?id=' + encodeURIComponent(prevPoem.id);
      } else if (e.key === 'ArrowRight' && nextPoem) {
        window.location.href = 'read.html?id=' + encodeURIComponent(nextPoem.id);
      }
    });

    // ===== 入场渐显（尊重系统减弱动效设置） =====
    var revealEls = detail.querySelectorAll('.poem-content, .poem-image');
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      revealEls.forEach(function(el) { el.classList.add('in-view'); });
    } else {
      revealEls.forEach(function(el, idx) {
        el.classList.add('reveal-up');
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(en) {
            if (en.isIntersecting) {
              setTimeout(function() { el.classList.add('in-view'); }, idx * 90);
              io.disconnect();
            }
          });
        }, { threshold: 0.15 });
        io.observe(el);
      });
    }

    // ===== 随机功能（排除当前诗） =====
    document.getElementById('random-btn').addEventListener('click', function() {
      var currentId = poem.id;
      var available = poems.filter(function(p) { return p.id !== currentId; });
      if (!available.length) return;
      var pick = available[Math.floor(Math.random() * available.length)];
      window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
    });

    // ===== Giscus =====
    var commentsWrap = document.getElementById('comments-wrap');
    commentsWrap.style.display = 'block';
    var container = document.getElementById('giscus-container');
    var script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.setAttribute('data-repo', 'zhege712-crypto/Poem_Ulysses');
    script.setAttribute('data-repo-id', 'R_kgDOTo0tAw');
    script.setAttribute('data-category', 'Announcements');
    script.setAttribute('data-category-id', 'DIC_kwDOTo0tA84DCXH7');
    script.setAttribute('data-mapping', 'specific');
    script.setAttribute('data-term', 'poem-' + poem.id);
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'bottom');
    script.setAttribute('data-theme', 'light');
    script.setAttribute('data-lang', 'zh-CN');
    script.crossOrigin = 'anonymous';
    script.async = true;
    container.appendChild(script);
  })
  .catch(function() {
    document.getElementById('poem-detail').innerHTML = '<div class="empty-state">加载失败，检查 data/poems.json 是否存在。</div>';
  });

// ============================================================
// 主题切换
// ============================================================
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;

  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
    var iframe = document.querySelector('iframe.giscus-frame');
    if (iframe && iframe.contentWindow) {
      var giscusTheme = theme === 'light' ? 'light' : (theme === 'dark' ? 'dark' : 'light');
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme } } }, 'https://giscus.app');
    }
  }

  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(this.getAttribute('data-theme'));
    });
  });

  var style = document.createElement('style');
  style.textContent = `
    [data-theme="dark"] {
      --paper: #1E1E1C;
      --paper-dark: #2A2A27;
      --ink: #ECECE5;
      --ink-light: #C4C4BE;
      --ink-faded: #8A8A85;
      --gold: #D4A373;
      --gold-light: #4A4A45;
      --clay: #E55A5F;
    }
    [data-theme="eye-care"] {
      --paper: #ECF3E5;
      --paper-dark: #DEE8D4;
      --ink: #3A4632;
      --ink-light: #5C6A4F;
      --ink-faded: #82906F;
      --gold: #BDA26C;
      --gold-light: #C6D3B4;
      --clay: #B2674F;
    }
    [data-theme="dark"] .side-theme,
    [data-theme="eye-care"] .side-theme {
      background: rgba(30, 30, 28, 0.7);
      border-color: var(--gold-light);
    }
    [data-theme="dark"] header {
      background: rgba(30, 30, 28, 0.72);
    }
    [data-theme="eye-care"] header {
      background: rgba(236, 243, 229, 0.72);
    }
  `;
  document.head.appendChild(style);
})();
</script>
</body>
</html>
