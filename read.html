<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌 · 诗歌漂流</title>
<meta name="description" content="阅读一首诗，让文字漂流。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f0;
  --paper-2:#f0ebe0;
  --white:#ffffff;
  --ink:#2c2c2a;
  --charcoal:#4a4842;
  --steel:#8a867a;
  --fog:#d5cec0;
  --accent-gold:#c79a6e;
  --accent-red:#b86b4a;
  --accent-cobalt:#5f7f92;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-serif:'Noto Serif SC','Kaiti SC','STKaiti','KaiTi',serif;
  --font-mono:'Space Mono',monospace;
  --maxw:720px;
}
[data-theme="dark"] {
  --paper: #1e1e1c;
  --paper-2: #2a2a27;
  --white: #2a2a27;
  --ink: #ecece5;
  --charcoal: #c4c4be;
  --steel: #8a8a85;
  --fog: #4a4a45;
  --accent-gold: #d4a373;
  --accent-red: #e55a5f;
}
[data-theme="eye-care"] {
  --paper: #ecf3e5;
  --paper-2: #dee8d4;
  --white: #f4f8ee;
  --ink: #3a4632;
  --charcoal: #5c6a4f;
  --steel: #82906f;
  --fog: #c6d3b4;
  --accent-gold: #bda26c;
  --accent-red: #b2674f;
  --accent-cobalt: #5f7f92;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  transition:background 0.3s, color 0.3s;
}
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }

header{
  padding:26px 0 18px;
  border-bottom:1px solid var(--paper-2);
  background:var(--paper);
  position:sticky;
  top:0;
  z-index:50;
  transition:background 0.3s, border-color 0.3s;
}
header .wrap{
  max-width:960px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}
.logo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.15rem;
}
.logo span{ color:var(--accent-gold); }
nav ul{
  list-style:none;
  display:flex;
  gap:24px;
  align-items:center;
}
nav a{
  font-family:var(--font-mono);
  font-size:0.7rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--charcoal);
  transition:color 0.25s;
  position:relative;
  padding-bottom:2px;
}
nav a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1.5px;
  background:var(--accent-gold);
  transition:width 0.3s;
}
nav a:hover{ color:var(--accent-red); }
nav a:hover::after{ width:100%; }
@media(max-width:600px){
  header .wrap{ flex-direction:column; align-items:flex-start; gap:6px; }
  nav ul{ gap:16px; flex-wrap:wrap; }
}
.back-link{
  font-family:var(--font-mono);
  font-size:0.75rem;
  color:var(--steel);
}
.back-link:hover{ color:var(--accent-red); }

.side-theme{
  position:fixed;
  right:28px;
  bottom:100px;
  z-index:150;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 24px rgba(28,28,27,0.08), inset 0 1px 0 rgba(255,255,255,0.35);
  padding:10px 8px;
  border-radius:28px;
  border:1px solid var(--fog);
  transition:background 0.3s, border-color 0.3s;
}
.side-theme .theme-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:transparent;
  cursor:pointer;
  transition:background 0.25s, transform 0.2s, box-shadow 0.25s;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.side-theme .theme-btn svg{
  width:22px;
  height:22px;
  stroke:var(--charcoal);
  stroke-width:1.8;
  fill:none;
  display:block;
  transition:stroke 0.25s;
}
.side-theme .theme-btn:hover{ background:var(--paper-2); transform:scale(1.08); }
.side-theme .theme-btn.active{
  background:var(--accent-gold);
  box-shadow:0 0 0 2px var(--accent-gold);
}
.side-theme .theme-btn.active svg{ stroke:var(--white); }
.side-theme .line{
  width:2px;
  height:10px;
  background:var(--fog);
  border-radius:1px;
  transition:background 0.3s;
}
@media(max-width:820px){ .side-theme{ right:16px; bottom:80px; } }

.poem-detail{ padding:50px 0 20px; }
.poem-meta{
  font-family:var(--font-mono);
  font-size:0.72rem;
  letter-spacing:0.08em;
  color:var(--steel);
  margin-bottom:16px;
}
.poem-meta .p-author{
  font-family:var(--font-serif);
  font-size:0.85rem;
  color:var(--charcoal);
}
.poem-title{
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(1.8rem,5vw,2.6rem);
  margin-bottom:30px;
}
.poem-content{
  white-space:pre-line;
  font-size:1.05rem;
  color:var(--charcoal);
  font-family:var(--font-serif);
  line-height:2.2;
  letter-spacing:0.04em;
}
.poem-image{
  margin-top:32px;
}
.poem-image img{
  width:100%;
  filter:grayscale(0.6) contrast(1.02);
  transition:filter 0.6s, transform 0.6s;
  cursor:zoom-in;
  border-radius:2px;
}
.poem-image img:hover{
  filter:grayscale(0) contrast(1.05);
  transform:scale(1.01);
}
.greek-divider{
  width:100px;
  height:10px;
  color:var(--fog);
  margin:20px 0;
  display:block;
}
.empty-state{
  text-align:center;
  color:var(--steel);
  font-family:var(--font-mono);
  font-size:0.85rem;
  padding:80px 0;
}
.comments-section{
  padding:50px 0 80px;
  margin-top:40px;
  border-top:1px solid var(--paper-2);
}
.comments-section h2{
  font-family:var(--font-display);
  font-weight:500;
  font-size:1.2rem;
  margin-bottom:24px;
}
footer{
  padding:30px 0;
  text-align:center;
  font-family:var(--font-mono);
  font-size:0.68rem;
  color:var(--steel);
  background:var(--ink);
  color:var(--paper-2);
}
footer a{ color:var(--accent-gold); }

.lightbox{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(28,28,27,0.94);
  display:none;
  align-items:center;
  justify-content:center;
  padding:50px;
  cursor:zoom-out;
}
.lightbox.active{ display:flex; }
.lightbox img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  filter:none;
}
.lightbox-close{
  position:fixed;
  top:26px;
  right:32px;
  z-index:501;
  font-family:var(--font-mono);
  font-size:0.75rem;
  color:var(--white);
  border:1px solid rgba(255,255,255,0.3);
  padding:8px 14px;
  cursor:pointer;
  background:transparent;
}
.lightbox-close:hover{ border-color:var(--accent-gold); color:var(--accent-gold); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">📖 诗歌<span>漂流</span></div>
    <nav>
      <ul>
        <li><a href="index.html">首页</a></li>
        <li><a href="directory.html">目录</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="https://github.com/YOUR_USERNAME/YOUR_REPO/discussions/new/choose" target="_blank">投稿</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="poem-detail" id="poem-detail">
    <div class="empty-state">加载中…</div>
  </div>
</div>

<div class="wrap comments-section" id="comments-wrap" style="display:none;">
  <h2>💬 留言</h2>
  <div id="giscus-container"></div>
</div>

<footer>
  © 2026 诗歌漂流 · 由 <a href="https://github.com/YOUR_USERNAME" target="_blank">@YOUR_USERNAME</a> 维护
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" type="button">关闭 ✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 2a10 10 0 0 1 0 20 10 10 0 0 1 0-20z" style="fill:rgba(0,0,0,0.1);"/><path d="M12 4a8 8 0 0 0 0 16 8 8 0 0 0 0-16z" fill="var(--charcoal)" opacity="0.2"/><path d="M12 6a6 6 0 0 1 0 12 6 6 0 0 1 0-12z" fill="var(--charcoal)" opacity="0.4"/><path d="M12 8a4 4 0 0 0 0 8 4 4 0 0 0 0-8z" fill="var(--charcoal)" opacity="0.6"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 9c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z" fill="var(--charcoal)" opacity="0.3"/><path d="M12 10.5c-.8 0-1.5.7-1.5 1.5s.7 1.5 1.5 1.5 1.5-.7 1.5-1.5-.7-1.5-1.5-1.5z" fill="var(--charcoal)" opacity="0.5"/></svg>
  </button>
</div>

<script>
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

// ===== 灯箱 =====
(function(){
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('active');
  }
  function closeLightbox(){
    lightbox.classList.remove('active');
    lightboxImg.src = '';
  }
  document.addEventListener('click', function(e){
    var img = e.target.closest('.poem-image img');
    if(img){ openLightbox(img.src, img.alt); return; }
    if(lightbox.classList.contains('active') && lightbox.contains(e.target)){
      closeLightbox();
    }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeLightbox();
  });
})();

// ===== 加载诗歌 =====
var id = new URLSearchParams(window.location.search).get('id');
fetch('data/poems.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(poems){
    var poem = poems.find(function(p){ return p.id === id; });
    var detail = document.getElementById('poem-detail');
    if(!poem){
      detail.innerHTML = '<div class="empty-state">没找到这首诗，可能已被删除。</div>';
      return;
    }
    document.title = poem.title + ' · 诗歌漂流';
    var imgList = Array.isArray(poem.images) ? poem.images.slice() : [];
    if(poem.image) imgList.push(poem.image);
    var imgHtml = imgList.map(function(src){
      var fixedSrc = src.replace(/^photos\/poems\//, 'images/');
      return '<div class="poem-image"><img src="' + escapeHtml(fixedSrc) + '" alt="' + escapeHtml(poem.title) + '"></div>';
    }).join('');
    var metaDate = formatPoemDate(poem.date);
    detail.innerHTML =
      '<div class="poem-meta">' + (poem.author ? '<span class="p-author">' + escapeHtml(poem.author) + '</span> · ' : '') +
      metaDate +
      (poem.series ? ' · ' + escapeHtml(poem.series) : '') +
      (poem.subseries ? ' · ' + escapeHtml(poem.subseries) : '') + '</div>' +
      '<div class="poem-title">' + escapeHtml(poem.title) + '</div>' +
      '<svg class="greek-divider" viewBox="0 0 100 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5 H8 V0 H16 V10 H24 V0 H32 V10 H40 V0 H48 V10 H56 V0 H64 V10 H72 V0 H80 V10 H88 V0 H100"/></svg>' +
      '<div class="poem-content">' + escapeHtml(poem.content) + '</div>' +
      imgHtml;

    // ===== Giscus 评论 =====
    var commentsWrap = document.getElementById('comments-wrap');
    commentsWrap.style.display = 'block';
    var container = document.getElementById('giscus-container');
    var script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.setAttribute('data-repo', 'YOUR_USERNAME/YOUR_REPO');
    script.setAttribute('data-repo-id', 'R_kgDOTWw-Ew');
    script.setAttribute('data-category', 'Announcements');
    script.setAttribute('data-category-id', 'DIC_kwDOTWw-E84DBOn-');
    script.setAttribute('data-mapping', 'specific');
    script.setAttribute('data-term', 'poem-' + poem.id);
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'bottom');
    script.setAttribute('data-theme', 'light');
    script.setAttribute('data-lang', 'zh-CN');
    script.crossOrigin = 'anonymous';
    script.async = true;
    container.appendChild(script);
  })
  .catch(function(){
    document.getElementById('poem-detail').innerHTML = '<div class="empty-state">加载失败，检查 data/poems.json 是否存在。</div>';
  });

// ===== 主题 =====
(function(){
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if(!btns.length) return;
  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
    // 同步 Giscus 主题
    var iframe = document.querySelector('iframe.giscus-frame');
    if(iframe && iframe.contentWindow){
      var giscusTheme = theme === 'light' ? 'light' : (theme === 'dark' ? 'dark' : 'light');
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme } } }, 'https://giscus.app');
    }
  }
  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      applyTheme(this.getAttribute('data-theme'));
    });
  });
})();

// ===== 替换 GitHub 占位 =====
(function(){
  var links = document.querySelectorAll('a[href*="YOUR_USERNAME"]');
  links.forEach(function(a){
    a.href = a.href.replace(/YOUR_USERNAME/g, 'YOUR_GITHUB_USERNAME');
    a.href = a.href.replace(/YOUR_REPO/g, 'poetry-odyssey');
  });
  var giscusScript = document.querySelector('script[data-repo*="YOUR_USERNAME"]');
  if(giscusScript){
    giscusScript.setAttribute('data-repo', giscusScript.getAttribute('data-repo').replace(/YOUR_USERNAME/g, 'YOUR_GITHUB_USERNAME'));
    giscusScript.setAttribute('data-repo', giscusScript.getAttribute('data-repo').replace(/YOUR_REPO/g, 'poetry-odyssey'));
  }
})();
</script>
</body>
</html>
