<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-kai: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --radius-pill: 999px;
  --maxw: 720px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.9;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 20px 0;
  background: color-mix(in srgb, var(--paper) 74%, transparent);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }
nav ul {
  list-style: none;
  display: flex;
  gap: 20px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-light);
  position: relative;
  display: inline-flex; align-items: center; min-height: 44px; padding: 9px 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

.back-link {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--ink);
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
  padding: 9px 20px;
  border: 1px solid var(--gold);
  border-radius: var(--radius-pill);
  background: var(--paper);
}
.back-link svg {
  width: 15px;
  height: 15px;
  stroke: var(--gold);
}
.back-link:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.back-link:hover svg { stroke: var(--gold); }

.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: color-mix(in srgb, var(--paper) 74%, transparent);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-light);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--ink);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .theme-btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

.poem-detail { padding: 40px 0 20px; }
.poem-meta {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.poem-meta .p-author {
  font-family: var(--font-serif);
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--ink-light);
  position: relative;
  padding-bottom: 2px;
  transition: color 0.3s;
}
.poem-meta .p-author::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
.poem-meta .p-author:hover { color: var(--clay); }
.poem-meta .p-author:hover::after { width: 100%; }
.poem-meta .random-icon {
  margin-left: auto;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-light);
  font-family: var(--font-mono);
  font-size: 0.55rem;
  transition: color 0.3s, background 0.3s, border-color 0.3s;
  border: 1px solid var(--gold-light);
  background: transparent;
  border-radius: var(--radius-pill);
  padding: 6px 14px;
}
.poem-meta .random-icon svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.2;
}
.poem-meta .random-icon:hover {
  color: var(--paper);
  background: var(--ink);
  border-color: var(--ink);
}

.poem-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  letter-spacing: 0.02em;
  margin-bottom: 20px;
  line-height: 1.2;
  text-wrap: balance;
}
.poem-content {
  white-space: pre-line;
  font-size: 1.06rem;
  color: var(--ink);
  font-family: var(--font-kai);
  line-height: 2.15;
  letter-spacing: 0.02em;
  max-width: 640px;
  text-wrap: pretty;
}
.poem-content::before {
  content: '‖';
  display: block;
  font-family: var(--font-serif);
  font-size: 0.85rem;
  color: var(--gold);
  margin-bottom: 14px;
  opacity: 0.6;
}
.poem-image {
  margin-top: 36px;
}
.poem-image img {
  width: 100%;
  filter: grayscale(0.8) contrast(1.02);
  transition: filter 0.6s, transform 0.6s;
  cursor: zoom-in;
  border: 1px solid var(--gold-light);
}
.poem-image img:hover {
  filter: grayscale(0) contrast(1.05);
  transform: scale(1.005);
}

.greek-divider {
  width: 104px;
  height: 10px;
  color: var(--gold);
  opacity: 0.7;
  margin: 0 0 28px;
  display: block;
}
.reveal-up {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal-up.in-view {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal-up {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

/* ---- 上一篇 / 下一篇 ---- */
.poem-nav {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin-top: 46px;
  padding-top: 26px;
  border-top: 1px solid var(--gold-light);
}
.poem-nav a,
.poem-nav span {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--ink-light);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 10px 20px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: border-color 0.3s, color 0.3s, background 0.3s;
}
.poem-nav a:hover {
  border-color: var(--gold);
  color: var(--ink);
  background: var(--paper-dark);
}
.poem-nav .disabled {
  opacity: 0.35;
  pointer-events: none;
}
.poem-nav .pn-next { margin-left: auto; }
.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 300;
  padding: 80px 0;
}

.comments-section {
  padding: 50px 0 80px;
  margin-top: 40px;
  border-top: 1px solid var(--gold-light);
}
.comments-section h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.06em;
  margin-bottom: 20px;
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }
.footer-stats {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 22px;
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  color: var(--ink-faded);
  opacity: 0.8;
}
.footer-stats .bsz-num { color: var(--gold); }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(44, 42, 40, 0.95);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 50px;
  cursor: zoom-out;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.lightbox-close {
  position: fixed;
  top: 28px;
  right: 32px;
  z-index: 501;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 300;
  color: var(--paper);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 6px 14px;
  cursor: pointer;
  background: transparent;
  transition: border-color 0.3s;
}
.lightbox-close:hover { border-color: var(--gold); color: var(--gold); }
</style>

<script>
function formatPoemDate(dateStr) {
  if (!dateStr || dateStr.trim() === '') return '年代不详';
  var parts = dateStr.trim().split('-');
  var year = parts[0];
  var month = parts[1];
  var day = parts[2];
  if (!month) return year + '年';
  if (!day) return year + '年' + parseInt(month) + '月';
  return year + '年' + parseInt(month) + '月' + parseInt(day) + '日';
}
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

// ===== 返回按钮（浏览器后退式，无历史回首页） =====
(function() {
  var back = document.getElementById('back-link');
  if (!back) return;
  back.addEventListener('click', function(e) {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });
  var ref = document.referrer || '';
  var label = document.getElementById('back-label');
  if (ref.indexOf('directory.html') !== -1) {
    label.textContent = '回到目录';
  } else if (ref.indexOf('authors.html') !== -1 || ref.indexOf('author.html') !== -1) {
    label.textContent = '回到同志们';
  } else if (ref.indexOf('index.html') !== -1) {
    label.textContent = '返回';
  }
})();

// ===== 灯箱 =====
(function() {
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var clearImageTimer;
  function openLightbox(src, alt) {
    clearTimeout(clearImageTimer);
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('active');
  }
  function closeLightbox() {
    lightbox.classList.remove('active');
    clearTimeout(clearImageTimer);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      lightboxImg.src = '';
    } else {
      clearImageTimer = setTimeout(function() {
        if (!lightbox.classList.contains('active')) lightboxImg.src = '';
      }, 240);
    }
  }
  document.addEventListener('click', function(e) {
    var img = e.target.closest('.poem-image img');
    if (img) { openLightbox(img.src, img.alt); return; }
    if (lightbox.classList.contains('active') && lightbox.contains(e.target)) {
      closeLightbox();
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });
})();

// ===== 加载诗歌与作者 =====
var id = new URLSearchParams(window.location.search).get('id');
var dataUrl = 'data/poems.json?t=' + Date.now();
var authorsUrl = 'data/authors.json?t=' + Date.now();

Promise.all([
  fetch(dataUrl).then(function(r) { return r.json(); }),
  fetch(authorsUrl).then(function(r) { return r.ok ? r.json() : []; })
]).then(function(res) {
  var poems = res[0];
  var authors = res[1];
    var poem = poems.find(function(p) { return p.id === id; });
    var detail = document.getElementById('poem-detail');
    if (!poem) {
      detail.innerHTML = '<div class="empty-state">没找到这首诗，可能已被删除。</div>';
      return;
    }
    document.title = poem.title + ' · 诗歌漂流';

    // ===== 署名 → 作者 id 映射（用于作者名链接；name 也参与匹配） =====
    var aliasMap = Object.create(null);
    authors.forEach(function(a) {
      (a.aliases || []).forEach(function(al) { aliasMap[al] = a.id; });
      if (a.name) aliasMap[a.name] = a.id;
    });
    var authorId = poem.author ? aliasMap[poem.author] : null;
    var authorHref = authorId ? 'author.html?id=' + encodeURIComponent(authorId) : null;

    // ===== 目录顺序（系列 → 系列内日期降序，与目录页一致） =====
    function getDateWeight(dateStr) {
      if (!dateStr || dateStr.trim() === '') return -1;
      var parts = dateStr.trim().split('-');
      var w = 0;
      if (parts[0]) w += 10000;
      if (parts[1]) w += 100;
      if (parts[2]) w += 1;
      return w;
    }
    var seriesOrder = [];
    var seenSeries = Object.create(null);
    poems.forEach(function(p) {
      var s = p.series || '未分类';
      if (!seenSeries[s]) { seenSeries[s] = 1; seriesOrder.push(s); }
    });
    var ordered = poems.slice().sort(function(a, b) {
      var sa = a.series || '未分类', sb = b.series || '未分类';
      var ia = seriesOrder.indexOf(sa), ib = seriesOrder.indexOf(sb);
      if (ia !== ib) return ia - ib;
      var wa = getDateWeight(a.date), wb = getDateWeight(b.date);
      if (wa !== wb) return wb - wa;
      return (a.date || '').localeCompare(b.date || '');
    });
    var curIdx = ordered.findIndex(function(p) { return p.id === poem.id; });
    var prevPoem = curIdx > 0 ? ordered[curIdx - 1] : null;
    var nextPoem = (curIdx >= 0 && curIdx < ordered.length - 1) ? ordered[curIdx + 1] : null;

    var imgList = Array.isArray(poem.images) ? poem.images.slice() : [];
    if (poem.image) imgList.push(poem.image);
    var imgHtml = imgList.map(function(src) {
      var fixedSrc = src.replace(/^photos\/poems\//, 'images/');
      return '<div class="poem-image"><img src="' + escapeHtml(fixedSrc) + '" alt="' + escapeHtml(poem.title) + '"></div>';
    }).join('');

    var metaDate = formatPoemDate(poem.date);

    // ===== 构建详情 =====
    detail.innerHTML =
      '<div class="poem-meta">' +
        (poem.author ? (authorHref ? '<a class="p-author" href="' + authorHref + '">' + escapeHtml(poem.author) + '</a>' : '<span class="p-author">' + escapeHtml(poem.author) + '</span>') : '') +
        (poem.author ? ' · ' : '') +
        metaDate +
        (poem.series ? ' · ' + escapeHtml(poem.series) : '') +
        (poem.subseries ? ' · ' + escapeHtml(poem.subseries) : '') +
        '<button class="random-icon" id="random-btn" type="button" title="随机换一首" aria-label="随机换一首">' +
          '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/></svg>' +
          '换一首' +
        '</button>' +
      '</div>' +
      '<h1 class="poem-title">' + escapeHtml(poem.title) + '</h1>' +
      '<svg class="greek-divider" viewBox="0 0 100 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 5 H8 V0 H16 V10 H24 V0 H32 V10 H40 V0 H48 V10 H56 V0 H64 V10 H72 V0 H80 V10 H88 V0 H100"/></svg>' +
      '<div class="poem-content">' + escapeHtml(poem.content) + '</div>' +
      imgHtml +
      '<div class="poem-nav">' +
        (prevPoem ? '<a class="pn-prev" href="read.html?id=' + encodeURIComponent(prevPoem.id) + '" title="键盘 ←">← 上一篇</a>' : '<span class="pn-prev disabled">← 上一篇</span>') +
        (nextPoem ? '<a class="pn-next" href="read.html?id=' + encodeURIComponent(nextPoem.id) + '" title="键盘 →">下一篇 →</a>' : '<span class="pn-next disabled">下一篇 →</span>') +
      '</div>';

    // ===== 键盘翻页 =====
    document.addEventListener('keydown', function(e) {
      var lb = document.getElementById('lightbox');
      if (lb && lb.classList.contains('active')) return;
      if (e.key === 'ArrowLeft' && prevPoem) {
        window.location.href = 'read.html?id=' + encodeURIComponent(prevPoem.id);
      } else if (e.key === 'ArrowRight' && nextPoem) {
        window.location.href = 'read.html?id=' + encodeURIComponent(nextPoem.id);
      }
    });

    // ===== 入场渐显（尊重系统减弱动效设置） =====
    var revealEls = detail.querySelectorAll('.poem-content, .poem-image');
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      revealEls.forEach(function(el) { el.classList.add('in-view'); });
    } else {
      revealEls.forEach(function(el, idx) {
        el.classList.add('reveal-up');
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(en) {
            if (en.isIntersecting) {
              setTimeout(function() { el.classList.add('in-view'); }, idx * 90);
              io.disconnect();
            }
          });
        }, { threshold: 0.15 });
        io.observe(el);
      });
    }

    // ===== 随机功能（排除当前诗） =====
    document.getElementById('random-btn').addEventListener('click', function() {
      var currentId = poem.id;
      var available = poems.filter(function(p) { return p.id !== currentId; });
      if (!available.length) return;
      var pick = available[Math.floor(Math.random() * available.length)];
      window.location.href = 'read.html?id=' + encodeURIComponent(pick.id);
    });

    // ===== Giscus =====
    var commentsWrap = document.getElementById('comments-wrap');
    commentsWrap.style.display = 'block';
    var container = document.getElementById('giscus-container');
    var script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.setAttribute('data-repo', 'zhege712-crypto/Poem_Ulysses');
    script.setAttribute('data-repo-id', 'R_kgDOTo0tAw');
    script.setAttribute('data-category', 'Announcements');
    script.setAttribute('data-category-id', 'DIC_kwDOTo0tA84DCXH7');
    script.setAttribute('data-mapping', 'specific');
    script.setAttribute('data-term', 'poem-' + poem.id);
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'bottom');
    script.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
    script.setAttribute('data-lang', 'zh-CN');
    script.crossOrigin = 'anonymous';
    script.async = true;
    container.appendChild(script);
  })
  .catch(function() {
    document.getElementById('poem-detail').innerHTML = '<div class="empty-state">加载失败，检查 data/poems.json 是否存在。</div>';
  });

// ============================================================
// 主题切换
// ============================================================
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;

  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('theme', theme); } catch (_) {}
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
    var iframe = document.querySelector('iframe.giscus-frame');
    if (iframe && iframe.contentWindow) {
      var giscusTheme = theme === 'light' ? 'light' : (theme === 'dark' ? 'dark' : 'light');
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme } } }, 'https://giscus.app');
    }
  }

  var saved; try { saved = localStorage.getItem('theme'); } catch (_) {}
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(this.getAttribute('data-theme'));
    });
  });

  var style = document.createElement('style');
  style.textContent = `
    [data-theme="dark"] {
      --paper: #1E1E1C;
      --paper-dark: #2A2A27;
      --ink: #ECECE5;
      --ink-light: #C4C4BE;
      --ink-faded: #8A8A85;
      --gold: #D4A373;
      --gold-light: #4A4A45;
      --clay: #E55A5F;
    }
    [data-theme="eye-care"] {
      --paper: #ECF3E5;
      --paper-dark: #DEE8D4;
      --ink: #3A4632;
      --ink-light: #5C6A4F;
      --ink-faded: #82906F;
      --gold: #BDA26C;
      --gold-light: #C6D3B4;
      --clay: #B2674F;
    }
    [data-theme="dark"] .side-theme,
    [data-theme="eye-care"] .side-theme {
      background: color-mix(in srgb, var(--paper) 74%, transparent);
      border-color: var(--gold-light);
    }
    [data-theme="dark"] header {
      background: color-mix(in srgb, var(--paper) 74%, transparent);
    }
    [data-theme="eye-care"] header {
      background: color-mix(in srgb, var(--paper) 74%, transparent);
    }
  `;
  document.head.appendChild(style);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script id="public-ui-motion">
(function(){
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function set(el,name,value){if(el.getAttribute(name)!==value)el.setAttribute(name,value)}
  function sync(){
    document.querySelectorAll('.theme-btn,#view-toggle button').forEach(function(b){set(b,'aria-pressed',String(b.classList.contains('active')))});
    document.querySelectorAll('.tree-branch').forEach(function(branch){var closed=branch.classList.contains('collapsed');var head=branch.querySelector(':scope>.branch-head');var children=branch.querySelector(':scope>.branch-children');if(head)set(head,'aria-expanded',String(!closed));if(children)children.inert=closed});
  }
  sync();
  var theme=document.querySelector('.side-theme');if(theme)new MutationObserver(sync).observe(theme,{subtree:true,attributes:true,attributeFilter:['class']});
  var catalog=document.getElementById('catalog-list');if(!catalog)return;
  new MutationObserver(sync).observe(catalog,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  var toggle=document.getElementById('view-toggle');if(!toggle)return;
  var running;
  toggle.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;requestAnimationFrame(function(){sync();if(running)running.cancel();if(reduced.matches)return;running=catalog.animate([{opacity:.88,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:240,easing:'cubic-bezier(.16,1,.3,1)'});})});
})();
</script>
