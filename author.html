<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同志 · 诗歌漂流</title>
<meta name="description" content="诗行背后的名字">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F5F0;
  --paper-dark: #EDE9E2;
  --ink: #2C2A28;
  --ink-light: #5A554E;
  --ink-faded: #99948D;
  --gold: #D4B896;
  --gold-light: #E8E2D8;
  --clay: #B85C3A;
  --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-kai: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
  --radius-md: 12px;
  --radius-pill: 999px;
  --maxw: 760px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: #fff; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.9;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ===== 导航 ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 22px 0;
  background: rgba(247, 245, 240, 0.72);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--gold-light);
}
header .wrap {
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  color: var(--ink);
}
.logo span { color: var(--gold); }
nav ul {
  list-style: none;
  display: flex;
  gap: 28px;
  align-items: center;
}
nav a {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  position: relative;
  padding-bottom: 2px;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
nav a:hover { color: var(--ink); }
nav a:hover::after { width: 100%; }
nav a.active { color: var(--ink); }
nav a.active::after { width: 100%; }
@media (max-width: 640px) {
  header .wrap { flex-wrap: wrap; gap: 8px; }
  nav ul { gap: 16px; flex-wrap: wrap; }
}

/* ===== 侧边主题切换 ===== */
.side-theme {
  position: fixed;
  right: 28px;
  bottom: 100px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(247, 245, 240, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 8px;
  border-radius: 24px;
  border: 1px solid var(--gold-light);
  transition: border-color 0.3s;
}
.side-theme .theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.side-theme .theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-faded);
  stroke-width: 1.2;
  fill: none;
  transition: stroke 0.25s;
}
.side-theme .theme-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.side-theme .theme-btn.active {
  background: var(--gold);
  box-shadow: 0 0 0 1.5px var(--gold);
}
.side-theme .theme-btn.active svg { stroke: var(--paper); }
.side-theme .line {
  width: 1.5px;
  height: 10px;
  background: var(--gold-light);
  border-radius: 1px;
}
@media (max-width: 820px) { .side-theme { right: 16px; bottom: 80px; } }

/* ===== 返回 ===== */
.back-link {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--ink);
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
  padding: 9px 20px;
  border: 1px solid var(--gold);
  border-radius: var(--radius-pill);
  background: var(--paper);
}
.back-link svg {
  width: 15px;
  height: 15px;
  stroke: var(--gold);
}
.back-link:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.back-link:hover svg { stroke: var(--gold); }

/* ===== 作者头部 ===== */
.author-detail { padding: 26px 0 10px; }
.author-head {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  padding-bottom: 30px;
  border-bottom: 1px solid var(--gold-light);
}
.ah-stamp {
  flex-shrink: 0;
  width: 84px;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 3rem;
  color: var(--clay);
  border: 1px solid var(--gold);
  border-radius: 16px;
  line-height: 1;
  user-select: none;
}
.ah-info { min-width: 0; }
.ah-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.6rem, 4.5vw, 2.3rem);
  letter-spacing: 0.04em;
  line-height: 1.2;
  text-wrap: balance;
}
.ah-aliases {
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--ink-faded);
}
.ah-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.ah-tag {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 3px 12px;
}
.ah-tag.ph {
  color: var(--ink-faded);
  border-style: dashed;
  border-color: var(--gold-light);
}
.ah-stats {
  display: flex;
  gap: 28px;
  margin-top: 18px;
}
.ah-stat .num {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 1.3rem;
  color: var(--ink);
  display: block;
  line-height: 1.1;
}
.ah-stat .label {
  font-family: var(--font-mono);
  font-size: 0.52rem;
  font-weight: 300;
  color: var(--ink-faded);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ah-bio {
  margin-top: 16px;
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1rem;
  color: var(--ink-light);
  max-width: 520px;
  white-space: pre-line;
  line-height: 1.9;
}
.ah-bio.ph {
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
}
.ah-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  padding: 8px 16px;
  transition: border-color 0.3s, color 0.3s, background 0.3s;
}
.ah-link:hover {
  border-color: var(--gold);
  color: var(--ink);
  background: var(--paper-dark);
}
.ah-link svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.2;
}

/* ===== 作品列表 ===== */
.works-section { padding: 30px 0 60px; }
.works-section h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.1rem;
  letter-spacing: 0.06em;
  color: var(--ink-light);
  margin-bottom: 8px;
}
.works-list { margin-top: 10px; }
.work-row {
  display: grid;
  grid-template-columns: 76px 1fr auto;
  gap: 18px;
  align-items: baseline;
  padding: 14px 12px;
  margin: 0 -12px;
  border-bottom: 1px solid var(--gold-light);
  border-radius: var(--radius-md);
  transition: background 0.3s, padding-left 0.3s;
}
.work-row:hover { background: var(--paper-dark); padding-left: 22px; }
.work-row .w-date {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
}
.work-row .w-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.02rem;
  color: var(--ink);
  transition: color 0.3s;
  position: relative;
}
.work-row .w-title::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.4s ease;
}
.work-row:hover .w-title { color: var(--clay); }
.work-row:hover .w-title::after { width: 100%; }
.work-row .w-series {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  white-space: nowrap;
}
.work-row .w-series .clay { color: var(--clay); }
.work-row .w-sub {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border: 1px solid var(--gold-light);
  border-radius: var(--radius-pill);
  color: var(--ink-light);
}
.work-subhead {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--ink-light);
  margin: 20px 0 2px;
  padding: 6px 16px;
  border: 1px solid var(--gold-light);
  background: color-mix(in srgb, var(--paper) 70%, transparent);
  border-radius: var(--radius-pill);
}
.work-subhead::before {
  content: '';
  width: 4px;
  height: 4px;
  background: var(--gold);
  flex-shrink: 0;
}
.work-subhead .ws-cnt {
  color: var(--clay);
  font-size: 0.5rem;
}
@media (max-width: 640px) {
  .work-row { grid-template-columns: 1fr auto; }
  .work-row .w-date { grid-column: 1 / -1; }
}

/* ===== 入场渐显 ===== */
.reveal-up {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal-up.in-view {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal-up {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

.empty-state {
  text-align: center;
  color: var(--ink-faded);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 300;
  padding: 60px 0;
}

footer {
  padding: 30px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--ink-faded);
  background: var(--ink);
  color: var(--paper-dark);
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer a { color: var(--gold); transition: color 0.3s; }
footer a:hover { color: var(--paper); }
.footer-stats {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 22px;
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  color: var(--ink-faded);
  opacity: 0.8;
}
.footer-stats .bsz-num { color: var(--gold); }
</style>
</head>
<body>

<!-- ===== 导航 ===== -->
<header>
  <div class="wrap">
    <a class="logo" href="index.html">诗歌<span>漂流</span></a>
    <nav>
      <ul>
        <li><a href="index.html">首页</a></li>
        <li><a href="directory.html">目录</a></li>
        <li><a href="authors.html" class="active">同志们</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="https://github.com/zhege712-crypto/Poem_Ulysses/discussions/new/choose" target="_blank" rel="noopener noreferrer">投稿</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- ===== 主题切换 ===== -->
<div class="side-theme" id="theme-side">
  <button class="theme-btn" data-theme="light" aria-label="日间模式" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="dark" aria-label="夜间模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/></svg>
  </button>
  <div class="line"></div>
  <button class="theme-btn" data-theme="eye-care" aria-label="护眼模式" type="button">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<div class="wrap">
  <a class="back-link" href="index.html" id="back-link">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.2"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="back-label">返回</span>
  </a>

  <div class="author-detail" id="author-detail">
    <div class="empty-state">加载中…</div>
  </div>
</div>

<footer>
  <p>诗歌漂流 · Poem's Ulysses</p>
  <p class="footer-stats">
    <span>浏览人次 <span class="bsz-num" id="busuanzi_value_site_pv">—</span></span>
    <span>访客数 <span class="bsz-num" id="busuanzi_value_site_uv">—</span></span>
  </p>
</footer>

<script>
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

// ===== 返回按钮（浏览器后退式，无历史回首页） =====
(function() {
  var back = document.getElementById('back-link');
  if (!back) return;
  back.addEventListener('click', function(e) {
    if (history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });
  // 若来自特定页面，更新返回标签
  var ref = document.referrer || '';
  if (ref.indexOf('authors.html') !== -1) {
    document.getElementById('back-label').textContent = '回到同志们';
  } else if (ref.indexOf('directory.html') !== -1 || ref.indexOf('read.html') !== -1) {
    document.getElementById('back-label').textContent = '返回';
  }
})();

// ===== 加载作者 =====
var id = new URLSearchParams(window.location.search).get('id');

Promise.all([
  fetch('data/authors.json?t=' + Date.now()).then(function(r) { return r.ok ? r.json() : []; }),
  fetch('data/poems.json?t=' + Date.now()).then(function(r) { return r.ok ? r.json() : []; })
]).then(function(res) {
  var authors = res[0];
  var poems = res[1];
  var author = authors.find(function(a) { return a.id === id; });
  var detail = document.getElementById('author-detail');

  if (!author) {
    detail.innerHTML = '<div class="empty-state">没找到这位同志，可能尚未题名。</div>';
    return;
  }
  document.title = author.name + ' · 同志们 · 诗歌漂流';

  // 归一化别名（name 也参与匹配，保证无别名作者也能聚合）
  var aliasMap = {};
  (author.aliases || []).forEach(function(al) { aliasMap[al] = author.id; });
  aliasMap[author.name] = author.id;

  // 该作者的作品
  var works = poems.filter(function(p) {
    return aliasMap[p.author] === author.id;
  });

  // 目录顺序（系列 → 系列内日期，与目录/阅读页一致）
  function getDateWeight(dateStr) {
    if (!dateStr || dateStr.trim() === '') return -1;
    var parts = dateStr.trim().split('-');
    var w = 0;
    if (parts[0]) w += 10000;
    if (parts[1]) w += 100;
    if (parts[2]) w += 1;
    return w;
  }
  var seriesOrder = [];
  var seenSeries = {};
  poems.forEach(function(p) {
    var s = p.series || '未分类';
    if (!seenSeries[s]) { seenSeries[s] = 1; seriesOrder.push(s); }
  });

  works.sort(function(a, b) {
    var sa = a.series || '未分类', sb = b.series || '未分类';
    var ia = seriesOrder.indexOf(sa), ib = seriesOrder.indexOf(sb);
    if (ia !== ib) return ia - ib;
    var wa = getDateWeight(a.date), wb = getDateWeight(b.date);
    if (wa !== wb) return wb - wa;
    return (a.date || '').localeCompare(b.date || '');
  });

  // 统计
  var seriesSet = {};
  var subSet = {};
  var dates = [];
  works.forEach(function(p) {
    seriesSet[p.series || '未分卷'] = true;
    if (p.subseries) subSet[p.subseries] = true;
    if (p.date && p.date !== '暂定') dates.push(p.date);
  });
  var firstDate = dates.length ? dates.slice().sort()[0] : null;
  var lastDate = dates.length ? dates.slice().sort().pop() : null;

  function fmtDate(d) {
    if (!d) return '—';
    var parts = d.trim().split('-');
    var y = parts[0], m = parts[1], dd = parts[2];
    if (!m) return y + '年';
    if (!dd) return y + '年' + parseInt(m, 10) + '月';
    return y + '年' + parseInt(m, 10) + '月' + parseInt(dd, 10) + '日';
  }

  // 标签
  var tagsHtml = '';
  if (author.tags && author.tags.length) {
    tagsHtml = '<div class="ah-tags">' + author.tags.map(function(t) {
      return '<span class="ah-tag">' + escapeHtml(t) + '</span>';
    }).join('') + '</div>';
  } else {
    tagsHtml = '<div class="ah-tags"><span class="ah-tag ph">待题记</span></div>';
  }

  // 简介
  var bioHtml;
  if (author.bio && author.bio.trim()) {
    bioHtml = '<p class="ah-bio">' + escapeHtml(author.bio) + '</p>';
  } else {
    bioHtml = '<p class="ah-bio ph">这位同志还没有留下题记。</p>';
  }

  // 别名行
  var aliasHtml = '';
  var displayAliases = author.aliases.filter(function(al) { return al !== author.name; });
  if (displayAliases.length) {
    aliasHtml = '<div class="ah-aliases">亦题作：' + displayAliases.join(' / ') + '</div>';
  }

  // 外部链接
  var linkHtml = '';
  if (author.link && author.link.trim()) {
    linkHtml = '<a class="ah-link" href="' + escapeHtml(author.link) + '" target="_blank" rel="noopener noreferrer">' +
      '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' +
      escapeHtml(author.link) + '</a>';
  }

  var stampChar = author.name.charAt(0);

  var html =
    '<div class="author-head reveal-up in-view">' +
      '<div class="ah-stamp" aria-hidden="true">' + escapeHtml(stampChar) + '</div>' +
      '<div class="ah-info">' +
        '<h1 class="ah-name">' + escapeHtml(author.name) + '</h1>' +
        aliasHtml +
        tagsHtml +
        '<div class="ah-stats">' +
          '<div class="ah-stat"><span class="num">' + works.length + '</span><span class="label">作品</span></div>' +
          '<div class="ah-stat"><span class="num">' + Object.keys(seriesSet).length + '</span><span class="label">卷</span></div>' +
          (Object.keys(subSet).length ? '<div class="ah-stat"><span class="num">' + Object.keys(subSet).length + '</span><span class="label">子分类</span></div>' : '') +
          '<div class="ah-stat"><span class="num">' + fmtDate(lastDate) + '</span><span class="label">最近</span></div>' +
        '</div>' +
        bioHtml +
        linkHtml +
      '</div>' +
    '</div>';

  // 作品列表（按系列 → 系列内日期；子分类以分组头呈现，与目录页一致）
  function workRowHtml(p) {
    var subTag = p.subseries ? '<span class="w-sub">' + escapeHtml(p.subseries) + '</span>' : '';
    return '<a class="work-row reveal-up" href="read.html?id=' + encodeURIComponent(p.id) + '">' +
        '<span class="w-date">' + escapeHtml(fmtDate(p.date)) + '</span>' +
        '<span class="w-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="w-series"><span class="clay">' + escapeHtml(p.series || '未分卷') + '</span>' + subTag + '</span>' +
      '</a>';
  }

  var worksHtml = '';
  if (works.length) {
    worksHtml = '<section class="works-section"><h2>作品</h2><div class="works-list">';
    var hasAnySub = works.some(function(p) { return p.subseries; });
    if (hasAnySub) {
      // 无子分类的直接行
      works.filter(function(p) { return !p.subseries; }).forEach(function(p) {
        worksHtml += workRowHtml(p);
      });
      // 子分类分组
      var subGroups = {};
      var subOrder = [];
      works.forEach(function(p) {
        if (!p.subseries) return;
        if (!subGroups[p.subseries]) { subGroups[p.subseries] = []; subOrder.push(p.subseries); }
        subGroups[p.subseries].push(p);
      });
      subOrder.forEach(function(sub) {
        worksHtml += '<div class="work-subhead">' + escapeHtml(sub) + ' <span class="ws-cnt">' + subGroups[sub].length + '</span></div>';
        subGroups[sub].forEach(function(p) { worksHtml += workRowHtml(p); });
      });
    } else {
      works.forEach(function(p) { worksHtml += workRowHtml(p); });
    }
    worksHtml += '</div></section>';
  } else {
    worksHtml = '<div class="empty-state">这位同志还没有作品漂流上岸。</div>';
  }

  detail.innerHTML = html + worksHtml;

  // 入场渐显
  var items = document.querySelectorAll('.reveal-up:not(.in-view)');
  if (!('IntersectionObserver' in window)) {
    items.forEach(function(el) { el.classList.add('in-view'); });
    return;
  }
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });
  items.forEach(function(el) { io.observe(el); });
}).catch(function() {
  document.getElementById('author-detail').innerHTML = '<div class="empty-state">未能加载，请稍后再试</div>';
});

// ============================================================
// 主题切换
// ============================================================
(function() {
  var btns = document.querySelectorAll('#theme-side .theme-btn');
  if (!btns.length) return;

  function isNightTime() {
    var hour = new Date().getHours();
    return (hour >= 19 || hour < 6);
  }
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('theme', theme);
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
  }
  var saved = localStorage.getItem('theme');
  var initial;
  if (saved && (saved === 'light' || saved === 'dark' || saved === 'eye-care')) {
    initial = saved;
  } else {
    initial = isNightTime() ? 'dark' : 'light';
  }
  applyTheme(initial);

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(this.getAttribute('data-theme'));
    });
  });

  var style = document.createElement('style');
  style.textContent = `
    [data-theme="dark"] {
      --paper: #1E1E1C;
      --paper-dark: #2A2A27;
      --ink: #ECECE5;
      --ink-light: #C4C4BE;
      --ink-faded: #8A8A85;
      --gold: #D4A373;
      --gold-light: #4A4A45;
      --clay: #E55A5F;
    }
    [data-theme="eye-care"] {
      --paper: #ECF3E5;
      --paper-dark: #DEE8D4;
      --ink: #3A4632;
      --ink-light: #5C6A4F;
      --ink-faded: #82906F;
      --gold: #BDA26C;
      --gold-light: #C6D3B4;
      --clay: #B2674F;
    }
    [data-theme="dark"] .side-theme,
    [data-theme="eye-care"] .side-theme {
      background: rgba(30, 30, 28, 0.7);
      border-color: var(--gold-light);
    }
  `;
  document.head.appendChild(style);
})();
</script>
